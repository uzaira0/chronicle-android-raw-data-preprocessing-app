openapi: 3.1.0
info:
  title: Chronicle Local Processing Contract
  version: 1.0.0
  description: Boundary contract for the local-only browser preprocessing surface.
    The canonical source-of-truth model lives in
    `web/schema/chronicle-local-contract.linkml.yaml`; this OpenAPI document is
    generated from that same contract.
servers:
  - url: http://local.worker.invalid
paths:
  /discover-timezones:
    post:
      operationId: discoverTimezones
      summary: Discover distinct timezone values from a raw Chronicle CSV payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverTimezonesRequest"
      responses:
        "200":
          description: Distinct timezone values found in the raw file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverTimezonesResponse"
  /process-raw-csv:
    post:
      operationId: processRawCsv
      summary: Process a raw Chronicle CSV file locally and return app and/or screen
        outputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRawCsvRequest"
      responses:
        "200":
          description: Preprocessing completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessedFileResult"
components:
  schemas:
    BrowserSupportFile:
      type: object
      required:
        - name
        - bytesBase64
      properties:
        name:
          type: string
        bytesBase64:
          type: string
          description: Base64-encoded file contents.
    BrowserSupportFiles:
      type: object
      properties:
        filterFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        appsForcingScreenOpenFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        backgroundAppsFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        appCodebookFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        studyDatesFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Study-dates table (CSV/XLSX): one or more rows per participant
            with the inclusive study-window start and end dates. Optional
            repeated rows add inclusive, source-labeled interior exclusions.
            Consumed by the observation-window step. Columns: participant_id,
            start_date, end_date; optional exclusion_label,
            exclusion_start_date, exclusion_end_date."
        deviceSharingFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: 'Device-sharing table (CSV/XLSX): the sharing status per device.
            Consumed by person attribution. Columns: participant_id,
            sharing_status ("Shared" or "Non-Shared"). Devices are matched
            exactly first, then by numerical id + device number (bare id =
            device 1); a configured table that misses a device is a hard error.'
        surveyAttributionFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Usage-survey answers (CSV/XLSX) that relabel a session's username
            at an exact event timestamp. Columns: participant_id,
            event_timestamp, users."
        enrolledDevicesFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Enrolled/expected device counts per participant (CSV/XLSX) — the
            denominator for compliance validity. Columns: participant_id,
            device_count."
        inputCapabilityEvidenceFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Optional immutable CSV evidence about whether the bound raw input
            can represent the Android screen/keyguard/device signals and
            physical source ordering required by source-sensitive screen-session
            strategies. It uses schema chronicle-input-capability-evidence/v1
            and is retained in a saved project when files are included, but is
            transported only when Parry-Toth or Zhu screen construction is an
            active output or an internal dependency of the Schoedel prose
            reconstruction. Absence reaches the scientific applicability
            resolver and is never converted into a generic missing-file error.
            There is no bundled default.
        analysisFeatureMatrixFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Paper-specific analysis feature matrix (CSV). Each feature_id is
            the unique feature-by-temporal-slice column identity. Columns:
            participant_id, feature_id, value, missing_state, feature_set_id."
        callSmsEligibilityFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Paper-specific Call/SMS eligibility and modality-availability rows
            (CSV) consumed only by registered research-method input adapters.
            There is no bundled default.
        phoneStudyPsCommunicationFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Released PhoneStudy ps_communication CSV keyed by id. This source
            table is transported as phonestudy_ps_communication_file only when
            method setting method-setting-faf89bac61ad22df438c751c selects the
            ps_activity relational join. It is distinct from the ES
            questionnaire base and has no bundled default.
        phoneStudyEsFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Released PhoneStudy ES questionnaire base CSV. Required columns are
            user_id and es_questionnaire_id. This source table is transported as
            phonestudy_es_file only for the registered PhoneStudy
            reconstruction, call-feature, or SMS-feature settings. It is
            distinct from ps_communication and has no bundled default.
        anchorEventsFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Anchor events CSV for registered research-method inputs. Required
            columns are participant_id and anchor_timestamp. There is no bundled
            default.
    BrowserProcessingRuntime:
      type: object
      properties:
        datetimeOfPreprocessing:
          type: string
          description: Internal/test-only fixed preprocessing timestamp used to make
            output stamping deterministic across runtimes. This is not intended
            as an end-user option.
      description: Internal/test-only runtime metadata that should not be surfaced as
        end-user options.
    BrowserProcessingOptions:
      type: object
      required:
        - studyName
        - processAppUsage
        - processScreenUsage
        - eventRetentionSet
        - openerSet
        - episodeReconstructionStrategy
        - microUseClassificationPolicy
        - allowStopEventReuse
        - useActivityStoppedAsFallback
        - applyThresholdToFallback
        - longDurationThresholdHours
        - correctDuplicateEventTimestamps
        - deduplicateExactRows
        - dropOutOfSourceOrderEvents
        - timezoneHandling
        - dayBoundaryAttribution
        - useFilterFile
        - filterMatchField
        - applicationLabelExclusions
        - packageExclusionPreset
        - useAppsForcingScreenOpenFile
        - useBackgroundAppsFile
        - useAppCodebook
        - includeCategoryColumn
        - includeAppUsageEndReason
        - enablePlotting
        - includeFilteredAppUsageInPlots
        - enableActivityHeatmap
        - exportPlotsAsSvg
        - enableAggregates
        - aggregateShape
        - aggregateTopAppsLimit
        - enableParticipantAmountSummary
        - enableParquetExport
        - enableSpssExport
        - neutralizeSpreadsheetFormulas
        - enableInteractiveTimeline
        - minimumUsageDuration
        - minimumDurationComparator
        - minimumDurationDisposition
        - filterZeroDurationSessions
        - intervalQualityPolicy
        - sessionGroupingPolicy
        - sessionGapBasis
        - sessionBoundaryScope
        - emitSessionBreakLineage
        - customAppEngagementDuration
        - longUsageDurationThresholds
        - longDataTimeGapThresholds
        - screenSessionConstructionStrategy
        - screenSessionClassificationPolicy
        - screenSessionMaximumDurationMinutes
        - screenSessionMaximumDurationDisposition
        - lockedScreenAudioDisposition
        - screenUsageAutoLockTimeoutSeconds
        - screenUsageAutoLockToleranceSeconds
        - screenUsageManualLockMaxTailGapSeconds
        - screenUsageKeyguardNearStopSeconds
        - parallelProcessing
        - sameAppInteractionTypesToStopUsageAt
        - otherInteractionTypesToStopUsageAt
        - modelConcurrentUsage
        - applyMinimumUsageDurationToConcurrentSubintervals
        - interactionTypesToRemove
        - interactionTypeRemovalMode
        - interactionTypeRemap
        - proximityIntervalSeconds
        - addNoActivityPlaceholderDays
        - enableScreenGatedCrediting
        - screenGatingRule
        - creditedSessionCapMinutes
        - deviceLivenessGapToleranceMinutes
        - autoLockBridgeSeconds
        - bridgeScreenOffToSessionEnd
        - noWitnessMinDayApps
        - notificationProxyRule
        - polledEmulationMethod
        - polledEmulationIntervalSeconds
        - polledEmulationGapSeconds
        - intervalExpansionMethod
        - enableStudyWindowFilter
        - enablePersonAttribution
        - enableComplianceScoring
        - complianceThresholdPercent
        - enableDayCoverage
      properties:
        studyName:
          type: string
          description: Your label for this study. Written into the `study_name` column of
            every output row. This is your own naming, not the `study_id` column
            from the raw data — that is preserved unchanged.
        processAppUsage:
          type: boolean
          description: Run the app-usage algorithm and include the app-usage CSV in the
            output ZIP. Each session spans from an Activity Resumed to its
            matching stop event.
        processScreenUsage:
          type: boolean
          description: Derive screen-usage sessions with the selected construction
            strategy and include the screen-usage CSV in the output ZIP. When
            this output is off, the selected screen strategy is still computed
            as a declared internal dependency if the Schoedel prose app
            reconstruction is active.
        eventRetentionSet:
          type: string
          enum:
            - none
            - parry_toth_7
            - usage_logger_5
            - toth_trifonova_app
            - foreground_background_only
          description: "Which published study's set of raw interaction types the app-usage
            reconstruction is allowed to see. This runs upstream of every other
            axis: it narrows the events before an episode is reconstructed, so
            one study's reconstruction rule can be replayed on the set of event
            types another study recorded. It does not narrow the screen-usage
            branch, which reads the full event stream. Every set except none is
            transcribed from a paper's description and is NOT checkable against
            anything in this repository — treat the retained-type lists as
            unverified. none is the default and retains every type, so output is
            byte-identical to before this option existed. parry_toth_7 keeps
            types 1, 15, 16, 17, 18, 26 and 27 — notably NOT Activity Paused
            (type 2), because that paper closes an episode on screen and device
            events rather than on the app going to background; this is a
            different thing from the parry_toth_forward_pairing reconstruction
            rule, which ports the adaptation that does close on type 2.
            usage_logger_5 keeps types 1, 2, 7, 26 and 27 and is the only set
            retaining User Interaction. toth_trifonova_app keeps types 1, 2, 17
            and 26 — type 17 is Keyguard Shown, the screen locking, not
            screen-on. foreground_background_only keeps just types 1 and 2, so
            every episode close is an observed app transition and nothing else;
            it is a strict subset of usage_logger_5 and toth_trifonova_app but
            not of parry_toth_7, which drops type 2. An unrecognised value
            resolves to none, which widens rather than narrows, so a bad value
            can never silently delete events."
        openerSet:
          type: string
          enum:
            - strategy_defined
            - activity_resumed_only
            - gesis_app_scoped_starts
          description: "Which retained, app-scoped event rows may begin an app episode.
            This is a separate axis between event retention and reconstruction:
            B01 decides which rows reach app reconstruction, while this option
            only marks those retained rows as opener-eligible. Non-opener rows
            remain available to close, bound, explain, or censor an episode.
            strategy_defined is the compatibility default and preserves each
            reconstruction strategy's native opener and materializer behavior.
            activity_resumed_only admits canonical Android type 1 (Activity
            Resumed / Move to Foreground), including Chronicle's filtered
            equivalent after normalization. gesis_app_scoped_starts is a
            GESIS-derived adapter, not a verbatim source method: it begins with
            source membership {1, 4, 11, 14, 15, 18, 19, 22, 27} and intersects
            it with app-scoped Android event semantics, yielding effective
            membership {1, 4, 11, 14, 19, 22}. Device-scoped types 15, 18, and
            27 never open app credit. Closer selection, repair, and
            unmatched-open behavior remain with the selected reconstruction
            strategy; package handling remains with that strategy and the
            separate package-policy axis. Browser persistence and import
            sanitization resolve unknown strings, wrong JSON types, null, and
            missing values to strategy_defined. Direct runtime requests remain
            schema-typed: non-string values are rejected, while unknown strings
            resolve to strategy_defined."
        episodeReconstructionStrategy:
          type: string
          enum:
            - parry_toth_forward_pairing
            - fused_matcher
            - eyes_complement
            - gesis_start_stop_repair
            - foreground_background_pairing
            - draxler_interruption_aware
            - morrison_lock_tolerant
            - schoedel_2026_app_within_screen_prose_v1
          description: "Which published rule turns raw event rows into app episodes.
            fused_matcher is this engine's own open/close matcher and the
            default; output is byte-identical to before this option existed.
            parry_toth_forward_pairing is Parry & Toth (2025): only Activity
            Resumed is read, Activity Stopped is discarded, and an episode ends
            where the next one begins. eyes_complement segments the device-state
            timeline first — ACTIVE is what is left after shutdown, idle, gap
            and glance are removed — and reconstructs episodes against it,
            repairing an orphaned episode forward onto the next app's resume.
            gesis_start_stop_repair is the GESIS/Zerrer tutorial rule: it reads
            a much wider event vocabulary (screen, keyguard and device-power
            rows are starts and stops), and ends each episode at the nearest
            same-package stop, else the next event of any kind, else a fixed 600
            s cut — so under this rule no episode is ever left without an end.
            foreground_background_pairing subtracts and repairs nothing: each
            Activity Resumed is closed by the next Activity Paused of the same
            package, and a resume that never pauses yields no episode at all.
            Ahmed et al. (2023) and Okoshi et al. (2025) both describe exactly
            this, and on Chronicle's event vocabulary they are the same rule, so
            one arm carries both; what differs between those papers is their
            session and micro-use handling, which are separate options.
            draxler_interruption_aware is Draxler et al. (2021): an episode ends
            at whichever comes first of its own package backgrounding, the
            screen going off, or ten minutes of inactivity — the only rule here
            under which a screen event ends an app episode, and the only one
            that cuts an episode at the last event actually observed before a
            silence rather than at the event that breaks it.
            morrison_lock_tolerant is Morrison et al. (2018): a use ends on a
            handover or on the screen locking, but only if the screen stays off
            for thirty seconds — a shorter lock is a pocket-check and the use
            runs through it. Returning to the same app after a lock that did
            count starts a new use rather than resuming the old one. The thirty
            seconds is inherited by name and value from Bohmer et al. (2011).
            schoedel_2026_app_within_screen_prose_v1 is a controlled derivative
            of Schoedel et al. (2026)'s simplified published prose: it consumes
            the selected screen-session intervals and closes app A at A's last
            logged row before a different-app type-1 row or an observed screen
            end. It is not the full deposited PhoneStudy pipeline, which remains
            structurally unavailable on ordinary Chronicle input."
        microUseClassificationPolicy:
          type: string
          enum:
            - none
            - okoshi_lt_5s
          description: Non-destructively classify an already reconstructed app episode.
            none is the compatibility default and emits no scientific CSV
            column. okoshi_lt_5s labels a positive, bounded raw reconstructed
            duration as micro_use only when it is strictly below five seconds;
            equality is not_micro_use, while a zero-length artifact or unbounded
            episode is not_classifiable. This option never changes duration,
            boundaries, inclusion, grouping, or aggregate credit; the separate
            minimum-duration controls own analytical disposition.
        allowStopEventReuse:
          type: boolean
          description: Lets a single stop event close multiple overlapping sessions. Off
            by default — stop events are consumed once.
        useActivityStoppedAsFallback:
          type: boolean
          description: If a session has no explicit stop, fall back to the next Activity
            Stopped event for the same app. Helps with noisy traces.
        applyThresholdToFallback:
          type: boolean
          description: When the fallback path is used and the implied session is longer
            than the max threshold above, treat it as a missing-end-of-usage
            instead of a real session.
        longDurationThresholdHours:
          type: number
          description: Sessions longer than this many hours are flagged as suspiciously
            long, which may indicate an instrumentation gap rather than real
            use.
        longDurationThresholdHoursExplicit:
          type: boolean
          description: "Origin marker: true once the max session duration threshold has
            been typed in for this configuration, absent while it still carries
            the 12-hour default. It changes no computation on its own; the
            maximum-duration receipt records whether the legacy hours were an
            explicit choice or the inherited default."
        maximumDurationPolicy:
          type: string
          enum:
            - strategy_native
            - chronicle_observed_close_rejection_v1
            - post_reconstruction_strict_max_v1
          description: Optional. Absent means Chronicle's legacy behaviour runs exactly as
            before with no receipt. strategy_native adopts the selected
            reconstruction strategy's own maximum-duration behaviour explicitly;
            chronicle_observed_close_rejection_v1 names the fused matcher's
            candidate-rejection rule (fused_matcher only);
            post_reconstruction_strict_max_v1 qualifies episodes strictly longer
            than the threshold after reconstruction and applies the configured
            disposition. Selecting a policy also requires the disposition and
            threshold source.
        maximumDurationDisposition:
          type: string
          enum:
            - not_applicable
            - flag_and_retain
            - retain_but_exclude
            - truncate_to_threshold
            - drop_row
          description: Optional; only read by post_reconstruction_strict_max_v1 (the other
            policies require not_applicable). flag_and_retain keeps and credits
            the episode; retain_but_exclude keeps the row but excludes it from
            headline aggregates; truncate_to_threshold moves the effective stop
            to start + threshold and records the trimmed time; drop_row removes
            the row but preserves exact excluded lineage in the receipt.
        maximumDurationThresholdSource:
          type: string
          enum:
            - strategy_native
            - chronicle_legacy_config
            - fixed_parameter
            - b12_adaptive_participant
          description: Optional; each policy accepts one pairing. strategy_native goes
            with the strategy_native policy; chronicle_legacy_config goes with
            chronicle_observed_close_rejection_v1 and reuses the max session
            duration threshold above, canonicalized exactly to nanoseconds;
            fixed_parameter (reads the nanosecond threshold below) and
            b12_adaptive_participant (refuses until the adaptive provider lands)
            go with post_reconstruction_strict_max_v1.
        maximumDurationThresholdNs:
          type: string
          description: Optional; required by fixed_parameter and refused by every other
            source. Exact base-10 nanoseconds without sign, decimal point,
            exponent, or leading zeros, at most 9223372036854775807. Kept as
            text so the value is never rounded through a JavaScript number.
        correctDuplicateEventTimestamps:
          type: boolean
          description: When two events share the same timestamp, nudge the second one
            forward by microseconds so ordering is preserved deterministically.
        deduplicateExactRows:
          type: boolean
          description: Drop fully-identical raw events (same participant, timestamp, app,
            and interaction type) before processing. Re-exported Chronicle data
            often repeats rows verbatim; the first occurrence is kept. Turn this
            off to keep every raw row as-is.
        dropOutOfSourceOrderEvents:
          type: boolean
          description: Drop an event when its timestamp moves backward relative to an
            earlier event for the same participant in the original input row
            order. This is the post-processing rule reported by Harbach, De
            Luca, and Egelman; leave it off to preserve Chronicle's normal
            behavior of retaining and sorting every row.
        selectedTimezone:
          type: string
          description: Pick from the typical IANA names (e.g. America/Chicago). When
            discovery runs, found timezones from your file are added to the
            suggestions.
        timezoneHandling:
          type: string
          enum:
            - selected-filter
            - selected-convert
            - primary-filter
            - primary-convert
          description: Decides what happens to rows with timezones that differ from the
            selected one — keep only the matching rows, convert mixed rows to a
            common zone, or anchor on the file's primary zone. The default
            converts every row to the selected zone, so no row is dropped for
            carrying a different timezone and all day attribution is on one
            clock; it is what the studies' locked configuration runs, and it
            matches the kernel's absent-key default.
        dayBoundaryAttribution:
          type: string
          enum:
            - attribute_to_start_day
            - split_at_local_midnight
          description: How a session that runs past local midnight is attributed to
            calendar days. attribute_to_start_day (the default) keeps the
            session as one row dated by the day it started, so a 23:40-00:20
            session puts all forty minutes on the first day.
            split_at_local_midnight divides it into one row per day, each with
            its own start, stop, duration and date and all carrying the same raw
            evidence, so daily totals sum the time that actually fell within
            each day. Midnight is resolved in the row's output timezone through
            that zone's own transitions, so a daylight-saving day is 23 or 25
            hours.
        useFilterFile:
          type: boolean
          description: "If on, the pipeline labels apps in your filter list as filtered
            (instead of dropping them). Without an uploaded file the app falls
            back to the bundled default. Off by default: this is an app-policy
            (cleaning) decision, not part of standard preprocessing — enable it
            only when your study's protocol says to."
        filterMatchField:
          type: string
          enum:
            - app_package_name
            - application_label
          description: Selects the identity column used by the filter file.
            app_package_name preserves the existing package rules.
            application_label matches the application_label cell by exact,
            case-sensitive, full-string equality; it never infers a package,
            folds case, or matches a substring. Label matches retain their
            source rows as filtered lineage while excluding only those matched
            rows from headline app-usage aggregates.
        applicationLabelExclusions:
          type: array
          items:
            type: string
          description: Application labels to retain as filtered lineage while excluding
            them from headline app-usage aggregates. Every entry uses exact,
            case-sensitive, full-string equality against application_label;
            package identity, case folding, and substring matching are never
            inferred.
        packageExclusionPreset:
          type: string
          enum:
            - all_supplied_rows
            - honor_filter_flag
            - system_scope_only
          description: Which rows of your filter file actually exclude a package.
            all_supplied_rows (the default) excludes every row, whatever its
            category or filter flag — this is what the app has always done.
            honor_filter_flag respects the filter_bool column, so a row you set
            to 0 stops excluding. system_scope_only excludes just the system and
            system-defensive rows (60 of the 80 in the bundled default list),
            leaving carrier, audio, navigation and the rest measured as ordinary
            app usage. Excluded apps are always relabelled rather than deleted,
            so this changes app-usage totals and never changes how sessions are
            reconstructed. Only applies when "Use filter file" is on.
        useAppsForcingScreenOpenFile:
          type: boolean
          description: "Apps in this list are treated as ones that force the screen to
            stay on during screen-usage derivation, which influences how
            locks/unlocks are interpreted. The practice is a documented one in
            the literature: Dekker et al. (2024) removed screen-forcing apps
            (their cases were YouTube Vanced and Basic Daydreams) from
            screen-time estimates for exactly this reason."
        useBackgroundAppsFile:
          type: boolean
          description: Apps in this list (e.g. music, navigation) keep running after they
            are backgrounded. Their app-usage session is not closed when they
            are paused or when another app comes to the foreground; it stays
            alive until that app's own Activity Stopped. The resulting overlap
            with the foreground app is resolved into primary/secondary layers
            (the concurrent-usage split is applied automatically when this is
            on). Without an uploaded file the bundled default is used.
        useAppCodebook:
          type: boolean
          description: Enriches each output row with category metadata from the codebook
            (Play Store genre, USC category, UMich classifications, etc.).
            Without an uploaded codebook the bundled default is used.
        includeCategoryColumn:
          type: boolean
          description: Add the normalized broad app category (the same value used to
            colour the plots — Games, Education, Social & Communication, …) as a
            `broad_app_category` column in the app-usage output. Derived by
            coalescing the codebook's per-source category columns and mapping
            them onto the standard palette. Requires the app codebook; off by
            default.
        includeAppUsageEndReason:
          type: boolean
          description: Add an `app_usage_end_reason` column recording WHY each app episode
            ended — a stop event was recorded, another app opened, the screen
            turned off, an inactivity timeout cut it, or nothing observable
            ended it at all. This is how you tell a real observed end from a
            repaired or inferred one, which otherwise looks identical in the
            duration column. The cell always describes what happened to the
            device, never which reconstruction rule noticed it. On by default;
            turn it off only if a downstream consumer requires the narrower
            column set.
        enablePlotting:
          type: boolean
          description: After preprocessing, renders one horizontal-bar timeline chart per
            participant and includes the PNGs in the output ZIP. Each bar is
            coloured by app category.
        includeFilteredAppUsageInPlots:
          type: boolean
          description: When on, bars for apps that were filtered (but retained in the
            output) are drawn alongside normal app-usage bars.
        enableActivityHeatmap:
          type: boolean
          description: Alongside the timeline chart, render an hour-of-day × calendar-day
            heatmap PNG per participant showing when app usage happened. Only
            applies when plot generation is on. Turn off to keep just the
            timeline charts (one fewer PNG per participant).
        exportPlotsAsSvg:
          type: boolean
          description: In addition to the PNG charts, write a scalable vector SVG of each
            plot (timeline, and heatmap when enabled) into the output ZIP. SVGs
            stay sharp at any zoom and are editable in vector tools. Off by
            default to avoid adding a second file per plot. Only applies when
            plot generation is on.
        enableAggregates:
          type: boolean
          description: "Emit extra summary CSVs alongside the per-session output: a daily
            and weekly summary (screen/app time, session counts, app switches,
            pickups, mean & longest session, first/last use), a per-app
            breakdown, a per-category time budget (when a codebook is loaded),
            and an app co-usage matrix (when concurrent usage is modeled). Off
            by default."
        aggregateShape:
          type: string
          enum:
            - wide
            - long
          description: 'Layout for the daily/weekly summaries — "wide" (one row per
            period, metrics as columns) or "long" (tidy: one row per period per
            metric). The per-app, category, and co-usage outputs are always
            long.'
        aggregateTopAppsLimit:
          type: integer
          description: Maximum number of ranked apps emitted per participant-day in the
            top-app aggregate. Zero preserves the complete ranking; a positive
            value keeps exactly that many rows after descending usage-time
            ranking and the package-name tie-break.
        enableParticipantAmountSummary:
          type: boolean
          description: "Emit one extra CSV with one row per participant: days tracked
            (days with any raw data, used or not), total app-usage minutes, the
            daily average (total over days tracked — the amount-of-use measure
            of Wenz, Keusch & Bach 2024), that average winsorized at this
            export's own 1st/99th percentiles (their footnoted treatment; the
            realized cut values are published on every row), and a Huber M
            estimate of the same per-day series (the robust aggregation Stachl
            et al. 2020 describe, standard constants). The estimators are
            side-by-side columns, so choosing between them is an analysis
            decision made on the export, not a preprocessing fork. Off by
            default; when off the file is absent and output is byte-identical."
        enableParquetExport:
          type: boolean
          description: In addition to the CSV outputs, write each app-usage and
            screen-usage table as an Apache Parquet file (typed columns, smaller
            and far faster to load in R/Python via arrow/polars/pandas). Same
            rows and columns as the CSV, with native dtypes preserved
            (timestamps stay as formatted strings). Off by default.
        enableSpssExport:
          type: boolean
          description: In addition to the CSV outputs, write each app-usage and
            screen-usage table as an SPSS/PSPP system file (.sav) with typed
            variables and the column names as variable labels — open it directly
            in SPSS or PSPP. Same rows and columns as the CSV. Off by default.
            (Stata .dta is not yet supported.)
        neutralizeSpreadsheetFormulas:
          type: boolean
          description: "Excel, LibreOffice and Google Sheets run a CSV cell that starts
            with =, +, -, @, a tab or a carriage return as a formula. App names,
            usernames and participant IDs are copied from your raw export, so a
            cell such as =HYPERLINK(...) can run when someone opens a downloaded
            file. When on, every such text cell in the preprocessing CSV tables
            (app usage, screen usage, credited usage, day coverage, compliance,
            notification contacts, polled emulation, interval expansion and the
            summary tables) gets a leading apostrophe ('), which spreadsheets
            read as \"this is text\". Cells that are plain numbers, such as -5,
            are never changed. The literature-method downloads (Preserved Source
            Fields and literature result tables) are not rewritten. This changes
            the data: an analysis script (R, Python, SPSS) will read the
            apostrophe as part of the value, and the Parquet and SPSS files
            built from these CSVs carry it too. Off by default, which leaves
            every value exactly as it was in the input."
        enableInteractiveTimeline:
          type: boolean
          description: Show an in-browser zoomable/pannable timeline of every session (app
            and screen), coloured by app category, with hover details — rendered
            live in the results panel from a compact per-session payload. This
            payload is only produced when the option is on, to avoid bloating
            results for large cohorts. Off by default.
        minimumUsageDuration:
          type: integer
          description: Numeric threshold used by the independently selected
            minimum-duration comparator and disposition. It is evaluated once on
            immutable raw reconstructed episode duration after materialization
            and before optional concurrency splitting or cleaning. Set to 0 to
            disable qualification for every disposition. The separate existing
            concurrent-subinterval option controls any later floor on generated
            sub-intervals.
        minimumDurationComparator:
          type: string
          enum:
            - strict_lt
            - inclusive_le
          description: Choose whether an episode qualifies only when its raw duration is
            strictly below the threshold (strict_lt, compatibility default) or
            when equality also qualifies (inclusive_le). Comparison uses integer
            nanoseconds at the post-materialization, pre-concurrency checkpoint.
        minimumDurationDisposition:
          type: string
          enum:
            - chronicle_blank_keep_row
            - retain_and_credit
            - retain_but_exclude
            - drop_row
          description: Choose what happens to a threshold-qualified episode.
            chronicle_blank_keep_row preserves compatibility by retaining
            boundaries while blanking duration; retain_and_credit preserves and
            credits raw timing; retain_but_exclude preserves the audit row but
            excludes it from headline aggregates through explicit eligibility;
            drop_row removes the output row but preserves exact excluded
            lineage. No disposition fabricates a zero duration, and this axis is
            independent of micro-use classification.
        filterZeroDurationSessions:
          type: boolean
          description: Removes app-usage session rows whose computed duration is exactly
            zero or negative. These arise from duplicate events at the same
            millisecond, common on Fire tablets.
        intervalQualityPolicy:
          type: string
          enum:
            - none
            - culverhouse_trim_and_log
          description: "Which published policy bounds the quality of already-reconstructed
            intervals. This is a different axis from the episode reconstruction
            rule: reconstruction decides where an episode starts and ends, this
            decides what to do about an episode that is already reconstructed
            and is implausible. none is this engine's own interval cleaning and
            the default; output is byte-identical to before this option existed.
            culverhouse_trim_and_log is the Culverhouse
            chronicle-preprocessed-cleaning program, which never redefines
            episodes: adjacent same-app rows within 1 s collapse into one usage,
            a bad-app row is capped at 10 minutes and credited rather than
            blanked, a row of 3 h or more is flagged long-3h, a row of 6 h or
            more is flagged long-6h instead and truncated to the same 10-minute
            cap, and each participant's first and last day plus the days around
            a gap of 12 h or more are flagged partial, as are days carrying a
            clock change. Every mutation is stamped into the row's flag column
            and nothing is deleted."
        sessionGroupingPolicy:
          type: string
          enum:
            - none
            - church_5s
            - smartphone_wellbeing_strict_lt_5s
            - grosse_deters_10s
            - ross_15s
            - van_berkel_45s
            - zerrer_60s
            - peng_zhu_2020_participant_median
          description: "Which published rule groups already-reconstructed app episodes
            into usage sessions. A third axis, crossed with the reconstruction
            rule rather than part of it: Ahmed et al. (2023) and Okoshi et al.
            (2025) reconstruct episodes identically and differ only here. When
            set to anything other than none, a usage_session_id column is added
            to the app-usage CSV, numbered from 0 within each participant. none
            is the default and emits no column, so output is byte-identical to
            before this option existed. Every policy compares the gap from one
            episode's stop to the next episode's start against a published
            constant, and they differ in the constant, in the comparison, and in
            whether anything besides the gap ends a session. Apps are not
            distinguished unless a policy says otherwise. church_5s is 5
            seconds, reported second-hand by van Berkel et al. and the weakest
            provenance in the set. grosse_deters_10s is 10 seconds, published as
            a merge of sessions within ten seconds.
            smartphone_wellbeing_strict_lt_5s is the deposited
            SmartphoneUsage_Wellbeing code's exact `diff.to.previous < 5` rule:
            a 4.999999999 second gap joins and a gap exactly equal to 5 seconds
            splits. ross_15s is 15 seconds, also splits on equality, and is the
            only one where a change of foreground app also ends a session
            regardless of the gap. van_berkel_45s retains a legacy identifier
            for Chronicle's app-episode grouping: gaps <=45 seconds join and
            gaps >45 seconds split. It is not van Berkel's source-exact Constant
            Classifier, which classifies supplied device-session gaps as
            continuous only when Gap<T, new otherwise, against participant
            objective-continuation labels. Their 45-second recommendation is
            sample/objective-specific and explicitly not generalizable. Citation
            of the constant does not establish identical inputs, pipeline stage
            or equality semantics in a later paper. zerrer_60s is 60 seconds;
            that source's prose says \"at least 60 seconds\" while its code says
            greater-than 60, and the code is what produced its published
            numbers. peng_zhu_2020_participant_median is the only individualized
            member: Peng & Zhu (2020) adopt \"the median score of a user's
            inter-app intervals ... for each user\", so the threshold is derived
            per participant from that participant's own stop-to-next-start
            intervals rather than quoted as a constant, a gap exactly equal to
            the median splits (their \"smaller than ... joins\"), and with
            session-break lineage on each participant's derived median and
            interval count are stamped into the first row of the partition so
            the threshold is reconstructible from the export."
        sessionGapBasis:
          type: string
          enum:
            - previous_episode_stop_v1
            - session_running_maximum_stop_v1
          description: "Which endpoint the session gap is measured from. Only read when a
            session grouping policy is selected. Every published rule measures
            from the immediately preceding episode's stop in start order, which
            is the default and keeps output byte-identical. That reading assumes
            episodes never overlap, and Chronicle's event stream does not
            guarantee that: modelling concurrent usage is off by default, so an
            episode nested inside a longer one reaches grouping intact and
            becomes the point the next gap is measured from. A 30 minute episode
            with a 1 minute episode nested at its start, followed by a third
            episode 20 seconds after the long one ends, is measured as a 28
            minute 20 second gap and split under a 60 second rule even though
            the screen was covered continuously. Setting
            session_running_maximum_stop_v1 measures instead from the furthest
            stop already placed in the session, so a nested episode can no
            longer pull the measuring point backwards. That is a stated
            departure from all published rules rather than a correction of them,
            which is why it is opt-in."
        sessionBoundaryScope:
          type: string
          enum:
            - participant_v1
            - participant_and_study_v1
            - participant_study_and_person_v1
          description: "Which rows are numbered as one sequence of sessions. Only read
            when a session grouping policy is selected. The default,
            participant_v1, partitions by participant id alone, which is what
            the engine has always done. Both other dimensions of the published
            classification key vary within a participant: username is a raw
            per-row Chronicle column, and nothing constrains one export to a
            single study id. A foreign row landing inside a participant's
            silence therefore bridges it and the participant's session is never
            split. Person attribution already retypes a shared device's
            non-target rows so grouping skips them, but that runs only when a
            device-sharing file is configured. participant_and_study_v1 adds
            study id; participant_study_and_person_v1 also adds username. The
            scopes nest, so widening can only split a sequence further and can
            never merge two."
        emitSessionBreakLineage:
          type: boolean
          description: "Stamp each numbered episode with the rule that placed it, in the
            existing any_app_usage_flags column: whether the session opened,
            joined or broke, the observed gap in seconds, and whether a change
            of foreground app was also responsible. Only read when a session
            grouping policy is selected. Off by default, and with it off no flag
            is written, so the app-usage CSV is byte-identical. The lineage
            rides in an existing column rather than a new one, so a run with it
            on stays schema-compatible with a run with it off."
        customAppEngagementDuration:
          type: integer
          description: Window in seconds within which two consecutive activities on the
            same app count as continued engagement. Affects how first new
            engagement is detected.
        longUsageDurationThresholds:
          type: array
          items:
            type: integer
          description: Comma-separated hour values. For each value the pipeline emits a
            column flagging sessions whose duration exceeds it.
        longDataTimeGapThresholds:
          type: array
          items:
            type: integer
          description: Comma-separated hour values. For each value the pipeline emits a
            column flagging time gaps between events that exceed it.
        screenSessionConstructionStrategy:
          type: string
          enum:
            - chronicle_screen_interactive_v1
            - parry_toth_2025_session_glance_v1
            - zhu_2018_unlock_lock_v1
            - unlock_to_lock_v1
            - unlock_to_off_or_lock_v1
          description: Which device-level rule constructs screen intervals.
            chronicle_screen_interactive_v1 is the compatibility default and
            freezes Chronicle's participant-isolated interactive/non-interactive
            state machine. parry_toth_2025_session_glance_v1 preserves physical
            order in a screen-only projection of separate Android types 15-18
            and 26-27 and distinguishes sessions from locked glances.
            zhu_2018_unlock_lock_v1 requires immediate screen-on to
            keyguard-hidden adjacency in the complete unfiltered participant
            log, starts at unlock, and stops at screen-off or shutdown.
            unlock_to_lock_v1 opens directly at keyguard-hidden and closes at
            keyguard-shown. unlock_to_off_or_lock_v1 closes that direct-unlock
            interval at the first keyguard-shown or screen-non-interactive
            event. The four source-sensitive arms require a digest-bound input
            capability evidence CSV and fail with a typed scientific refusal
            when signal, ordering, completeness, or device-scope evidence is
            unavailable; they never fall back to Chronicle.
        screenSessionClassificationPolicy:
          type: string
          enum:
            - none
            - phone_check_inclusive_15s
            - null_no_app_strict_gt15s_vs_app
          description: Optional literature classification applied after screen-session
            construction. phone_check_inclusive_15s labels sessions lasting at
            most 15 seconds as phone checks. null_no_app_strict_gt15s_vs_app
            labels sessions with foreground-app evidence as app and no-app
            sessions longer than 15 seconds as null.
        screenSessionMaximumDurationMinutes:
          type: number
          description: Duration used when the screen-session maximum-duration disposition
            is truncate or exclude_participant. Zero disables the cap.
        screenSessionMaximumDurationDisposition:
          type: string
          enum:
            - none
            - truncate
            - exclude_participant
          description: none preserves the constructed interval. truncate shortens only
            sessions strictly longer than the configured maximum and records the
            synthetic cap boundary. exclude_participant removes every analytical
            output for a participant with any completed interval strictly over
            the maximum.
        lockedScreenAudioDisposition:
          type: string
          enum:
            - include
            - exclude_from_phone_and_app_sessions
          description: Whether app activity observed while the screen remains locked can
            create a phone or app session. The exclusion arm requires an
            interactive, unlocked screen witness.
        screenUsageAutoLockTimeoutSeconds:
          type: integer
          description: Idle period after which the screen is assumed to have auto-locked.
            Used to infer screen-off time when an explicit lock is missing.
        screenUsageAutoLockToleranceSeconds:
          type: integer
          description: Slack window around the auto-lock timeout to absorb small clock
            skews when classifying lock events.
        screenUsageManualLockMaxTailGapSeconds:
          type: integer
          description: Maximum allowed gap between the last meaningful activity and an
            explicit lock event for the lock to count as manual.
        screenUsageKeyguardNearStopSeconds:
          type: integer
          description: If the keyguard appears within this many seconds of a session stop,
            treat it as part of the same lock event.
        parallelProcessing:
          type: boolean
          description: When this is on, the app can process more than one uploaded raw
            file at the same time. It usually helps only when you upload
            multiple files; one file still runs by itself.
        parallelMaxWorkers:
          type: integer
          description: The maximum number of files the app may process at the same time.
            Use 0 to let the app choose a safe number based on file sizes and
            browser capacity. Lower it if the browser becomes slow or
            memory-heavy.
        sameAppInteractionTypesToStopUsageAt:
          type: array
          items:
            type: string
          description: Interaction types that, when seen for the same app as the current
            session, end that session.
        otherInteractionTypesToStopUsageAt:
          type: array
          items:
            type: string
          description: Interaction types from any other source that close the current
            session — e.g. a different app coming to the foreground or the
            device shutting down. "End of Usage Missing" is an unmatched
            foreground/resume (the app came to the foreground; only its close
            was never seen), so it also displaces whatever was foreground and
            must interrupt other app usage — without it an unmatched filtered
            foreground silently stopped interrupting valid sessions only when
            the filter was on (the two-pass interrupt leak).
        modelConcurrentUsage:
          type: boolean
          description: When enabled, an app session runs to its own stop event instead of
            ending when another app is foregrounded. Overlapping sessions are
            split into a primary (sole-foreground) layer and a secondary
            (running-underneath / PiP) layer, reported via the usage_layer
            column. Default off; output is unchanged when off.
        applyMinimumUsageDurationToConcurrentSubintervals:
          type: boolean
          description: "Only relevant when model_concurrent_usage is on. When enabled, a
            split primary/secondary sub-interval shorter than
            minimum_usage_duration has its duration_seconds/duration_minutes
            nulled (the row is kept). Off by default, so this second,
            sub-interval floor is not applied. The minimum-duration decision
            itself is made once on the whole raw episode, before splitting:
            under the chronicle_blank_keep_row disposition, every sub-interval
            of an episode below the floor inherits that blank, and sub-intervals
            of an episode above it are always populated."
        interactionTypesToRemove:
          type: array
          items:
            type: string
          description: Rows of these types are dropped from the final output. Useful for
            stripping noisy events you don't want surfaced in the CSV.
        interactionTypeRemovalMode:
          type: string
          enum:
            - gap_preserving
            - unconditional
          description: gap_preserving keeps a selected row when it carries long-data-gap
            evidence at or above the smallest configured threshold.
            unconditional drops every selected row and reproduces source filters
            such as SmartphoneUsage_Wellbeing's removal of
            STANDBY_BUCKET_CHANGED.
        interactionTypeRemap:
          type: array
          items:
            type: string
          description: Map vendor-specific raw interaction_type strings onto the canonical
            names the pipeline understands (e.g. Activity Resumed / Activity
            Paused / Activity Stopped), for non-standard Chronicle exports. Each
            entry is "Raw value => Canonical name". Applied before the built-in
            mapping, so it also overrides built-ins. Default empty.
        proximityIntervalSeconds:
          type: number
          description: When greater than 0, an Activity Stopped fallback close landing
            within this many seconds of a re-resumed session's start is treated
            as an intra-app teardown artifact (the app was torn down then
            immediately re-resumed) rather than a real close, so the session
            stays open for the next genuine stop event. Set to 0 to disable,
            which reproduces the pre-proximity output byte for byte. The
            2-second default matches the studies' locked preprocessing
            configuration.
        addNoActivityPlaceholderDays:
          type: boolean
          description: For each participant, any calendar day that has raw event data but
            produces no app-usage sessions gets one zero-duration placeholder
            row (com.placeholder.noactivity) so day-level summaries can
            distinguish a genuine no-use day from a day with no data at all. The
            window is derived from the participant's own data (first to last day
            with raw events). Default off.
        enableScreenGatedCrediting:
          type: boolean
          description: Emit an additional, side-by-side "Credited App Usage" CSV in which
            each app session is reduced to the intervals where the screen was
            witnessed ON and the device was demonstrably alive (event cadence
            within the liveness tolerance), truncated at the credited-session
            cap. The headline app-usage output is never changed by this option.
            Long held-open sessions are credited only while the device was
            actually lit and alive. Off by default.
        screenGatingRule:
          type: string
          enum:
            - screen_and_liveness_v1
            - screen_witness_only
            - strict_visual_only
            - device_liveness_only
          description: Which observation the credited output rests on.
            screen_and_liveness_v1 (the default) credits only where a witnessed
            screen-ON interval overlaps a demonstrably-alive span.
            screen_witness_only drops the liveness requirement, so a lit screen
            inside a long event silence still earns credit. strict_visual_only
            also uses screen witness alone but excludes sessions with no witness
            instead of using the alive-span fallback. device_liveness_only drops
            the screen requirement and credits alive spans alone, which makes it
            an activity-based measurement and means the no-witness fallback
            never applies. Only the side-by-side credited output changes; the
            headline app-usage output is never affected.
        creditedSessionCapMinutes:
          type: integer
          description: Upper bound on any single credited session interval. Credit is
            truncated at this many minutes from the session start (never zeroed
            out).
        deviceLivenessGapToleranceMinutes:
          type: integer
          description: An event silence shorter than this keeps the device "alive" for
            crediting; a longer silence breaks the chain. A Device Startup
            landing inside a silence always breaks it (a boot proves the device
            was off).
        autoLockBridgeSeconds:
          type: integer
          description: A screen-OFF blip shorter than this cannot be the device auto-lock,
            so credit bridges across it (screen bounce, not a real lock).
        bridgeScreenOffToSessionEnd:
          type: boolean
          description: "When deciding whether a screen-OFF gap is short enough to bridge,
            measure only the part inside the app session instead of up to when
            the screen comes back on. This is the TECH/GNSM studies' rule: a
            screen-off that starts just before a session ends is bridged to the
            session end even when the screen stays off afterwards. Off by
            default."
        noWitnessMinDayApps:
          type: integer
          description: When a session has no screen witness at all, credit its alive time
            only if the participant-day switched across at least this many
            distinct apps (you cannot switch apps on a dark screen). Below the
            floor, the session earns no credit.
        notificationProxyRule:
          type: string
          enum:
            - none
            - seen_contact_v1
            - interruption_contact_v1
            - any_notification_contact_v1
          description: Whether raw notification events become explicit proxy "contact"
            rows. Chronicle logs Notification Seen and Notification Interruption
            against a package, and the app-usage algorithm reads neither, so
            today those rows produce nothing at all. none (the default) keeps it
            that way. seen_contact_v1, interruption_contact_v1 and
            any_notification_contact_v1 emit the matching rows into a separate
            "Notification Contact" CSV. A notification is an instant, not a
            session, so those rows carry no start, stop, or duration — only the
            moment, the app, which rule emitted them, and whether the moment
            falls inside a usage session of the same app, so you can tell
            notification contact apart from time already counted as usage. Your
            headline app-usage output is never changed by this setting.
        polledEmulationMethod:
          type: string
          enum:
            - none
            - ross_2025_sampled_gap_v1
            - cerit_2025_sample_count_v1
          description: Re-derive your sessions the way a POLLED study would have measured
            them, and emit that alongside your real output. Chronicle records
            every foreground transition with its own timestamp; much of the
            published screen-time literature instead samples "what is on screen
            right now" every few seconds and builds sessions from those samples.
            The two instruments do not see the same thing, so the totals are not
            directly comparable. none (the default) emits nothing.
            ross_2025_sampled_gap_v1 samples your timeline at the cadence below
            and closes a session when the next sample is at least the gap
            seconds later or a different app, forcing the last sample closed so
            it counts. cerit_2025_sample_count_v1 instead multiplies the number
            of retained samples by the cadence and never subtracts endpoints.
            Both write a separate "Polled Emulation" CSV; your headline
            app-usage output is never changed. Every emitted row is flagged
            EMULATED NOT OBSERVED, because resampling can only lose detail — it
            does not reproduce what a real polled collector would have missed
            differently.
        polledEmulationIntervalSeconds:
          type: number
          description: "How often the emulated collector looks at the screen. Used by both
            emulation methods: it is the sampling grid for the gap rule and the
            per-sample duration for the sample-count rule. The default of 10
            seconds is the foreground polling cadence reported by the Ross et
            al. (2025) acquisition lineage. Ignored when polled-method emulation
            is off."
        polledEmulationGapSeconds:
          type: number
          description: How large a gap between consecutive retained samples closes an
            emulated session. The default of 15 seconds is the value in the Ross
            et al. (2025) released code; that source's own brief notes it is an
            engineering rule embedded in code, not a validated behavioral
            cutoff, which is why it is exposed here rather than fixed. Used only
            by ross_2025_sampled_gap_v1 — the sample-count rule never asks how
            far apart two samples were. Ignored when polled-method emulation is
            off.
        intervalExpansionMethod:
          type: string
          enum:
            - none
            - behapp_start_anchored_half_open_1s_v1
          description: Emit a separate source-method representation of each bounded app
            interval. none (the default) emits nothing. The Behapp method is
            anchored at each interval's own start, truncates its duration to
            whole seconds, and emits one row per second under a half-open
            [start,end) boundary. It is not the epoch-aligned, stop-inclusive
            polled-emulation sampler and it never changes the headline app-usage
            output.
        enableStudyWindowFilter:
          type: boolean
          description: Keep only sessions whose LOCAL calendar date falls inside the
            participant's study window from the study-dates file (inclusive).
            Requires the study-dates support file.
        enablePersonAttribution:
          type: boolean
          description: On shared devices, attribute each session to a person using the
            device-sharing table (exact participant match only) and optional
            usage-survey answers; usage attributed to someone other than the
            target becomes "Non-Target Participant App Usage" (kept, excluded
            from screen time). Requires the device-sharing support file.
        enableComplianceScoring:
          type: boolean
          description: "Emit a per-participant-day compliance report: known / (known +
            unknown) attributed minutes, with non-shared devices at 100 by
            definition. Days at 100 with zero real usage are kept but flagged."
        complianceThresholdPercent:
          type: number
          description: A day counts as valid when its compliance is at or above this
            percent. Study-specific; the default mirrors the common 70% rule.
        enableDayCoverage:
          type: boolean
          description: Emit a per-participant-day coverage report distinguishing days with
            usage, "no activity" days (raw events but no usage), and "no data"
            days (device silent), across the study window when one is loaded.
            Fails loudly if any windowed day would end uncovered.
    DiscoverTimezonesRequest:
      type: object
      required:
        - csvText
      properties:
        csvText:
          type: string
        runtime:
          $ref: "#/components/schemas/BrowserProcessingRuntime"
    DiscoverTimezonesResponse:
      type: object
      required:
        - timezones
      properties:
        timezones:
          type: array
          items:
            type: string
    ProcessRawCsvRequest:
      type: object
      required:
        - inputFileName
        - csvText
        - options
      properties:
        inputFileName:
          type: string
        csvText:
          type: string
        options:
          $ref: "#/components/schemas/BrowserProcessingOptions"
        supportFiles:
          $ref: "#/components/schemas/BrowserSupportFiles"
        runtime:
          $ref: "#/components/schemas/BrowserProcessingRuntime"
    ProcessedOutputFileResult:
      type: object
      required:
        - kind
        - outputFileName
        - csv
        - rowCount
      properties:
        kind:
          type: string
          enum:
            - app
            - screen
            - plot
            - aggregate
            - parquet
            - spss
            - lineage
        outputFileName:
          type: string
        csv:
          type: string
        rowCount:
          type: integer
    ProcessedFileResult:
      type: object
      required:
        - inputFileName
        - outputs
        - originalRowCount
        - processedRowCount
        - availableTimezones
        - timezone
        - appRowCount
        - screenRowCount
        - timezoneAction
        - rowsBeforeTimezoneHandling
        - rowsAfterTimezoneHandling
        - rowsRemovedByTimezone
        - duplicateTimestampsCorrected
      properties:
        inputFileName:
          type: string
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ProcessedOutputFileResult"
        originalRowCount:
          type: integer
        processedRowCount:
          type: integer
        availableTimezones:
          type: array
          items:
            type: string
        timezone:
          type: string
        appRowCount:
          type: integer
        screenRowCount:
          type: integer
        timezoneAction:
          type: string
          enum:
            - none
            - filtered_to_selected
            - converted_to_selected
            - filtered_to_primary
            - converted_to_primary
          description: What the pipeline did with rows whose timezones did not match the
            selected/primary one.
        rowsBeforeTimezoneHandling:
          type: integer
        rowsAfterTimezoneHandling:
          type: integer
