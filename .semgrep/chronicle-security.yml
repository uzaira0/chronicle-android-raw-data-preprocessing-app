rules:
- id: chronicle-github-actions-no-direct-github-context-in-run
  message: Do not interpolate `${{ github.* }}` directly inside `run:` blocks. Move values through `env:`
    first.
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - /.github/workflows/*.yml
    - /.github/workflows/*.yaml
  pattern-regex: (?s)run:\\s*\\|.*\\$\\{\\{\\s*github\\.
- id: chronicle-ts-console-log
  message: Remove console.log before committing; use structured logging or remove the statement.
  severity: ERROR
  languages:
  - typescript
  paths:
    include:
    - '**/web/src/**/*.ts'
    - '**/web/src/**/*.tsx'
  pattern: console.log(...)
- id: chronicle-ts-localstorage-unguarded
  message: localStorage access can throw in Safari private mode or when storage is full; wrap in try/catch.
  severity: WARNING
  languages:
  - typescript
  paths:
    include:
    - '**/web/src/**/*.ts'
    - '**/web/src/**/*.tsx'
  patterns:
  - pattern: localStorage.$METHOD(...)
  - pattern-not-inside: "try {\n  ...\n} catch ($E) {\n  ...\n}\n"
  - pattern-not-inside: "try {\n  ...\n} catch {\n  ...\n}\n"
- id: chronicle-ts-window-localstorage-unguarded
  message: window.localStorage access can throw in Safari private mode or when storage is full; wrap in
    try/catch.
  severity: WARNING
  languages:
  - typescript
  paths:
    include:
    - '**/web/src/**/*.ts'
    - '**/web/src/**/*.tsx'
  patterns:
  - pattern: window.localStorage.$METHOD(...)
  - pattern-not-inside: "try {\n  ...\n} catch ($E) {\n  ...\n}\n"
  - pattern-not-inside: "try {\n  ...\n} catch {\n  ...\n}\n"
