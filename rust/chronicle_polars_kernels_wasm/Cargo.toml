[package]
name = "chronicle_polars_kernels_wasm"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    '-Oz',
    '--enable-bulk-memory',
    '--enable-nontrapping-float-to-int',
    '--enable-mutable-globals',
    '--enable-sign-ext',
    '--enable-reference-types',
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Polars: minimal feature set for timestamp work only.
polars = { version = "0.46", default-features = false, features = [
    "lazy",
    "dtype-datetime",
    "temporal",
    "strings",
    "timezones",
] }

# chrono-tz is pulled in by polars's "timezones" feature; we use it directly
# for the lean variant of the kernel.
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }
chrono-tz = "0.10"

# Polars 0.46 transitively pulls getrandom 0.3 via uuid; on wasm32-unknown-unknown
# the wasm_js backend has to be enabled explicitly.
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
