graph_steps:
  - step_id: parse_remap_config
    step_label: Parse remap config
    step_description: Parse the interaction-type remap option into a lookup map.
    unit_id: parse_events
    has_bypass: false
  - step_id: csv_parse
    step_label: CSV parse
    step_description: Parse the raw Chronicle CSV text into header-keyed rows
      (throws on parse errors).
    unit_id: parse_events
    has_bypass: false
  - step_id: drop_empty_timestamp
    step_label: Drop empty timestamps
    step_description: Drop raw rows with no event timestamp — unusable by every downstream step.
    unit_id: parse_events
    step_inputs:
      - csv_parse
    has_bypass: false
  - step_id: detect_device_model
    step_label: Detect device model
    step_description: Classify the stream as Amazon Fire vs Android from package-name evidence.
    unit_id: parse_events
    step_inputs:
      - drop_empty_timestamp
    has_bypass: false
  - step_id: resolve_preproc_datetime
    step_label: Resolve run datetime
    step_description: Resolve the datetime-of-preprocessing stamp (runtime-pinned
      for reproducibility).
    unit_id: parse_events
    has_bypass: false
  - step_id: build_canonical_rows
    step_label: Build canonical rows
    step_description: "Build typed canonical rows: normalize strings, remap
      interaction types, parse ns timestamps, stamp calendar columns."
    unit_id: parse_events
    step_inputs:
      - drop_empty_timestamp
      - detect_device_model
      - parse_remap_config
    has_bypass: false
  - step_id: stable_sort
    step_label: Stable sort
    step_description: Sort rows by event timestamp, ties broken by original row index.
    unit_id: parse_events
    step_inputs:
      - build_canonical_rows
    has_bypass: false
  - step_id: collect_timezones
    step_label: Collect timezones
    step_description: Collect the distinct, sorted timezones present in the file
      (drives the timezone picker).
    unit_id: parse_events
    step_inputs:
      - stable_sort
    has_bypass: false
  - step_id: compute_dominant_timezone
    step_label: Dominant timezone
    step_description: Find the most frequent timezone across the rows (the primary clock).
    unit_id: normalize_timezones
    step_inputs:
      - stable_sort
    has_bypass: false
  - step_id: select_timezone_strategy
    step_label: Select strategy
    step_description: Pick the target timezone and (for filter strategies) the
      surviving rows, per the timezone-handling setting.
    unit_id: normalize_timezones
    step_inputs:
      - stable_sort
      - compute_dominant_timezone
    has_bypass: false
  - step_id: restamp_rows
    step_label: Restamp rows
    step_description: Restamp every surviving row onto the target timezone and
      recompute its calendar columns.
    unit_id: normalize_timezones
    step_inputs:
      - select_timezone_strategy
    has_bypass: false
  - step_id: row_count_report
    step_label: Row-count report
    step_description: Before/after/removed row counts for the timezone step's report.
    unit_id: normalize_timezones
    step_inputs:
      - stable_sort
      - select_timezone_strategy
    has_bypass: false
  - step_id: exact_dedupe
    step_label: Exact dedupe
    step_description: Collapse exact-duplicate raw rows (same participant,
      timestamp, app, interaction type), keeping the first. Gated by
      deduplicateExactRows.
    unit_id: dedup_and_order
    step_inputs:
      - restamp_rows
    has_bypass: false
  - step_id: count_dup_groups
    step_label: Count duplicate groups
    step_description: Count same-timestamp event groups before correction, for the run report.
    unit_id: dedup_and_order
    step_inputs:
      - exact_dedupe
    has_bypass: false
  - step_id: nudge_duplicate_timestamps
    step_label: Nudge duplicate timestamps
    step_description: Nudge same-timestamp events apart (resume-first priority
      order) so event ordering is deterministic. Gated by
      correctDuplicateEventTimestamps.
    unit_id: dedup_and_order
    step_inputs:
      - exact_dedupe
    has_bypass: false
  - step_id: mark_data_time_gaps
    step_label: Mark data-time gaps
    step_description: Stamp each row with the gap (hours) since the previous event in the stream.
    unit_id: dedup_and_order
    step_inputs:
      - nudge_duplicate_timestamps
    has_bypass: false
  - step_id: tag_filtered_packages
    step_label: Tag filtered packages
    step_description: "TAGGING ONLY: relabel filter-listed packages' raw events
      'Filtered App *' so the list is visible downstream. Nothing is dropped or
      blanked here."
    unit_id: app_policy
    step_inputs:
      - mark_data_time_gaps
    has_bypass: false
  - step_id: collect_keyguard_timestamps
    step_label: Collect keyguard timestamps
    step_description: Sorted timestamps of every keyguard-shown event — the
      lock-screen evidence stream.
    unit_id: device_state_timeline
    step_inputs:
      - tag_filtered_packages
    has_bypass: true
  - step_id: walk_screen_state_machine
    step_label: Walk screen state machine
    step_description: CLOSED —screen-start→ OPEN —screen-stop→ CLOSED, accumulating
      keyguard/unlock/foreground evidence; emits one close per session.
    unit_id: device_state_timeline
    step_inputs:
      - tag_filtered_packages
    has_bypass: true
  - step_id: build_classified_sessions
    step_label: Build & classify sessions
    step_description: Materialize each close as a 'Screen Usage' row and classify
      its end reason (manual/auto lock, kept-awake, lock-screen-only, …) with a
      confidence.
    unit_id: device_state_timeline
    step_inputs:
      - tag_filtered_packages
      - walk_screen_state_machine
      - collect_keyguard_timestamps
    has_bypass: true
  - step_id: compute_junk_packages
    step_label: Compute junk packages
    step_description: The junk (filter-listed) package set, derived entirely from
      upstream rows carrying a Filtered-* event.
    unit_id: reconstruct_episodes
    step_inputs:
      - tag_filtered_packages
    has_bypass: true
  - step_id: junk_blind_fold
    step_label: Junk-blind fold
    step_description: Fold pre-relabeled junk events back to their Activity
      equivalents so the matcher sees every app identically (junk-BLIND
      matching).
    unit_id: reconstruct_episodes
    step_inputs:
      - tag_filtered_packages
      - compute_junk_packages
    has_bypass: true
  - step_id: build_matcher_input
    step_label: Build matcher input
    step_description: Factorize app codes and build the resumed/stop/background
      masks the matcher consumes (throws when the file has no app events).
    unit_id: reconstruct_episodes
    step_inputs:
      - junk_blind_fold
    has_bypass: true
  - step_id: run_matcher
    step_label: Run matcher
    step_description: Pair resumes with stops (WASM matcher; JS matcher when the
      proximity glue is on).
    unit_id: reconstruct_episodes
    step_inputs:
      - build_matcher_input
    has_bypass: true
  - step_id: apply_matcher_output
    step_label: Apply matcher output
    step_description: Stamp episode start/stop timestamps from the matcher pairings;
      mark unmatched resumes 'End of Usage Missing'.
    unit_id: reconstruct_episodes
    step_inputs:
      - junk_blind_fold
      - run_matcher
      - compute_junk_packages
    has_bypass: true
  - step_id: relabel_usage_with_floor
    step_label: Relabel usage + floor
    step_description: Drop pauses/unmatched resumes, relabel matched resumes as
      usage episodes, and apply the minimum-duration floor.
    unit_id: reconstruct_episodes
    step_inputs:
      - apply_matcher_output
      - compute_junk_packages
    has_bypass: true
  - step_id: junk_downstream_mark
    step_label: Junk downstream mark
    step_description: "The ONE lossy filter decision, after matching: relabel junk
      apps' own episodes 'Filtered App Usage' (background junk keeps real
      timing)."
    unit_id: reconstruct_episodes
    step_inputs:
      - relabel_usage_with_floor
      - compute_junk_packages
    has_bypass: true
  - step_id: sort_episodes
    step_label: Sort episodes
    step_description: Re-sort rows by event timestamp after the relabels.
    unit_id: reconstruct_episodes
    step_inputs:
      - junk_downstream_mark
    has_bypass: true
  - step_id: split_concurrent
    step_label: Split concurrent sessions
    step_description: "Phase 2 (concurrent modeling / background apps only): layer
      overlapping sessions into primary/secondary sub-intervals."
    unit_id: reconstruct_episodes
    step_inputs:
      - sort_episodes
      - compute_junk_packages
    has_bypass: true
  - step_id: codebook_join
    step_label: Codebook join
    step_description: "Join each episode's package against the app codebook:
      null-fill output columns, copy matched records through the rename map,
      stamp Unknown sentinels."
    unit_id: categorize_apps
    step_inputs:
      - split_concurrent
    has_bypass: true
  - step_id: derive_broad_category
    step_label: Derive broad category
    step_description: Coalesce the per-source category columns onto the palette
      vocabulary (desktop order) for every row with a codebook record.
    unit_id: categorize_apps
    step_inputs:
      - codebook_join
    has_bypass: true
  - step_id: collapse_genre
    step_label: Collapse genre ids
    step_description: "Reconcile per-source genre ids: agreement promotes the genre,
      disagreement yields null, none yields Unknown."
    unit_id: categorize_apps
    step_inputs:
      - derive_broad_category
    has_bypass: true
  - step_id: engagement_walk
    step_label: Engagement walk
    step_description: Sequential walk over foreground episodes computing
      new-engagement (30 s / custom), app switches, and inter-episode gaps —
      any-app and valid-app variants.
    unit_id: episode_annotations
    step_inputs:
      - collapse_genre
    has_bypass: true
  - step_id: flag_and_retain
    step_label: Flag & retain
    step_description: Stamp quality flags for long usage sessions and long data gaps
      — flag, never drop.
    unit_id: episode_annotations
    step_inputs:
      - engagement_walk
    has_bypass: true
  - step_id: blank_junk_timing
    step_label: Blank junk timing
    step_description: "The SOLE blanking site: null start/stop/duration on 'Filtered
      App Usage' rows, after the engagement walk has read their real timing."
    unit_id: interval_cleaning
    step_inputs:
      - flag_and_retain
      - compute_junk_packages
    has_bypass: true
  - step_id: drop_selected_types
    step_label: Drop selected types
    step_description: Drop the event types selected for removal — kept when they
      witness a large data gap.
    unit_id: interval_cleaning
    step_inputs:
      - blank_junk_timing
    has_bypass: true
  - step_id: drop_zero_duration
    step_label: Drop zero-duration
    step_description: Optionally drop zero-duration usage episodes (null-duration
      rows are kept). Gated by filterZeroDurationSessions.
    unit_id: interval_cleaning
    step_inputs:
      - drop_selected_types
    has_bypass: true
  - step_id: partition_credit_sessions
    step_label: Partition sessions
    step_description: Split the cleaned rows into credit-eligible App-Usage sessions
      (positive duration) vs pass-through rest.
    unit_id: effective_usage
    step_inputs:
      - drop_zero_duration
    has_bypass: true
  - step_id: build_liveness_substrate
    step_label: Build liveness substrate
    step_description: "Per participant: screen ON/OFF change points, boot
      timestamps, all event timestamps, and screen-capability — from the RAW
      event stream."
    unit_id: effective_usage
    step_inputs:
      - tag_filtered_packages
    has_bypass: true
  - step_id: report_screen_incapable
    step_label: Report screen-incapable
    step_description: Participants whose stream carries no usable screen change points.
    unit_id: effective_usage
    step_inputs:
      - partition_credit_sessions
      - build_liveness_substrate
    has_bypass: true
  - step_id: count_day_apps
    step_label: Count day apps
    step_description: Distinct apps per (participant, date) — the no-witness fallback gate.
    unit_id: effective_usage
    step_inputs:
      - partition_credit_sessions
    has_bypass: true
  - step_id: credit_sessions
    step_label: Credit sessions
    step_description: "Per session: cap the end, intersect device-alive with
      screen-creditable intervals (auto-lock bridging), apply the no-witness
      fallback."
    unit_id: effective_usage
    step_inputs:
      - partition_credit_sessions
      - build_liveness_substrate
      - count_day_apps
    has_bypass: true
  - step_id: emit_credited_rows
    step_label: Emit credited rows
    step_description: Rewrite each session into one clone row per credited interval,
      recomputing duration and calendar columns.
    unit_id: effective_usage
    step_inputs:
      - partition_credit_sessions
      - build_liveness_substrate
      - credit_sessions
    has_bypass: true
  - step_id: assemble_credit_result
    step_label: Assemble credit result
    step_description: Credited rows first, then the pass-through rest, plus the credit report.
    unit_id: effective_usage
    step_inputs:
      - partition_credit_sessions
      - report_screen_incapable
      - emit_credited_rows
    has_bypass: true
  - step_id: resolve_participant_windows
    step_label: Resolve participant windows
    step_description: Resolve each participant to their study window (exact id, then
      numerical id) from the study-dates file.
    unit_id: observation_window
    step_inputs:
      - drop_zero_duration
    has_bypass: true
  - step_id: filter_rows_to_window
    step_label: Filter rows to window
    step_description: Keep rows whose local date falls inside the participant's
      [start, end] window; participants without a window are kept whole and
      reported.
    unit_id: observation_window
    step_inputs:
      - drop_zero_duration
      - resolve_participant_windows
    has_bypass: true
  - step_id: resolve_sharing_status
    step_label: Resolve sharing status
    step_description: Resolve every participant to Shared / Non-Shared from the
      device-sharing file (throws on gaps — never defaults).
    unit_id: attribute_person
    step_inputs:
      - filter_rows_to_window
    has_bypass: true
  - step_id: build_survey_lookup
    step_label: Build survey lookup
    step_description: (participant, exact event timestamp) → user map from survey
      answers; later rows win.
    unit_id: attribute_person
    has_bypass: true
  - step_id: attribute_rows
    step_label: Attribute rows
    step_description: Fill null usernames (kids-shell → Target Child), apply survey
      relabels, re-mark non-target App Usage on shared devices.
    unit_id: attribute_person
    step_inputs:
      - filter_rows_to_window
      - resolve_sharing_status
      - build_survey_lookup
    has_bypass: true
  - step_id: inject_placeholders
    step_label: Inject placeholders
    step_description: Inject one zero-duration 'No Activity' placeholder per
      participant-day that has raw events but no usage. Gated by
      addNoActivityPlaceholderDays.
    unit_id: day_coverage
    step_inputs:
      - attribute_rows
      - tag_filtered_packages
    has_bypass: true
  - step_id: build_raw_date_index
    step_label: Build raw date index
    step_description: Per-participant set of raw event dates — the 'device was alive' evidence.
    unit_id: day_coverage
    step_inputs:
      - tag_filtered_packages
    has_bypass: true
  - step_id: build_coverage_table
    step_label: Build coverage table
    step_description: "Classify every spine day usage / no_activity / no_data (hard
      invariant: a data day the spine misses is an error). Gated by
      enableDayCoverage."
    unit_id: day_coverage
    step_inputs:
      - inject_placeholders
      - build_raw_date_index
    has_bypass: true
  - step_id: accumulate_attribution_minutes
    step_label: Accumulate attribution minutes
    step_description: Bucket known vs unknown attributed minutes per (participant,
      day) using the attribution SSOT.
    unit_id: score_compliance
    step_inputs:
      - inject_placeholders
    has_bypass: true
  - step_id: score_days
    step_label: Score days
    step_description: known/(known+unknown)×100 per shared-device day vs the
      threshold; Non-Shared days are 100; zero-usage days flagged.
