  interaction_event_id: {description: "Normalized event identity, unique within its owning trace.", range: string, required: true}
  screen_description: {description: "Supplied description of this labelled screen interaction (ODIM PDF p. 9 section 4.5), owned by the event within its trace, not by a reusable screenshot payload. Independent of the whole trace description and redaction justification; preserve verbatim empty/null/omission without inferring an annotator or generation route.", range: string}
  event_sequence_position: {description: Nonnegative position in the current trace; unique within the trace. Does not assert a source timestamp-sort algorithm., range: integer, minimum_value: 0, required: true}
  screenshot_artifact_id: {description: Identity of this event's screenshot in the supplied existing ArtifactRef catalog., range: string, required: true}
  hierarchy_artifact_id: {description: Identity of this event's paired view hierarchy in the supplied ArtifactRef catalog., range: string, required: true}
  gesture_artifact_id: {description: Optional gesture payload identity; absent or null is not silently completed., range: string}
  capture_incomplete: {description: "Supplied capture-completeness assertion, not inferred here from gesture presence; independent of human correctness review.", range: boolean}
  human_detected_incorrect: {description: "Supplied human finding of incorrect interaction metadata; false, null and omission remain distinct.", range: boolean}
  interaction_redactions: {description: Paired redaction records for this owning event only., range: InteractionRedactionRecord, multivalued: true, inlined_as_list: true}
  redaction_record_id: {description: Normalized identity of one paired redaction record., range: string, required: true}
  redaction_selection_basis: {description: Element selection versus drawn-region/IoU selection; no undisclosed cutoff is supplied., range: InteractionRedactionSelectionId, required: true}
  selected_element_ids: {description: "Supplied corresponding hierarchy elements; web elements are supplied as qualifying, not selected by an invented IoU rule.", range: string, multivalued: true, required: true}
  target_region_id: {description: "Supplied identity of the drawn web pixel region, without invented geometry.", range: string}
  redacted_screenshot_artifact_id: {description: "Identity of the paired screenshot output, not an executed sanitization claim.", range: string, required: true}
  redacted_hierarchy_artifact_id: {description: "Identity of the corresponding hierarchy output, not an executed sanitization claim.", range: string, required: true}
  screenshot_redaction_effect: {description: Supplied pixel-side effect of this paired redaction., range: ScreenshotRedactionEffectId, required: true}
  hierarchy_redaction_effect: {description: Supplied hierarchy-side effect of this paired redaction., range: HierarchyRedactionEffectId, required: true}
  redaction_justification: {description: "Supplied per-redaction textual justification (ODIM device route, PDF p. 8 section 4.4); no web prompt or mandatory response is inferred.", range: string}
