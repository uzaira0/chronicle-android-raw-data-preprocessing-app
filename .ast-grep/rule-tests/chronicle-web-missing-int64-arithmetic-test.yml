# Meta-test for a parity bug-shape rule (run with: sg test).
# The `invalid` snippets resurrect a FIXED parity bug — if the rule stops
# matching them, the guard itself has broken.
id: chronicle-web-missing-int64-arithmetic
valid:
  - "const startNs = current.start_timestamp_ns ?? MISSING_INT64;"
  - "if (startNs === MISSING_INT64) { skip(); }"
invalid:
  - "const gap = stopNs - MISSING_INT64;"
  - "const shifted = MISSING_INT64 + offsetNs;"
  - "const scaled = MISSING_INT64 * 2n;"