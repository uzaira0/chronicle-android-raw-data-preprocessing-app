      - method_setting_ids
      - method_setting_count
      - method_operations
      - acquisition_protocols
      - session_construction_policies
      - notification_attribution_policies
      - duration_policies
      - timestamp_policies
      - parameter_provenance_assertions
      - source_artifact_provenance_assertions
      - protocol_materialization_blockers
      - diary_protocols
      - diary_replication_bindings
      - release_profiles
      - profile_implementation_status
      - source_locators

  MethodSettingAssertion:
    description: >-
      One source-supported decision in a StudyMethodProfile. This is richer than
      runtime ParameterBinding: it preserves semantic role, target, value shape,
      evidence, and implementation binding before a runnable subset compiles to
      flat knob/value pairs.
    broad_mappings: [prov:Entity]
    slots:
      - method_setting_id
      - source_extraction_id
      - rubric_component_id
      - method_setting_role
      - method_target_layer
      - method_parameter_key
      - method_value_kind
      - method_value_json
      - method_unit
      - method_comparator
      - method_boundary_convention
      - method_applicability_status
      - method_disclosure_status
      - mapped_ontology_term
      - mapped_contract_slot
      - contract_bindings
      - chronicle_output_kind
      - chronicle_output_column
      - source_output_position
      - method_implementation_status
      - method_execution_route
      - method_execution_destination_id
      - method_execution_parameter_path
      - method_execution_blocker_code
      - executor_id
      - required_inputs
      - source_work_id
      - source_evidence_work_id
      - source_component_id
      - source_observed_setting
      - source_value_json
      - source_coverage_status
      - source_clause_ids
      - source_clause_label
      - source_clause_text
      - source_clause_path
      - source_clause_start
      - source_clause_end
      - source_value_sha256
      - method_variant_group_id
      - method_variant_relation
      - method_variant_branch_id
      - method_variant_branch_label
      - method_configuration_json
      - structured_protocol_candidate_json
      - evidence_layer
      - ontology_mapping_note
      - gap_assessment
      - integration_source
      - adjudication_confidence
      - adjudication_rationale
      - conformance_fixture_id
      - conformance_result_digest
      - source_locators

  MethodContractBinding:
    description: >-
      One exact compilation target for a method setting. It binds one generated
      runtime slot to one canonical JSON value. Candidate semantic mappings stay
      in mapped_contract_slot; only this class authorizes compilation.
    slots:
      - contract_slot
      - contract_value_json

  LiteratureInputAdapterContract:
    description: >-
      A closed, versioned registration that promotes source-backed method
      settings only when an existing Chronicle upload role can carry the
      observations and a named Rust adapter validates or transforms them. The
      setting inventory is exact: unregistered settings remain blocked and no
      missing values are synthesized.
    slots:
      - literature_input_semantic_type
      - literature_input_adapter_id
      - literature_input_adapter_version
      - literature_input_route_kind
      - literature_input_role
      - literature_input_schema_id
      - literature_input_required_fields
      - literature_input_gui_surface
      - literature_input_method_setting_ids

  ProtocolMaterializationBlocker:
    description: >-
      One source-grounded reason a typed protocol fragment is partial or withheld.
      The canonical setting remains authoritative; this object prevents the missing
      protocol field from disappearing at profile assembly.
    slots:
      - protocol_materialization_blocker_id
      - protocol_materialization_id
      - protocol_ontology_class
      - protocol_profile_slot
      - protocol_object_attached
      - protocol_blocker_code
      - protocol_blocker_field
      - protocol_blocker_reason
      - blocked_method_setting_ids
      - partial_protocol_object_json
      - source_locators

  MethodConfigurationSpace:
    description: >-
      The complete source-declared choice space for one retained method. Levels and
      combinations are explicit; absence of an allowed combination forbids inventing
      a Cartesian product.
    slots:
      - method_configuration_space_id
      - method_configuration_structure
      - invariant_method_setting_ids
      - method_configuration_groups
      - allowed_method_combinations
      - documentary_method_setting_ids
      - not_applicable_method_setting_ids
      - unresolved_method_setting_ids
      - source_locators

  MethodConfigurationGroup:
    description: One source-declared fixed, alternative, conditional, sensitivity, ablation, or multiverse group.
    slots:
      - method_configuration_group_id
      - method_configuration_group_kind
      - method_configuration_axis
      - method_selection_semantics
      - method_cross_product_policy
      - method_configuration_levels
      - documentary_method_setting_ids
      - unresolved_method_setting_ids
      - source_locators

  MethodConfigurationLevel:
    description: One exact source-declared level or branch and its setting membership.
    slots:
      - method_configuration_level_id
      - method_configuration_level_label
      - included_method_setting_ids
      - excluded_method_setting_ids
      - common_method_setting_ids
      - branch_method_setting_ids
      - documentary_method_setting_ids
      - unresolved_method_setting_ids
      - source_locators

  MethodConfigurationCombination:
    description: One combination explicitly enumerated by the source; never inferred from independent levels.
    slots:
      - method_configuration_combination_id
      - method_configuration_combination_label
      - selected_method_configuration_level_ids
      - included_method_setting_ids
      - source_locators

  MethodConfigurationSelection:
    description: One exact selection from a source-declared configuration space.
    slots:
      - method_configuration_selection_id
      - method_configuration_space_reference
      - selected_method_configuration_level_ids
      - effective_method_setting_ids
      - method_configuration_selection_status
      - method_configuration_selection_blockers

  AcquisitionProtocol:
    description: >-
      Actual observation semantics, distinct from selecting events after collection.
      Cadence, lookback, cursoring, overlap, persistence, and failure behavior can
      each change which occurrences are observable.
    slots:
      - acquisition_protocol_id
      - collector
      - api_and_version
      - observation_mode
      - requested_cadence
      - realized_cadence_and_jitter
      - query_bounds
      - lookback
      - backfill
      - cursor_policy
      - overlap_policy
      - acquisition_deduplication
      - occurrence_timestamp_semantics
      - processing_timestamp_semantics
      - initial_sample_policy
      - terminal_sample_policy
      - persistence_policy
      - upload_policy
      - restart_behavior
      - doze_behavior
      - permission_loss_behavior
      - method_settings
      - source_locators

  SessionConstructionPolicy:
    description: >-
      A target-typed session constructor. App sessions, screen bouts, device
      sessions, pickup activations, and runs of polled samples are not aliases.
    slots:
      - session_construction_policy_id
      - session_input_layer
      - session_output_layer
      - reconstruction_strategy
      - method_settings
      - source_locators

  NotificationAttributionPolicy:
    description: >-
      A policy relating notification evidence to behavior or artifact disposition,
      distinct from generic foreground/background attribution.
    slots:
      - notification_attribution_policy_id
      - notification_target_behavior
      - notification_evidence_mode
      - notification_temporal_direction
      - notification_window
      - method_comparator
      - notification_package_scope
      - notification_attribution_confidence
      - notification_disposition
      - source_locators

  DurationPolicy:
    description: >-
      A duration rule with an explicit target layer. Equal thresholds applied to
      an app episode, screen bout, device session, pickup, polled run, or daily
      aggregate are different methods.
    slots:
      - duration_policy_id
      - method_target_layer
      - method_comparator
      - method_value_json
      - method_unit
      - duration_action
      - method_boundary_convention
      - source_locators

  TimestampPolicy:
    description: >-
      Timestamp fidelity, ordering, multiplicity, and synthetic-order provenance.
      Original and effective time remain separate.
    slots:
      - timestamp_policy_id
      - original_timestamp_semantics
      - effective_timestamp_semantics
      - timestamp_resolution
      - source_sequence_semantics
      - tie_group_semantics
      - acquisition_deduplication
      - tie_break_policy
      - synthetic_order_provenance
      - source_locators

  ParameterProvenanceAssertion:
    description: >-
      Documentary and derivation provenance for one method parameter. A citation,
      a default, an author-set value, and a data-derived value are not aliases.
    slots:
      - parameter_provenance_id
      - method_parameter_key
      - method_value_json
      - derivation_type
      - documentary_support
      - inheritance
      - method_boundary_convention
      - method_target_layer
      - source_locators

  SourceArtifactProvenanceAssertion:
    description: >-
      Exact, content-bound documentary provenance registered for a source artifact.
      Registration verifies identity and bytes. `documentary_only` maps to
      `executionEligible=false` at the browser and Rust receipt boundaries.
    slots:
      - source_artifact_provenance_id
      - method_setting_id
      - source_work_id
      - source_extraction_id
      - source_value_sha256
      - source_artifact_provenance_object_json
      - source_artifact_provenance_object_digest
      - provenance_keys
      - candidate_status
      - conformance_fixture_id
      - conformance_result_digest
      - execution_eligibility
    slot_usage:
      source_value_sha256:
        required: true
      conformance_fixture_id:
        required: true
      conformance_result_digest:
        required: true

  MeasurementReleaseProfile:
    description: Provenance from collected signal to the measure and granularity released for analysis.
    slots:
      - release_profile_id
      - measurement_source
      - measurement_target
      - objective_metric_type
      - aggregation_window
      - released_data_granularity
      - raw_event_availability
      - collector_to_release_transformations
      - source_locators

  DiaryProtocol:
    description: >-
      A versioned diary setup: item and response schemas, schedule and trigger
      rules, recall window, timezone behavior, and missing-response policy.
    slots:
      - diary_protocol_id
      - diary_title
      - diary_items
      - diary_schedule_rules
      - diary_recall_window
      - diary_response_timezone
      - diary_missing_response_policy
      - method_settings
      - source_locators

  DiaryItem:
    description: One source-defined diary field or question and its response contract.
    slots:
      - diary_item_id
      - diary_item_name
      - diary_prompt
      - diary_response_kind
      - diary_allowed_values
      - method_unit
      - diary_required
      - diary_repeatable
      - diary_anchor_event
      - source_locators

  DiaryScheduleRule:
    description: One schedule, randomization, or event-contingent diary trigger.
    slots:
      - diary_schedule_rule_id
      - diary_trigger_kind
      - requested_cadence
      - diary_window_start
      - diary_window_end
      - diary_max_prompts_per_day
      - diary_randomization_policy
      - diary_response_timezone
      - source_locators

  DiarySourceAdapterReceipt:
    description: >-
      Exact receipt from one versioned diary source-layout adapter execution.
      This proves source-layout conformance only; it never upgrades a blocked
      diary protocol to executable.
    slots:
      - mapping_profile_id
      - mapping_profile_version
      - adapter_id
      - adapter_version
      - conformance_fixture_ids
      - source_sha256
      - normalized_sha256

  DiaryReplicationBinding:
    description: >-
      Content-bound selection of one Sleep Scoring diary version and released
      source layout. Chronicle validates this binding and its embedded shared
      fixture independently while preserving the full profile's blocked state.
    slots:
      - method_setting_id
      - bridge_payload_sha256
      - catalog_source_sha256
      - version_definition_id
      - source_method_variant_id
      - mapping_profile_id
      - mapping_profile_version
      - adapter_id
      - adapter_version
      - fixture_id
      - fixture_input_sha256
      - fixture_normalized_sha256
      - profile_implementation_status
      - blocker_codes
      - diary_item_count
      - form_element_count
      - schedule_rule_count
      - administration_schedule_count
      - rule_definition_count
      - diary_source_adapter_receipt

# ============================================================
# SLOTS
# ============================================================
slots:
  screenshot_session_reference: {description: "Optional supplied cross-carrier screenshot-session parent. TimeKilling CHI2023 pp6–7 supplies a real phone-use parent distinct from prediction sequences; importer resolves source/profile/participant/compatible known device without constructing sessions or joins.", range: string}
  screenshot_record_reference: {description: "Optional supplied screenshot child within its explicitly referenced screenshot-session parent. A known child requires that parent; missing/null child remains unknown. No timestamp equality, inferred nearest image, padding inference or recovered serializer.", range: string}
  association_database_id: {description: "Supplied database identity scoped by profile/participant/device/analysis run, independent of its potentially repeated group label.", range: string, required: true}
  analysis_run_id: {description: "Supplied analysis-run identity, not an invented date, reconstructed rolling window or proof that an algorithm ran.", range: string, required: true}
  association_group_label: {description: "Optional printed or supplied cluster/group label. Null/omission does not assign a cluster or pooled group.", range: string}
  grouping_setting_reference: {description: "Optional compatible local source-definition reference, distinguishing per-user clustering from pooled sessions without executing either.", range: string}
  transaction_definition_setting_reference: {description: "Optional compatible local binary session-transaction definition, not a reference to duration-weighted features.", range: string}
  session_transactions: {description: "Supplied database-local transactions. Omission/null is unknown membership; [] is explicitly supplied empty membership, not complete observed zero.", range: SessionTransactionRecord, multivalued: true, inlined_as_list: true}
  session_transaction_id: {description: "Supplied transaction identity unique within its database, not inferred from equal times or app sets.", range: string, required: true}
  source_session_id: {description: "Supplied normalized identity of the session represented by this transaction, unique within the database; not authentication of an original raw key or recovered session constructor.", range: string, required: true}
  present_app_items: {description: "Explicitly supplied present app item labels/identities, not necessarily package IDs. Unlisted items are not inferred absent; supplied order is not usage order.", range: string, multivalued: true}
  absent_app_items: {description: "Explicitly supplied absent app items, distinct from omitted, unknown or unobserved items.", range: string, multivalued: true}
  present_context_items: {description: "Explicitly supplied present contextual items, independent of app itemsets and with no context join inferred.", range: AssociationContextItemRecord, multivalued: true, inlined_as_list: true}
  absent_context_items: {description: "Explicitly supplied absent contextual items; undisclosed columns never become absent values.", range: AssociationContextItemRecord, multivalued: true, inlined_as_list: true}
  context_item_label: {description: "Supplied context value label, preserved without coercion, case folding or inferred sensor encoding.", range: string, required: true}
  context_dimension: {description: "Optional supplied context dimension, such as time, location or activity; no dimension or mutually-exclusive value policy is inferred.", range: string}
  association_rules: {description: "Supplied rules owned by this mining database. Presence does not imply that supplied transactions are complete, generate the rule, or determine its denominator.", range: AssociationRuleRecord, multivalued: true, inlined_as_list: true}
  association_rule_id: {description: "Supplied database-local rule identity, potentially a printed label rather than an original key.", range: string, required: true}
  antecedent_app_items: {description: "Supplied app items on the antecedent side; not chronological previous apps or causal triggers.", range: string, multivalued: true}
  consequent_app_items: {description: "Supplied app items on the consequent side, independently retained from antecedent membership.", range: string, multivalued: true}
  antecedent_context_items: {description: "Supplied contextual antecedent itemset; omitted/null/empty remain distinct.", range: AssociationContextItemRecord, multivalued: true, inlined_as_list: true}
  consequent_context_items: {description: "Supplied contextual consequent itemset where disclosed; no missing membership is inferred.", range: AssociationContextItemRecord, multivalued: true, inlined_as_list: true}
  rule_quality_values_json: {description: "Supplied lexical JSON quality values with their source labels/units/qualifications. Not computed from supplied sessions or silently treated as a normalized proportion.", range: string}
  rule_annotation_json: {description: "Supplied lexical JSON rule annotations such as printed category/type, separate from quality values, inferred action or classification execution.", range: string}
  task_occurrence_id: {description: "Supplied task identity scoped by profile/participant/device, not reconstructed from equal app/time tokens.", range: string, required: true}
  assessor_id: {description: "Optional supplied assessor identity, distinct from the assessed participant_id. JCP2017 pp867–868 has one live interviewer and two video-review psychiatrists, each independently producing standard and app-incorporated judgments. The assessor belongs to the owning task and its assessments; null/omission leaves identity unknown. No clinician catalog, interview/video join or consensus is inferred.", range: string, pattern: '\S'}
  history_subject_participant_id: {description: "Optional supplied person whose autobiographical history generated a DynamicSecurity challenge, distinct from the owning Task participant_id answering it. Primary layout874–896 presents the same question/options to the legitimate person, paired strong adversary and hidden-stranger naive adversary. Null/omission leaves history identity unknown; no participant assignment, original challenge key or history join is recovered.", range: string, pattern: '\S'}
  task_label: {description: "Supplied task designation, including which script is meant when a source-setting definition contains multiple scripts.", range: string, required: true}
  interaction_trace_reference: {description: "Optional supplied link to the trace assessed by this task/questionnaire completion (ODIM pp12–13 §§5.2–5.3). Resolves within the same profile/source and must match participant identity when known on the trace. Multiple independent questionnaire tasks may assess one trace; null/omission leaves the target unknown. No join, temporal order or participant identity is inferred.", range: string}
  expected_script_setting_reference: {description: "Optional reference to a compatible task-sequence setting within the owning profile/source; null/omission does not assert an expected script. No script matcher runs.", range: string}
  task_actions: {description: "Supplied task-local actions in supplied array order. Null/omission is unknown membership; [] is explicitly empty supplied membership, not proof of complete zero observation.", range: TaskActionRecord, multivalued: true, inlined_as_list: true}
  task_action_id: {description: "Supplied action identity unique within the containing task or session; labels or equal times are not identity.", range: string, required: true}
  action_label: {description: "Optional open supplied action descriptor, not a required recovered event code.", range: string}
  assigned_role_labels: {description: "Optional supplied role labels relative to the containing task/session, retained in order without automatic assignment, matching, deduplication or expected-script completion.", range: string, multivalued: true}
  action_content_json: {description: "Optional lexical JSON content evidence attached to a task/session action. Null, JSON null and omission stay distinct; no comparison or scoring runs.", range: string}
  criterion_assessments: {description: "Independently supplied assessments within the task, not one combined task score. Null/omission/empty membership stay distinct.", range: TaskCriterionAssessmentRecord, multivalued: true, inlined_as_list: true}
  criterion_assessment_id: {description: "Supplied assessment identity unique within the task, independent of repeated criterion labels.", range: string, required: true}
  criterion_setting_reference: {description: "Reference to a compatible task-correctness, task-performance or questionnaire-summary definition within the owning profile/source; criterion designation remains separate from this potentially composite definition. Referencing a metric does not execute it.", range: string, required: true}
  task_questionnaire_responses: {description: "Independently supplied answers concerning the owning task/session or a separate questionnaire completion; omission/null/empty membership are distinct and never imply completion, a call join or a navigation-trial join.", range: TaskQuestionnaireResponseRecord, multivalued: true, inlined_as_list: true}
  task_observation_windows: {description: "Supplied task/completion-local windows with source definitions and disclosed local anchor events; STDD alone permits an unknown anchor. Null/omission is unknown membership, [] explicitly empty. No time matching, aggregation or first-response inference runs.", range: TaskObservationWindowRecord, multivalued: true, inlined_as_list: true}
  observation_window_id: {description: "Supplied window identity unique within its containing task, not inferred from duration or equal endpoints.", range: string, required: true}
  window_setting_references: {description: "Nonempty unique references to compatible window/span/anchor definitions within the owning profile and source. Ambiguous sidedness remains on its source definition, not inherited from another window.", range: string, multivalued: true, required: true}
  anchor_task_action_reference: {description: "Explicit supplied anchor event resolving within the containing task's actions when required by its source policy. STDD permits unknown/null because receipt/open/submission semantics are unreported; identity validation never discovers firstness or reconstructs chronology.", range: string}
  screen_text_capture_references: {description: "Explicit supplied screen-text capture IDs; source-qualified validation preserves ordered membership without matching timestamps or text.", range: string, multivalued: true}
  device_use_session_id: {description: "Supplied session identity scoped by profile/participant/device; not inferred from equal times or recovered raw keys.", range: string, required: true}
  start_condition: {description: "Optional supplied start-condition token validated against the local constructor definition; not an inferred event occurrence.", range: string}
  end_condition: {description: "Optional supplied terminal-condition token validated against the local constructor definition; not an inferred event occurrence or reconstructed closing time.", range: string}
  session_questionnaire_responses: {description: "Supplied answers local to their containing session, in preserved order; the owning class selects device-session or tracked-app answer shape. Null/omission is unknown membership, [] explicitly empty. No prompt eligibility, chronology or interruption join inferred.", range: DeviceSessionQuestionnaireResponseRecord, multivalued: true, inlined_as_list: true}
  session_labels: {description: "Independent supplied device- or tracked-app-session classifications in preserved order, each retaining its source definition; null/omission is unknown membership.", range: DeviceSessionLabelRecord, multivalued: true, inlined_as_list: true}
  session_quantities: {description: "Supplied session-owned quantities in preserved order; null/omission unknown and [] explicitly empty. Local IDs and definition/scope compatibility are checked by ingress, not inferred from action membership.", range: SessionQuantityRecord, multivalued: true, inlined: true, inlined_as_list: true}
  start_action_reference: {description: "Optional supplied start action ID for a Chang attending-action gap, resolving only inside its containing ringer occupancy. Null/omission is unknown; array order and timestamps never infer the reference.", range: string, pattern: "^.*\\S.*$"}
  end_action_reference: {description: "Optional supplied end action ID for the same gap, resolving locally and distinct from a known start. Not an aggregation support or mean endpoint; no duration calculation or cross-boundary matching.", range: string, pattern: "^.*\\S.*$"}
  quantity_record_id: {description: "Supplied quantity identity unique within its owning session; repeated equal properties/values remain independent.", range: string, required: true}
  quantity_setting_reference: {description: "Profile-local feature or record-field definition with compatible role, target, property, unit and scope; not a request to compute the value.", range: string, required: true}
  quantity_scope: {description: "Explicit session/app/app-category subject scope, independent of whether the app/category identity is known.", range: string, required: true, pattern: "^(session|app|app_category)$"}
  session_actions: {description: "Supplied device- or tracked-app-session-local action/activity membership in supplied array order; actions need not identify an app. Null/omission is unknown membership, [] supplied empty, never a reconstructed or complete-zero assertion.", range: TaskActionRecord, multivalued: true, inlined_as_list: true}
  following_device_use_session_reference: {description: "Explicitly supplied immediately following interval within the same disclosed family: alternating screen intervals (Hush Section6.1) or uninterrupted T0 sessions (Van Berkel Analysis). Scoped by profile/source/participant/known device; distinct and acyclic. Known on/off consistency applies only to alternating intervals. Never inferred from equal timestamps, gaps or continuation labels. Null/omission is unknown, not no successor.", range: string}
  label_record_id: {description: "Supplied label identity unique within its owning session, independent of equal property or value tokens.", range: string, required: true}
  label_setting_reference: {description: "Compatible classification-defining local method setting, not a constructor, result statistic or execution receipt.", range: string, required: true}
  label_value_json: {description: "Optional supplied lexical JSON classification value; no scoring, coercion or missing-to-negative conversion. Omission, supplied null and lexical JSON null remain distinct.", range: string}
  questionnaire_setting_reference: {description: "Reference to a compatible disclosed response-scale definition within the owning profile/source, not an invitation or reported result; unknown instrument details remain on that source definition.", range: string, required: true}
  criterion_label: {description: "Supplied designation of the criterion/subtask being assessed, not an inferred selection or result.", range: string, required: true}
  assessment_value_json: {description: "Optional supplied lexical JSON assessment result. Does not compute correctness; zero, JSON null, supplied null and omission remain distinct.", range: string}
  assessment_content_json: {description: "Optional supplied lexical JSON content supporting the assessment, distinct from its result or action/time evidence; omitted content may be withheld or unreported.", range: string}
  support_task_action_references: {description: "Optional supplied TaskActionRecord IDs resolving only within the containing task or session, as selected by the owning class. Null/omission is unknown support, [] explicitly empty. No matching, score calculation, temporal anchoring or cross-owner join runs.", range: string, multivalued: true}
  support_criterion_assessment_references: {description: "Optional supplied supporting assessment IDs within the containing task, distinct from action IDs. Brain Disorders medRxiv2020 beginning/end PHQ-9 change names its two score assessments without inferring subtraction direction. Null/omission is unknown support, [] explicitly empty; duplicate, self and foreign references reject. These are supplied relationships, not an executed derivation DAG or array-order calculation.", range: string, multivalued: true}
  app_interruption_session_id: {description: "Supplied tracked-app session identity scoped by profile/participant/device, not reconstructed from app/time equality.", range: string, required: true}
  interruptions: {description: "Supplied interruption members local to the containing session; omission/null is unknown and [] explicitly empty supplied membership. Neither establishes complete observation of zero interruptions.", range: SessionInterruptionRecord, multivalued: true, inlined_as_list: true}
  response_role_label: {description: "Optional supplied answer-role designation such as before/during/after; not a computed sampling phase or a claim that all phases occur in one app instance.", range: string, pattern: "\\S"}
  interruption_record_reference: {description: "Optional supplied interruption ID resolving only within the containing tracked-app session; null/omission is unknown relationship, not a last-interruption or cause inference.", range: string, pattern: "\\S"}
  interruption_record_id: {description: "Supplied interruption identity unique within its containing session, independent of label or equal bounds.", range: string, required: true}
  interruption_type: {description: "Optional open supplied event-type descriptor, such as the illustrated APP_SWITCH; not automatically an internal/device/external cause or suspending/terminating outcome.", range: string}
  visited_app_labels: {description: "Optional supplied ordered visited-app label list; duplicates, empty strings and unknown/empty membership retained without converting labels to packages or inferring complete timed transitions.", range: string, multivalued: true}
  feature_session_id: {description: "Supplied app-session identity scoped by profile/participant/device; not an inferred app/time join key.", range: string, required: true}
  device_use_session_reference: {description: "Optional explicitly supplied parent device-session ID. Exact source-compatible children resolve one unique same-profile/work/participant parent with compatible known device; unknown device never selects among multiple parents. Null/omission remains unknown. No clock or raw join is inferred.", range: string, pattern: '\S'}
  session_action_reference: {description: "Optional explicitly supplied action/foreground-period or unlock-attempt ID local to the explicitly referenced parent device session. A nonnull action requires its parent; known app/role contradictions reject without inferring unknown membership or timing.", range: string, pattern: '\S'}
  support_screenshot_references: {description: "Optional ordered supplied prior-context image IDs local to the same screenshot container. Null/omission is unknown and [] explicitly empty; no missing image, timestamp, model execution or inferred previousness is reconstructed.", range: string, multivalued: true, pattern: '\S'}
  screenshot_session_id: {description: "Supplied screenshot-container identity scoped by profile/participant/device, source-defined phone-use or foreground-app ownership; not inferred from app or unlock timing.", range: string, required: true}
  screenshots: {description: "Supplied screenshot members in preserved array order; [] means explicitly empty supplied membership, not a complete original capture claim.", range: SessionScreenshotRecord, multivalued: true, inlined_as_list: true, required: true}
  screenshot_record_id: {description: "Supplied screenshot identity local to its owning session, independent of capture time or image equality.", range: string, required: true}
  screenshot_sequence_position: {description: "Optional supplied nonnegative sequence position, unique within session; sparse positions do not reveal index base or equal-time sorting.", range: integer, minimum_value: 0}
  screenshot_instant: {description: "Optional supplied screenshot capture-time token; no encoding, timezone or duration is inferred.", range: string}
  screenshot_range_annotations: {description: "Supplied session-local range annotations in preserved order; omission/null is unknown and [] explicitly empty. Neither entails negative intent labels.", range: ScreenshotRangeAnnotationRecord, multivalued: true, inlined_as_list: true}
  range_annotation_id: {description: "Supplied annotation identity local to the owning screenshot session, not inferred from equal endpoints or labels.", range: string, required: true}
  first_screenshot_reference: {description: "Optional supplied first endpoint resolving within the owning session; unknown is not the session's first screenshot.", range: string}
  last_screenshot_reference: {description: "Optional supplied last endpoint resolving within the owning session; unknown is not the session's last screenshot.", range: string}
  range_label_values_json: {description: "Supplied lexical JSON object of open dimension labels to values, or JSON null. Partial, empty, omitted and supplied-null objects stay distinct; no codebook, completeness or relabel rule is imposed.", range: string}
  session_record_origin: {description: "Constructed example versus supplied normalized session; neither authenticates source rows.", range: InteractionTraceRecordOriginId, required: true}
  app_name: {description: "Supplied application label qualifying feature names, distinct from an optional package name; no package inference or taxonomy restriction.", range: string, required: true}
  feature_occurrences: {description: "Supplied ordered instances in the owning session; [] is explicit empty membership, not missing data. No feature-label deduplication occurs.", range: AppFeatureOccurrenceRecord, multivalued: true, inlined_as_list: true, required: true}
  feature_occurrence_id: {description: "Supplied instance identity unique within its owning session even at identical feature labels/times.", range: string, required: true}
  feature_name: {description: "Supplied feature label scoped by the owning application; not a global closed vocabulary or an occurrence identity.", range: string, required: true}
  session_feature_selections: {description: "Supplied session-local response records; null/omission remains unknown, [] explicitly empty. No prompt or sampling eligibility is inferred.", range: SessionFeatureSelectionRecord, multivalued: true, inlined_as_list: true}
  selection_response_status: {description: "Supplied nonblank open response-state label, not a source-code enum, timer execution or inferred negative response.", range: string, required: true}
