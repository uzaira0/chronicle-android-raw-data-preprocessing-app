  timezone: {description: Original recording timezone (preserved)., range: string}
  records_occurrence: {description: The real-world occurrence this record logs., range: PlatformEventOccurrence}
  observed_property: {description: The device property the logger observed., range: string}
  result_record: {description: The event record produced by the logging observation., range: UsageEventRecord}

  start_instant: {description: Interval start instant., range: string}
  end_instant: {description: Interval end instant., range: string}
  duration_seconds: {description: Interval duration in seconds., range: float, slot_uri: qudt:hasQuantityValue}
  start_status: {description: Endpoint status of the start., range: EndpointStatus}
  end_status: {description: Endpoint status of the end., range: EndpointStatus}

  denotes_interval: {description: The phenomenon-time interval this assertion denotes., range: UsageInterval}
  reconstructed_by: {description: The execution that produced this assertion., range: ReconstructionExecution}
  attribution: {description: Person attribution for this episode., range: AttributionAssertion}
  measurement_layer: {description: Measurement-model layer., range: MeasurementLayer}
  date: {description: "Local calendar date the row is attributed to, in the run's output timezone (see TimezoneNormalizationPolicyId) and under the selected DayBoundaryAttributionId.", range: date}
  produced_by: {description: The operation execution that produced this measure., range: OperationExecution}
  cites_parameter_set: {description: The ParameterSet under which this measure was produced., range: ParameterSet}
