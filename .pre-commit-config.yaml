repos:
  # File hygiene — fast, commit stage
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: 'web/src/wasm/'
      - id: check-yaml
        exclude: '\.ast-grep/'
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: 'web/src/wasm/'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.csv$'

  # Rust formatting — fast, commit stage
  - repo: local
    hooks:
      - id: cargo-fmt-matcher
        name: cargo fmt (matcher)
        entry: cargo fmt --manifest-path rust/chronicle_app_usage_matcher/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false

  # Code complexity ceilings — commit stage (prevent regressions)
  - repo: local
    hooks:
      - id: web-complexity
        name: Web/TS cyclomatic complexity (ESLint, ceiling 37)
        language: script
        entry: scripts/check-web-complexity.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^web/src/

  # Slower checks — push stage only
  - repo: local
    hooks:
      - id: cargo-clippy-matcher
        name: cargo clippy (matcher)
        entry: cargo clippy --manifest-path rust/chronicle_app_usage_matcher/Cargo.toml --no-default-features -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: tsc
        name: tsc (web)
        entry: npm run --prefix web typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: license-compliance
        name: License compliance (npm + Rust)
        language: script
        entry: scripts/check-licenses.sh
        pass_filenames: false
        stages: [pre-push]

      - id: run-fuzz-sanity
        name: Fuzz sanity — match_core (10s)
        language: script
        entry: scripts/run-fuzz-sanity.sh
        stages: [pre-push]
        pass_filenames: false
        files: ^rust/chronicle_app_usage_matcher/

      - id: e2e-all-browsers
        name: E2E smoke — all browsers
        language: script
        entry: scripts/run-e2e-all-browsers.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: web-coverage
        name: Web/TS test coverage (vitest thresholds)
        language: script
        entry: scripts/check-web-critical-coverage.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/src/

      - id: lighthouse
        name: Lighthouse Core Web Vitals (local)
        language: script
        entry: scripts/check-lighthouse.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: dependency-audit
        name: Dependency vulnerability audit (npm + Rust)
        language: script
        entry: scripts/check-dependencies.sh
        pass_filenames: false
        stages: [pre-push]

      - id: semgrep-security
        name: Semgrep — chronicle security rules
        language: script
        entry: scripts/check-semgrep.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/src/

  # Dead code detection — commit stage (fast)
  - repo: local
    hooks:
      - id: knip
        name: Web/TS dead code (knip)
        language: script
        entry: scripts/check-knip.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^web/src/

  # Contract drift detection — push stage
  - repo: local
    hooks:
      - id: contract-check
        name: Generated contract artifacts in sync
        language: script
        entry: scripts/check-contract.sh
        pass_filenames: false
        stages: [pre-push]
        files: |
          (?x)^(
            web/schema/|
            web/src/lib/generatedContract\.ts|
            web/src/lib/types\.ts
          )
  - repo: local
    hooks:
    - id: no-ai-attribution
      name: no AI/agent attribution in the commit message
      entry: co-authored-by:[^\n]*(claude|anthropic|gpt|copilot|cursor)|@anthropic\.com|🤖
        generated with|generated with \[claude|generated by claude|claude-session:|claude\.ai/code|assisted-by:[^\n]*(claude|chatgpt|copilot)
      language: pygrep
      args:
      - -i
      stages:
      - commit-msg
