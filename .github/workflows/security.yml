# research-canonical: security-scan v1
# Secret scanning (gitleaks) + dependency-vulnerability audit (osv-scanner) on push/PR.
name: security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action requires GITHUB_TOKEN to scan pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # osv-scanner-action ships ONLY as a reusable workflow — its root action.yml is
  # branding-only (no `runs:`), and there is no `v1`/`v2` moving tag — so the
  # previous `uses: google/osv-scanner-action@v1` step never resolved. Call the
  # reusable workflow at the job level, pinned to a real release tag.
  osv-scanner:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # --config is required: a recursive scan only auto-loads an
      # osv-scanner.toml sitting beside each lockfile, so the repo-root
      # exception file is ignored without it.
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
