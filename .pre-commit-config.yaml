repos:
  # File hygiene — fast, commit stage
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: 'web/src/wasm/'
      - id: check-yaml
        exclude: '\.ast-grep/'
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python linting + formatting — fast, commit stage
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Rust formatting — fast, commit stage
  - repo: local
    hooks:
      - id: cargo-fmt-matcher
        name: cargo fmt (matcher)
        entry: cargo fmt --manifest-path rust/chronicle_app_usage_matcher/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-fmt-wasm
        name: cargo fmt (wasm)
        entry: cargo fmt --manifest-path rust/chronicle_app_usage_wasm/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false

  # Code complexity ceilings — commit stage (prevent regressions)
  - repo: local
    hooks:
      - id: python-complexity
        name: Python cyclomatic complexity (radon, ceiling 50)
        language: script
        entry: scripts/check-python-complexity.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^src/chronicle_preprocessing_app/

      - id: web-complexity
        name: Web/TS cyclomatic complexity (ESLint, ceiling 37)
        language: script
        entry: scripts/check-web-complexity.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^web/src/

  # Slower checks — push stage only
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: python
        additional_dependencies: [basedpyright==1.39.3]
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-clippy-matcher
        name: cargo clippy (matcher)
        entry: cargo clippy --manifest-path rust/chronicle_app_usage_matcher/Cargo.toml --no-default-features -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-clippy-wasm
        name: cargo clippy (wasm)
        entry: cargo clippy --manifest-path rust/chronicle_app_usage_wasm/Cargo.toml -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: tsc
        name: tsc (web)
        entry: npm run --prefix web typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: license-compliance
        name: License compliance (Python + npm + Rust)
        language: script
        entry: scripts/check-licenses.sh
        pass_filenames: false
        stages: [pre-push]

      - id: run-parity-check
        name: Python↔WASM parity check
        language: script
        entry: scripts/run-parity-check.sh
        pass_filenames: false
        stages: [pre-push]
        files: |
          (?x)^(
            src/chronicle_preprocessing_app/|
            web/src/wasm/|
            web/src/lib/browserPipeline\.ts|
            rust/chronicle_app_usage_wasm/
          )

      - id: run-fuzz-sanity
        name: Fuzz sanity — match_core (10s)
        language: script
        entry: scripts/run-fuzz-sanity.sh
        stages: [pre-push]
        pass_filenames: false
        files: ^rust/chronicle_app_usage_matcher/

      - id: check-python-mutation
        name: Mutation testing (timestamp + timezone preprocessors ≥ 80%)
        language: script
        entry: scripts/check-python-mutation.sh
        stages: [pre-push]
        pass_filenames: false
        files: |
          (?x)^(
            src/chronicle_preprocessing_app/core/preprocessing/timestamp_preprocessor\.py|
            src/chronicle_preprocessing_app/core/preprocessing/timezone_preprocessor\.py|
            src/chronicle_preprocessing_app/core/preprocessing/app_filter_preprocessor\.py|
            src/chronicle_preprocessing_app/core/preprocessing/screen_usage_preprocessor\.py|
            tests/test_timestamp_properties\.py|
            tests/test_timestamp_timezone_preprocessors\.py|
            tests/test_study_date_provider\.py|
            tests/test_app_filter_preprocessor\.py|
            tests/test_screen_usage_preprocessor\.py
          )$

      - id: visual-regression
        name: Visual regression (chromium)
        language: script
        entry: scripts/run-visual-regression.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: e2e-all-browsers
        name: E2E smoke — all browsers
        language: script
        entry: scripts/run-e2e-all-browsers.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: python-coverage
        name: Python critical path coverage (≥90%)
        language: script
        entry: scripts/check-python-critical-coverage.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^src/chronicle_preprocessing_app/

      - id: web-coverage
        name: Web/TS test coverage (vitest thresholds)
        language: script
        entry: scripts/check-web-critical-coverage.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/src/

      - id: benchmark-regression
        name: Benchmark regression gate (≤20% slower than baseline)
        language: script
        entry: scripts/check-benchmark-regression.sh
        pass_filenames: false
        stages: [pre-push]
        files: |
          (?x)^(
            src/chronicle_preprocessing_app/|
            rust/chronicle_app_usage_matcher/|
            tests/benchmarks/
          )

      - id: wasm-size
        name: WASM binary size ceilings
        language: script
        entry: scripts/check-wasm-size.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/src/wasm/

      - id: bundle-size
        name: JS bundle size ceiling (2MB)
        language: script
        entry: scripts/check-bundle-size.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/src/

      - id: lighthouse
        name: Lighthouse Core Web Vitals (local)
        language: script
        entry: scripts/check-lighthouse.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: dependency-audit
        name: Dependency vulnerability audit (Python + npm + Rust)
        language: script
        entry: scripts/check-dependencies.sh
        pass_filenames: false
        stages: [pre-push]

      - id: semgrep-security
        name: Semgrep — chronicle security rules
        language: script
        entry: scripts/check-semgrep.sh
        pass_filenames: false
        stages: [pre-push]
        files: |
          (?x)^(
            src/|
            web/src/
          )

  # Dead code detection — commit stage (fast)
  - repo: local
    hooks:
      - id: vulture
        name: Python dead code (vulture, ≥80% confidence)
        language: script
        entry: scripts/check-vulture.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^src/chronicle_preprocessing_app/

      - id: knip
        name: Web/TS dead code (knip)
        language: script
        entry: scripts/check-knip.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^web/src/

  # Contract drift detection — commit stage
  - repo: local
    hooks:
      - id: contract-check
        name: Generated contract artifacts in sync
        language: script
        entry: scripts/check-contract.sh
        pass_filenames: false
        stages: [pre-push]
        files: |
          (?x)^(
            src/chronicle_preprocessing_app/core/config\.py|
            web/src/lib/generatedContract\.ts|
            web/src/lib/types\.ts
          )
