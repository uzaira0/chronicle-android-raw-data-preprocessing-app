# Output-column semantics catalog — instance data for OutputColumnCatalog in
# chronicle-local-contract.linkml.yaml.
#
# HAND-AUTHORED semantics layer (descriptions, units, alignments). The column
# NAMES are bijection-checked against the emit-order SSOT
# (declared_app_output_columns / declared_screen_output_columns in Rust) by
# web/scripts/generate_output_codebook_artifacts.mts, which also renders
# docs/researcher-output-codebook.md. Adding/removing a column in code without
# updating this catalog fails check:contract.
output_columns:
  # ── Identity / provenance (both outputs) ──
  - column_name: study_id
    column_outputs: [app, screen]
    value_type: string
    column_description: Study identifier as it appears in the raw Chronicle export, preserved unchanged.
  - column_name: study_name
    column_outputs: [app, screen]
    value_type: string
    column_description: Your own study label, entered in the app (the study_name option); not from the raw data.
  - column_name: participant_id
    column_outputs: [app, screen]
    value_type: string
    column_description: Participant identifier from the raw Chronicle export.
  - column_name: possible_device_model
    column_outputs: [app, screen]
    value_type: string
    column_description: Device model inferred from the raw export's device metadata, when present.
  - column_name: username
    column_outputs: [app, screen]
    value_type: string
    column_description: Chronicle account username from the raw export.
  - column_name: event_timestamp
    column_outputs: [app, screen]
    value_type: timestamp
    column_description: Timestamp of the raw event that opened this usage row, in the row's output timezone.
    vocabulary_alignment: Android UsageEvents.Event#getTimeStamp
  - column_name: date
    column_outputs: [app, screen]
    value_type: date
    column_description: Calendar date of the row's start, after timezone handling.
  - column_name: timezone
    column_outputs: [app, screen]
    value_type: string
    column_description: IANA timezone the row's timestamps are expressed in (after the selected/primary filter or conversion).
  - column_name: app_package_name
    column_outputs: [app, screen]
    value_type: string
    column_description: Android application package (e.g. com.google.android.youtube). For screen rows, a screen-session pseudo-package.
    vocabulary_alignment: Android UsageEvents.Event#getPackageName
  - column_name: application_label
    column_outputs: [app, screen]
    value_type: string
    column_description: Human-readable app name recorded by Chronicle at collection time.

  # ── Codebook categories (app output, when use_app_codebook) ──
  - column_name: genreId_scraped
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: Play-Store genre scraped for the package (codebook passthrough).
  - column_name: broad_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook and include_category_column
    column_description: Single broad category chosen from the codebook's per-source category columns (first non-empty in preference order).
  - column_name: codebook_application_label
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: App name as recorded in the app codebook (may differ from the device-reported label).
  - column_name: bcm_play_store_genreId
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM codebook — Play-Store genre id for the package.
  - column_name: bcm_play_store_genre
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM codebook — Play-Store genre name.
  - column_name: bcm_play_store_broad_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM codebook — broad category derived from the Play-Store genre.
  - column_name: bcm_play_store_developer
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM codebook — Play-Store developer name.
  - column_name: bcm_play_store_free
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM codebook — whether the Play-Store listing is free.
  - column_name: bcm_play_store_rating
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM codebook — Play-Store content rating.
  - column_name: bcm_play_store_downloads
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM codebook — Play-Store download-count bracket.
  - column_name: usc_broad_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: USC codebook — broad category.
  - column_name: usc_genreId
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: USC codebook — genre id.
  - column_name: umich_child_app_category_code
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: UMich codebook — child-app category code.
  - column_name: umich_child_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: UMich codebook — child-app category.
  - column_name: umich_adult_app_category_code
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: UMich codebook — adult-app category code.
  - column_name: umich_adult_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: UMich codebook — adult-app category.
  - column_name: umich_free
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: UMich codebook — whether the app is free.
  - column_name: umich_gambling_app
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: UMich codebook — gambling-app indicator.
  - column_name: umich_inappropriate_app
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: UMich codebook — inappropriate-app indicator.
  - column_name: babyemu_genreId_scraped
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BabyEMU codebook — scraped genre id.
  - column_name: babyemu_genreId_manual
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BabyEMU codebook — manually assigned genre id.
  - column_name: babyemu_broad_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BabyEMU codebook — broad category.
  - column_name: babyemu_medium_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BabyEMU codebook — medium-granularity category.
  - column_name: babyemu_fine_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BabyEMU codebook — fine-granularity category.
  - column_name: babyemu_alternate_fine_app_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BabyEMU codebook — alternate fine category.
  - column_name: babyemu_kids
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BabyEMU codebook — kids-app indicator.
  - column_name: bcm_cnrc_heuristic_category
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM CNRC codebook — heuristic category assignment.
  - column_name: bcm_cnrc_categorization_source
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: BCM CNRC codebook — which source produced the heuristic category.
  - column_name: codebook_dataset
    column_outputs: [app]
    value_type: string
    present_when: use_app_codebook
    column_description: Which codebook dataset the category row came from.

  # ── Session core (both outputs) ──
  - column_name: interaction_type
    column_outputs: [app, screen]
    value_type: string
    column_description: >-
      Row kind — "App Usage" for reconstructed foreground sessions, "Screen Usage"
      for screen-on sessions, "Filtered App Usage" and related marker types for
      rows retained as timing witnesses. Derived from Android UsageEvents
      transitions (Activity Resumed/Paused/Stopped and screen events).
    vocabulary_alignment: Android UsageEvents event types (P&T pairing vocabulary)
  - column_name: start_timestamp
    column_outputs: [app, screen]
    value_type: timestamp
    column_description: Session start, in the row's output timezone.
  - column_name: stop_timestamp
    column_outputs: [app, screen]
    value_type: timestamp
    column_description: Session end, in the row's output timezone.
  - column_name: app_usage_end_reason
    column_outputs: [app]
    value_type: string
    column_description: >-
      Why this app episode ended, and whether the log actually said so. An end
      the log recorded and an end a rule repaired are indistinguishable in the
      duration column, so this is the column that separates them. Any value
      beginning `assumed_` was inferred; every other value was observed.
      Observed: `same_app_stop_event`, `other_app_stop_event`,
      `activity_stopped_event`, `another_app_opened`, `app_moved_to_background`,
      `screen_turned_off`, `device_powered_off_or_idle`. Inferred:
      `assumed_end_at_next_event`, `assumed_end_at_next_activity`,
      `assumed_end_at_timeout`. `recording_ended_while_open` means the data ran
      out while the episode was open; `no_end_found` means nothing in the log
      ended it. Values name what happened to the device, never the rule that
      noticed it, so two rules finding the same stop event report the same
      value; the selected reconstruction rule is recorded separately and
      determines which values can appear. Blank on rows that are not app
      episodes. Spelled like `screen_usage_end_reason`, its screen-table twin.
    present_when: always (opt out with include_app_usage_end_reason)
  - column_name: usage_session_id
    column_outputs: [app]
    value_type: integer
    column_description: >-
      Which usage session this app episode belongs to, under the selected
      session grouping policy. Numbered from 0 within each participant and
      restarting for each participant, so ids are only comparable inside one
      participant. Consecutive episodes carrying the same id were judged one
      continuous stretch of phone use; the id increments at the first episode
      AFTER a gap large enough to break the session. The gap is measured from
      one episode's stop to the next one's start, and which gap counts as large
      enough is the policy's published constant — the policies differ in that
      constant, in whether a gap exactly equal to it splits, and in whether a
      change of foreground app also ends a session. Apps are not distinguished
      under any policy except `ross_15s`. Blank on rows that are not app
      episodes and on episodes with no reconstructed interval, which cannot be
      placed relative to their neighbours.
    present_when: session_grouping_policy is not none
  - column_name: duration_seconds
    column_outputs: [app, screen]
    value_type: float
    units: seconds
    column_description: Session length (stop − start) in seconds.
  - column_name: duration_minutes
    column_outputs: [app, screen]
    value_type: float
    units: minutes
    column_description: Session length in minutes (duration_seconds × 1/60).
  - column_name: any_app_usage_flags
    column_outputs: [app]
    value_type: list_text
    column_description: >-
      Quality flags for the row rendered as a list literal — ">N-HR TIME GAP" when
      the preceding data gap crossed a long_data_time_gap threshold, ">N-HR APP
      USAGE" when the session itself crossed a long_usage_duration threshold.
  - column_name: data_time_gap_hours
    column_outputs: [app, screen]
    value_type: float
    units: hours
    column_description: Hours since the previous raw data row from the device (device-silent gap preceding this row).

  # ── Calendar decomposition (both outputs) ──
  - column_name: day
    column_outputs: [app, screen]
    value_type: integer
    column_description: Weekday number of the row's date, 1 = Sunday … 7 = Saturday.
  - column_name: weekdayMF
    column_outputs: [app, screen]
    value_type: binary_flag
    column_description: 1 when the date falls Monday–Friday.
  - column_name: weekdayMTh
    column_outputs: [app, screen]
    value_type: binary_flag
    column_description: 1 when the date falls Monday–Thursday.
  - column_name: weekdaySuTh
    column_outputs: [app, screen]
    value_type: binary_flag
    column_description: 1 when the date falls Sunday–Thursday.
  - column_name: hour
    column_outputs: [app, screen]
    value_type: integer
    column_description: Local hour of day (0–23) of the row's start.
  - column_name: quarter
    column_outputs: [app, screen]
    value_type: integer
    column_description: Calendar quarter (1–4) of the row's date.

  # ── Engagement walk (app output; EYES-manual metric family) ──
  - column_name: valid_app_new_engage_30s
    column_outputs: [app]
    value_type: binary_flag
    filter_dependent: true
    column_description: >-
      1 when this session begins a new engagement — ≥30 s since the previous
      usage — computed over VALID (non-filtered) apps only.
    vocabulary_alignment: EYES manual engagement metrics
  - column_name: valid_app_new_engage_custom_{custom_app_engagement_duration}s
    column_outputs: [app]
    value_type: binary_flag
    filter_dependent: true
    column_description: >-
      Same as valid_app_new_engage_30s with your custom engagement gap (the
      custom_app_engagement_duration option, stamped into the header).
    vocabulary_alignment: EYES manual engagement metrics
  - column_name: valid_app_switched_app
    column_outputs: [app]
    value_type: binary_flag
    filter_dependent: true
    column_description: 1 when the session's app differs from the previous valid-app session (an app switch).
    vocabulary_alignment: EYES manual engagement metrics
  - column_name: valid_app_usage_time_gap_hours
    column_outputs: [app]
    value_type: float
    units: hours
    filter_dependent: true
    column_description: Hours since the previous valid-app session ended.
  - column_name: any_app_new_engage_30s
    column_outputs: [app]
    value_type: binary_flag
    column_description: >-
      1 when this session begins a new engagement (≥30 s since previous usage),
      computed over ALL apps including filtered ones.
    vocabulary_alignment: EYES manual engagement metrics
  - column_name: any_app_new_engage_custom_{custom_app_engagement_duration}s
    column_outputs: [app]
    value_type: binary_flag
    column_description: Same as any_app_new_engage_30s with your custom engagement gap.
    vocabulary_alignment: EYES manual engagement metrics
  - column_name: any_app_switched_app
    column_outputs: [app]
    value_type: binary_flag
    column_description: 1 when the session's app differs from the previous session over all apps.
    vocabulary_alignment: EYES manual engagement metrics
  - column_name: any_app_usage_time_gap_hours
    column_outputs: [app]
    value_type: float
    units: hours
    column_description: Hours since the previous session (any app) ended.

  # ── Screen-session diagnostics (screen output) ──
  - column_name: screen_usage_end_reason
    column_outputs: [screen]
    value_type: string
    column_description: Why the screen session ended (auto-lock timeout, manual lock, keyguard, shutdown, data gap).
  - column_name: screen_usage_end_reason_confidence
    column_outputs: [screen]
    value_type: string
    column_description: Confidence grade for the end reason (direct event vs inferred).
  - column_name: screen_usage_stop_event_type
    column_outputs: [screen]
    value_type: string
    column_description: Raw event type that closed the session.
  - column_name: screen_usage_last_activity_timestamp
    column_outputs: [screen]
    value_type: timestamp
    column_description: Last app-activity timestamp observed inside the session.
  - column_name: screen_usage_tail_gap_seconds
    column_outputs: [screen]
    value_type: float
    units: seconds
    column_description: Seconds between the last in-session activity and the session end.
  - column_name: screen_usage_foreground_app_package
    column_outputs: [screen]
    value_type: string
    column_description: Package foregrounded when the session ended, when known.
  - column_name: screen_usage_session_classification
    column_outputs: [screen]
    value_type: string
    present_when: "screen_session_classification_policy is not none"
    column_description: Source-selected session label (phone_check, app, or null), when a literature classification policy is enabled.
  - column_name: screen_usage_apps_forcing_screen_open_label
    column_outputs: [screen]
    value_type: string
    column_description: Label of the matched screen-forcing app (from the apps-forcing-screen-open file), when one anchored the session.
  - column_name: screen_usage_lock_screen_only
    column_outputs: [screen]
    value_type: string
    column_description: Marker for sessions that never left the lock screen.

  # ── Run provenance (both outputs) ──
  - column_name: preprocessor_version
    column_outputs: [app, screen]
    value_type: string
    column_description: Version of the preprocessing engine that produced the file.
  - column_name: datetime_of_preprocessing
    column_outputs: [app, screen]
    value_type: timestamp
    column_description: UTC wall-clock stamp of the processing run (one stamp per file per session).

  # ── Concurrent-usage layer (app output, when model_concurrent_usage) ──
  - column_name: usage_layer
    column_outputs: [app]
    value_type: string
    present_when: model_concurrent_usage
    column_description: >-
      "primary" when the app was the sole foreground app for the row's
      sub-interval, "secondary" when it ran underneath another app (split-screen
      or picture-in-picture).

  # ── Research-axis columns (present only when the named option selects them) ──
  - column_name: screen_interval_id
    column_outputs: [app, screen]
    value_type: string
    present_when: >-
      app output: episode_reconstruction_strategy = schoedel_2026_app_within_screen_prose_v1;
      screen output: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: >-
      Identifier of a constructed screen interval. On a screen row it names that
      interval; on an app row it names the screen interval the app episode was
      reconstructed inside, so the two files join on this column.
  - column_name: schoedel_completion
    column_outputs: [app]
    value_type: string
    present_when: episode_reconstruction_strategy = schoedel_2026_app_within_screen_prose_v1
    column_description: >-
      How the episode's end was decided under the Schoedel rule:
      last_package_event_before_different_app (the next event came from another
      app), last_package_event_before_screen_end (the screen interval ended
      first), singleton_zero_length (a single event, zero duration), or
      right_censored_screen_interval (the enclosing screen interval had no
      observed end).
  - column_name: micro_use_classification
    column_outputs: [app]
    value_type: string
    present_when: micro_use_classification_policy is not none
    column_description: >-
      Descriptive label from the selected micro-use rule (okoshi_lt5s: shorter
      than 5 s): micro_use, not_micro_use, or not_classifiable when the episode
      has no positive duration or no observed end (End of Usage Missing);
      not_applicable on rows that are not usage episodes (screen and device
      events, stop events, placeholders). Labels only; no row is removed or
      re-timed.
  - column_name: raw_episode_duration_seconds
    column_outputs: [app]
    value_type: float
    units: seconds
    present_when: >-
      minimum_duration_comparator is not strict_lt, or minimum_duration_disposition
      is not chronicle_blank_keep_row, or maximum_duration_policy =
      post_reconstruction_strict_max_v1 with a threshold
    column_description: >-
      Duration of the reconstructed episode before any minimum- or
      maximum-duration rule touched it. Stays filled when duration_seconds is
      blanked or truncated, so both rules can be audited against the raw span.
  - column_name: minimum_duration_qualified
    column_outputs: [app]
    value_type: string
    present_when: >-
      minimum_duration_comparator is not strict_lt, or minimum_duration_disposition
      is not chronicle_blank_keep_row
    column_description: >-
      true when the raw episode duration falls below minimum_usage_duration under
      the selected comparator (so the minimum-duration disposition applied to
      this row), false otherwise; empty for rows that are not reconstructed
      episodes.
  - column_name: minimum_duration_aggregate_eligible
    column_outputs: [app]
    value_type: string
    present_when: >-
      minimum_duration_comparator is not strict_lt, or minimum_duration_disposition
      is not chronicle_blank_keep_row
    column_description: >-
      true when this row still counts toward aggregate usage totals after the
      minimum-duration disposition; false when the disposition kept the row but
      excluded it from totals (retain_but_exclude); empty on rows that are not
      reconstructed episodes.
  - column_name: maximum_duration_qualified
    column_outputs: [app]
    value_type: string
    present_when: maximum_duration_policy = post_reconstruction_strict_max_v1 with a threshold
    column_description: >-
      true when the raw episode duration is strictly greater than the maximum
      duration threshold (equality does not qualify), false when it is not;
      empty on rows that are not reconstructed episodes.
  - column_name: maximum_duration_aggregate_eligible
    column_outputs: [app]
    value_type: string
    present_when: maximum_duration_policy = post_reconstruction_strict_max_v1 with a threshold
    column_description: >-
      true when this row still counts toward aggregate usage totals after the
      maximum-duration disposition; false when retain_but_exclude kept the row
      but excluded it from totals; empty on rows that are not reconstructed
      episodes.
  - column_name: maximum_duration_trimmed_seconds
    column_outputs: [app]
    value_type: float
    units: seconds
    present_when: maximum_duration_policy = post_reconstruction_strict_max_v1 with a threshold
    column_description: >-
      Seconds removed from the end of the episode by truncate_to_threshold (raw
      duration minus the threshold); empty when the episode was not truncated.
      Also filled for a filtered app's episode, whose stop stays blank because
      filtered rows publish no timing.
  - column_name: effective_endpoint_reason
    column_outputs: [app]
    value_type: string
    present_when: maximum_duration_policy = post_reconstruction_strict_max_v1 with a threshold
    column_description: >-
      Why stop_timestamp differs from the observed episode end:
      maximum_duration_truncation_boundary when the maximum-duration rule
      truncated it; empty when the published stop is the observed one.
  - column_name: screen_session_construction_strategy
    column_outputs: [screen]
    value_type: string
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: >-
      The screen-session construction rule that built this interval
      (parry_toth_2025_session_glance_v1 or zhu_2018_unlock_lock_v1).
  - column_name: screen_interval_kind
    column_outputs: [screen]
    value_type: string
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: >-
      session or glance, as the selected construction rule classifies the
      interval (a glance is a screen-on period the rule does not count as a
      full session).
  - column_name: screen_start_boundary_source_row
    column_outputs: [screen]
    value_type: integer
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: Row number in the raw export of the event that opened the interval.
  - column_name: screen_stop_boundary_source_row
    column_outputs: [screen]
    value_type: integer
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: >-
      Row number in the raw export of the event that closed the interval; empty
      when the interval has no observed close (right-censored).
  - column_name: screen_start_source_rows
    column_outputs: [screen]
    value_type: list_text
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: Every raw-export row number that contributed to the interval's start.
  - column_name: screen_stop_source_rows
    column_outputs: [screen]
    value_type: list_text
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: Every raw-export row number that contributed to the interval's stop.
  - column_name: screen_interval_close_reason
    column_outputs: [screen]
    value_type: string
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: >-
      What ended the interval: screen_non_interactive, device_screen_off,
      device_shutdown, or right_censored_observation_window (the data ended
      before the screen did).
  - column_name: screen_interval_left_censored
    column_outputs: [screen]
    value_type: string
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: >-
      Reserved for intervals already open when the observed data begins. This
      version does not detect left-censoring, so the column is always false.
  - column_name: screen_interval_right_censored
    column_outputs: [screen]
    value_type: string
    present_when: screen_session_construction_strategy other than chronicle_screen_interactive_v1
    column_description: >-
      true when the interval was still open at the end of the observed data, so
      its real end is unknown.
