# Meta-test (run with: sg test). The `invalid` snippet executes a wiring
# through runUnit outside graphDef.ts — the side channel the rule blocks.
# (Path-level exemptions for graphDef.ts/stepRunner.ts live in the rule's
# files/ignores globs, which snippet tests do not exercise.)
id: chronicle-web-rununit-confinement
valid:
  - "const result = await engine.run(makeCtx(options), keys);"
  - "const wired = wireUnit(\"parse_events\", steps);"
invalid:
  - "const out = await runUnit(parseEventsWiring, ctx, inputs);"
  - "runUnit(dedupWiring, ctx, { rows });"
