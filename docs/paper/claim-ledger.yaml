schema_version: "1.0.0"
ledger_version: "1.0.6"
ledger_id: "chronicle:paper-claim-ledger"
as_of: "2026-09-27"

change_control:
  versioning: >-
    Bump the semantic ledger_version whenever a canonical statement, scope, status tuple,
    prohibited inference, or required gate changes. Never rewrite a released status silently.
  history_policy: "Append one history entry per released ledger revision."
  manuscript_rule: "Outlines must copy canonical statements, status tuples, and gate IDs exactly or label their text as non-canonical prose."

history:
