name: Web PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Check generated contract artifacts
        working-directory: web
        run: npm run check:contract

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Validate Cloudflare-style build artifact
        working-directory: web
        run: npm run check:deploy-artifact

      - name: Prepare GitHub Pages artifact
        working-directory: web
        run: npm run prepare:github-pages

      - name: Validate GitHub Pages artifact
        working-directory: web
        run: npm run check:github-pages-artifact

      - name: Run deterministic browser parity
        run: python scripts/run_deterministic_web_parity.py

      - name: Run browser smoke E2E
        working-directory: web
        run: npm run test:e2e:smoke

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/.github-pages-dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
