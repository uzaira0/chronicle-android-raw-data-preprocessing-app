[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "chronicle-chrono-kernel-py"
version = "0.1.0"
description = "PyO3-bound Chronicle chrono kernels (parse, format, sort, e2e) for benchmarking vs Polars-py."
requires-python = ">=3.10"

[tool.maturin]
module-name = "_rust_chrono_kernel"
manifest-path = "Cargo.toml"
features = []
