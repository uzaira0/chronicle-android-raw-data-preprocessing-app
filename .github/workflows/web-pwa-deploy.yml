name: Web PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Check generated contract artifacts
        working-directory: web
        run: npm run check:contract

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Validate deploy artifact contents
        working-directory: web
        run: npm run check:deploy-artifact

      - name: Run deterministic browser parity
        run: python scripts/run_deterministic_web_parity.py

      - name: Run browser smoke E2E
        working-directory: web
        run: npm run test:e2e:smoke

      - name: Upload static web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist
          if-no-files-found: error

  deploy-preview:
    runs-on: ubuntu-latest
    needs: verify-web
    if: github.event_name == 'pull_request'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Download static web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: .cloudflare-pages-dist

      - name: Skip preview deployment when Cloudflare settings are unavailable
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_PAGES_PROJECT_NAME == ''
        run: echo "Cloudflare Pages preview deployment skipped because required secrets or vars are missing."

      - name: Deploy preview to Cloudflare Pages
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_PAGES_PROJECT_NAME != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy .cloudflare-pages-dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=${{ github.head_ref }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: verify-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Download static web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: .cloudflare-pages-dist

      - name: Skip production deployment when Cloudflare settings are unavailable
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_PAGES_PROJECT_NAME == ''
        run: echo "Cloudflare Pages production deployment skipped because required secrets or vars are missing."

      - name: Deploy production to Cloudflare Pages
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_PAGES_PROJECT_NAME != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy .cloudflare-pages-dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
