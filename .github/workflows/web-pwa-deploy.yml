name: Web PWA

# Bare-minimum deploy to GitHub Pages. No tests run here — all testing
# (typecheck, unit, contract, parity, e2e, security) is local via `make all`.
#
# MANUAL DISPATCH ONLY. There is deliberately no `push` trigger: publishing to
# the live app is an explicit decision, not a side effect of merging. Landing a
# PR must never move what users are served. Review builds are local
# (`npm run host:local`, which serves the production build on 127.0.0.1:4173).
#
# Run it from the Actions tab, or `gh workflow run web-pwa-deploy.yml`, when a
# release to the live app is actually intended.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Deliberately NOT `npm run build`: that runs build:wasm, which shells out
      # to wasm-pack -> cargo. chronicle_preprocessing_runtime_wasm depends on
      # chronicle_preprocessing_semantic_adapter, which pulls semprof-core and
      # semprof-materialize from the PRIVATE repo uzaira0/semantic-profile-toolchain.
      # A runner's GITHUB_TOKEN is scoped to this repository only, so `cargo
      # metadata` cannot even resolve the graph and the job dies before it
      # compiles anything. build:app consumes the WASM packages committed under
      # web/src/wasm/*/pkg (force-tracked for exactly this reason), so the deploy
      # needs Node alone. Their freshness is gated locally by `make all`, whose
      # cargo digest tests fail if the committed pkg drifts from the Rust source.
      # Restoring a from-source build here requires giving the runner read access
      # to that private repo (deploy key or PAT), not a workflow change.
      - name: Build web app from the committed WASM packages
        working-directory: web
        run: npm run build:app

      - name: Prepare GitHub Pages artifact
        working-directory: web
        run: npm run prepare:github-pages

      # Bundle-budget + artifact-shape gate: without this step the check
      # scripts exist but no workflow runs them (a dead gate).
      - name: Check GitHub Pages artifact (bundle budget)
        working-directory: web
        run: npm run check:github-pages-artifact

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/.github-pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
