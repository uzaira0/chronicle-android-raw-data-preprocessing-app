  - id: "delivery:B06"
    ordinal: 6
    key: "maximum_duration_policy"
    label: "Maximum-duration policy"
    requirement: "Make maximum-duration handling explicit, parameterized, and receipted."
    baseline_status: "pending"
    baseline_evidence: >-
      Baseline 312ef63 (and private main 01be6d2) has only the numeric long_duration_threshold_hours
      read inside the fused matcher as a candidate-close admissibility rule; the rejected close
      surfaces as End of Usage Missing and is indistinguishable from an unobserved close. No policy,
      disposition, threshold source, or receipt exists there.
    campaign_implementation:
      status: "accepted_on_private_feature_branch"
      branch: "codex/b06-maximum-duration"
      provenance: "fresh_implementation_from_frozen_b06_decision"
      decision_record: "docs/paper/b06-maximum-duration-research-decision.md"
      proof_matrix: "docs/paper/b06-maximum-duration-proof-matrix.md"
      option_keys:
        - "maximum_duration_policy"
        - "maximum_duration_disposition"
        - "maximum_duration_threshold_source"
        - "maximum_duration_threshold_ns"
        - "long_duration_threshold_explicit"
      accepted_values:
        - "strategy_native"
        - "chronicle_observed_close_rejection_v1"
        - "post_reconstruction_strict_max_v1"
        - "not_applicable"
        - "flag_and_retain"
        - "retain_but_exclude"
        - "truncate_to_threshold"
        - "drop_row"
        - "chronicle_legacy_config"
        - "fixed_parameter"
        - "b12_adaptive_participant"
      selection_shapes:
        - "omitted (all keys absent): legacy behaviour, no receipt, byte-identical outputs"
        - "strategy_native + not_applicable + strategy_native"
        - "chronicle_observed_close_rejection_v1 + not_applicable + chronicle_legacy_config (fused_matcher only)"
        - "post_reconstruction_strict_max_v1 + active disposition + fixed_parameter + threshold_ns"
        - "post_reconstruction_strict_max_v1 + active disposition + b12_adaptive_participant"
      conditional_refusal:
        - crossing: "chronicle_observed_close_rejection_v1 × any non-fused reconstruction strategy"
          reason: "maximum_duration_policy_incompatible_with_reconstruction_strategy"
        - crossing: "b12_adaptive_participant (any policy)"
          reason: "adaptive_maximum_threshold_provider_unavailable"
      refusal_surface: >-
        Both conditional refusals are typed preflight data (maximum_duration_applicability_json,
        status refused + reasonCode) and an execution-time rejection
        (pipeline_options_invalid:b06=<reason>) before any tracked query. They are not
        invalid-request errors on the opener-set preflight, which judges B06 as
        MaximumDurationValidation::MalformedOnly; malformed vectors (shape, threshold grammar,
        legacy companions) stay invalid requests on every surface that judges them.
      campaign_findings:
        - finding: >-
            Interaction tomography (dependency-evidence runs 9–10, 2026-08-17) exposed that the
            opener-set preflight, which the product and the campaign run before the B06 preflight,
            raised the raw pipeline_options_invalid:b06=maximum_duration_policy_incompatible_with_reconstruction_strategy
            error, hiding the typed refusal from the browser and the harness.
          fix: >-
            pipeline_v2::validate_pipeline_v2_options_with(MaximumDurationValidation) and
            RuntimeRequest::validate_fields_with; pinned by
            refused_maximum_duration_vectors_pass_the_opener_preflight_and_surface_through_the_b06_preflight
            (runtime) and maximum_duration_validation_scopes_separate_malformed_vectors_from_typed_refusals
            (kernel).
        - finding: >-
            The screen strategies parry_toth and zhu refuse non_monotonic_source_timestamps on
            non-monotone synthetic corpora; the configuration-space campaign now commits those
            input-dependent refusals as outcomes with warm/cold identity instead of failing.
        - finding: >-
            The committed PICT model (52 parameters) predated the B03–B05 axes; the regenerated
            model carries 61 computational parameters / 148 values.
        - finding: >-
            The B06 @smoke e2e (chromium and firefox, 2026-08-17) exposed that the runtime
            manifest embedded the whole MaximumDurationEvidence, so the participant-level
            excluded lineage crossed the browser boundary and its i64 nanosecond timestamps
            failed the manifest contract ("expected a safe integer").
          fix: >-
            The manifest now carries the PHI-safe aggregate MaximumDurationReceipt only, exactly
            as B04 does; the excluded lineage stays in the content-addressed
            maximum-duration-receipt-json artifact bound by excluded_lineage_digest, and
            MaximumDurationApplicability.threshold_ns became a canonical decimal string so the
            full i64 range (including i64::MAX) travels exactly. Pinned by
            maximum_duration_manifest_carries_the_aggregate_receipt_and_the_artifact_carries_the_lineage
            (runtime) and the @smoke @opfs B06 e2e.
      implementation_sha256: "ecea38b369353a00acf1dd668698f521518ca9ad0643a31602dc5fc216e7e4c8"
      runtime_wasm_sha256: "a59dbb211729ff91b124267e67812e20a48c2b33e68f333f79afdb65d5f2766d"
      dependency_certificate_sha256: "492a963b9e743bb1e8a90edc8dae1267e09c5f7c8ba9d74ed7f75a23c468697e"
      source_commit: "4982ab4"
      gate_evidence:
        - "make ci and the complete make all exit 0 on the committed tree (2026-08-19; b06-makeall-5.log)."
        - "Kernel suite 507 passed, 0 failed, 1 ignored; cargo clippy -D warnings clean on the kernel, adapter, runtime and semantic-index crates."
        - "Web unit suite 74 files / 755 tests; e2e 16 passed on chromium and firefox (b06-e2e-verify2.log)."
        - "Dependency evidence regenerated after every production Rust change (runs 11-16; run 16 follows the refusal-shape fix); declared graph and observed Salsa reads agree."
        - "With every B06 key absent the golden output is byte-identical to the pre-axis baseline at 01be6d2."
      host_limitations:
        - "Playwright WebKit cannot load on the RHEL 9 campaign host (binary requires glibc 2.38; host has 2.34); no WebKit product pass is claimed."
      known_preexisting_gap: >-
        Restoring a persisted reconstruction base that a full (materialized) run produced onto the
        review path reproduces the apply_episode_flags checkpoint differently from the cold oracle;
        reproduced without any B06 key at 01be6d2, so it is not introduced by this axis. B06's own
        persisted-base tests produce their bases on the review path. Tracked separately.
      private_preview_pr: "uzaira0/chronicle-android-preprocessing-app-preview#9 (squash-merged 2026-08-19 as 63fe9c597)"
      pending:
        - "preview_deployment"
        - "production_canary"

