[package]
name = "chronicle_app_usage_matcher"
version = "0.2.0"
edition = "2021"

[lib]
name = "_rust_app_usage_matcher"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:numpy", "dep:pyo3"]

[dependencies]
numpy = { version = "0.29.0", optional = true }
pyo3 = { version = "0.29.0", optional = true }
