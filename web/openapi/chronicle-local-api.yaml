openapi: 3.1.0
info:
  title: Chronicle Local Processing Contract
  version: 1.0.0
  description: Boundary contract for the local-only browser preprocessing surface.
    The canonical source-of-truth model lives in
    `web/schema/chronicle-local-contract.linkml.yaml`; this OpenAPI document is
    generated from that same contract.
servers:
  - url: http://local.worker.invalid
paths:
  /discover-timezones:
    post:
      operationId: discoverTimezones
      summary: Discover distinct timezone values from a raw Chronicle CSV payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverTimezonesRequest"
      responses:
        "200":
          description: Distinct timezone values found in the raw file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverTimezonesResponse"
  /process-raw-csv:
    post:
      operationId: processRawCsv
      summary: Process a raw Chronicle CSV file locally and return app and/or screen
        outputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRawCsvRequest"
      responses:
        "200":
          description: Preprocessing completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessedFileResult"
components:
  schemas:
    BrowserSupportFile:
      type: object
      required:
        - name
        - bytesBase64
      properties:
        name:
          type: string
        bytesBase64:
          type: string
          description: Base64-encoded file contents.
    BrowserSupportFiles:
      type: object
      properties:
        filterFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        appsForcingScreenOpenFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        backgroundAppsFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        appCodebookFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        studyDatesFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Study-dates table (CSV/XLSX): one or more rows per participant
            with the inclusive study-window start and end dates. Optional
            repeated rows add inclusive, source-labeled interior exclusions.
            Consumed by the observation-window step. Columns: participant_id,
            start_date, end_date; optional exclusion_label,
            exclusion_start_date, exclusion_end_date."
        deviceSharingFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: 'Device-sharing table (CSV/XLSX): the sharing status per device.
            Consumed by person attribution. Columns: participant_id,
            sharing_status ("Shared" or "Non-Shared"). Devices are matched
            exactly first, then by numerical id + device number (bare id =
            device 1); a configured table that misses a device is a hard error.'
        surveyAttributionFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Usage-survey answers (CSV/XLSX) that relabel a session's username
            at an exact event timestamp. Columns: participant_id,
            event_timestamp, users."
        enrolledDevicesFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Enrolled/expected device counts per participant (CSV/XLSX) — the
            denominator for compliance validity. Columns: participant_id,
            device_count."
        inputCapabilityEvidenceFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Optional immutable CSV evidence about whether the bound raw input
            can represent the Android screen/keyguard/device signals and
            physical source ordering required by source-sensitive screen-session
            strategies. It uses schema chronicle-input-capability-evidence/v1
            and is retained in a saved project when files are included, but is
            transported only when Parry-Toth or Zhu screen construction is an
            active output or an internal dependency of the Schoedel prose
            reconstruction. Absence reaches the scientific applicability
            resolver and is never converted into a generic missing-file error.
            There is no bundled default.
        analysisFeatureMatrixFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: "Paper-specific analysis feature matrix (CSV). Each feature_id is
            the unique feature-by-temporal-slice column identity. Columns:
            participant_id, feature_id, value, missing_state, feature_set_id."
        callSmsEligibilityFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Paper-specific Call/SMS eligibility and modality-availability rows
            (CSV) consumed only by registered research-method input adapters.
            There is no bundled default.
        phoneStudyPsCommunicationFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Released PhoneStudy ps_communication CSV keyed by id. This source
            table is transported as phonestudy_ps_communication_file only when
            method setting method-setting-faf89bac61ad22df438c751c selects the
            ps_activity relational join. It is distinct from the ES
            questionnaire base and has no bundled default.
        phoneStudyEsFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Released PhoneStudy ES questionnaire base CSV. Required columns are
            user_id and es_questionnaire_id. This source table is transported as
            phonestudy_es_file only for the registered PhoneStudy
            reconstruction, call-feature, or SMS-feature settings. It is
            distinct from ps_communication and has no bundled default.
        anchorEventsFile:
          $ref: "#/components/schemas/BrowserSupportFile"
          description: Anchor events CSV for registered research-method inputs. Required
            columns are participant_id and anchor_timestamp. There is no bundled
            default.
    BrowserProcessingRuntime:
      type: object
      properties:
        datetimeOfPreprocessing:
          type: string
          description: Internal/test-only fixed preprocessing timestamp used to make
            output stamping deterministic across runtimes. This is not intended
            as an end-user option.
      description: Internal/test-only runtime metadata that should not be surfaced as
        end-user options.
    BrowserProcessingOptions:
      type: object
      required:
        - studyName
        - processAppUsage
        - processScreenUsage
        - eventRetentionSet
        - openerSet
        - episodeReconstructionStrategy
        - microUseClassificationPolicy
        - allowStopEventReuse
        - useActivityStoppedAsFallback
        - applyThresholdToFallback
        - longDurationThresholdHours
        - correctDuplicateEventTimestamps
        - deduplicateExactRows
        - dropOutOfSourceOrderEvents
        - timezoneHandling
        - dayBoundaryAttribution
        - useFilterFile
        - filterMatchField
        - applicationLabelExclusions
        - packageExclusionPreset
        - useAppsForcingScreenOpenFile
        - useBackgroundAppsFile
        - useAppCodebook
        - includeCategoryColumn
        - includeAppUsageEndReason
        - enablePlotting
        - includeFilteredAppUsageInPlots
        - enableActivityHeatmap
        - exportPlotsAsSvg
        - enableAggregates
        - aggregateShape
        - aggregateTopAppsLimit
        - enableParticipantAmountSummary
        - enableParquetExport
        - enableSpssExport
        - neutralizeSpreadsheetFormulas
        - enableInteractiveTimeline
        - minimumUsageDuration
        - minimumDurationComparator
        - minimumDurationDisposition
        - filterZeroDurationSessions
        - intervalQualityPolicy
        - sessionGroupingPolicy
        - sessionGapBasis
        - sessionBoundaryScope
        - emitSessionBreakLineage
        - customAppEngagementDuration
        - longUsageDurationThresholds
        - longDataTimeGapThresholds
        - screenSessionConstructionStrategy
        - screenSessionClassificationPolicy
        - screenSessionMaximumDurationMinutes
        - screenSessionMaximumDurationDisposition
        - lockedScreenAudioDisposition
        - screenUsageAutoLockTimeoutSeconds
        - screenUsageAutoLockToleranceSeconds
        - screenUsageManualLockMaxTailGapSeconds
        - screenUsageKeyguardNearStopSeconds
        - parallelProcessing
        - sameAppInteractionTypesToStopUsageAt
        - otherInteractionTypesToStopUsageAt
        - modelConcurrentUsage
        - applyMinimumUsageDurationToConcurrentSubintervals
        - interactionTypesToRemove
        - interactionTypeRemovalMode
        - interactionTypeRemap
        - proximityIntervalSeconds
        - addNoActivityPlaceholderDays
        - enableScreenGatedCrediting
        - screenGatingRule
        - creditedSessionCapMinutes
        - deviceLivenessGapToleranceMinutes
        - autoLockBridgeSeconds
        - bridgeScreenOffToSessionEnd
        - noWitnessMinDayApps
        - notificationProxyRule
        - polledEmulationMethod
        - polledEmulationIntervalSeconds
        - polledEmulationGapSeconds
        - intervalExpansionMethod
        - enableStudyWindowFilter
        - enablePersonAttribution
        - enableComplianceScoring
        - complianceThresholdPercent
        - enableDayCoverage
      properties:
        studyName:
          type: string
          description: A name you choose for this study. It appears in the study_name
            column of every output row. The separate study_id value from the raw
            data stays unchanged.
        processAppUsage:
          type: boolean
          description: Build app episodes and include the app-use CSV in the ZIP. How
            episodes start and end depends on the episode settings below; an end
            can be logged, worked out, or missing.
        processScreenUsage:
          type: boolean
          description: Create screen-use sessions and include the screen-use CSV in the
            ZIP. If the Schoedel app-episode rule needs screen sessions, it
            still runs when this output is off.
        eventRetentionSet:
          type: string
          enum:
            - none
            - parry_toth_7
            - usage_logger_5
            - toth_trifonova_app
            - foreground_background_only
          description: This choice limits which raw event types the app-episode rule can
            use; screen-use results still use every event. The paper-based lists
            were copied from published descriptions and have not been checked
            against original materials. Parry & Toth keeps types 1, 15–18, 26,
            and 27, but not Activity Paused. Usage Logger keeps types 1, 2, 7,
            26, and 27, including User Interaction. Toth & Trifonova keeps types
            1, 2, 17 (Keyguard Shown), and 26. Foreground/background pair keeps
            only types 1 and 2. The default, Retain every event type, uses all
            types. Unknown values also use all types.
        openerSet:
          type: string
          enum:
            - strategy_defined
            - activity_resumed_only
            - gesis_app_scoped_starts
          description: Only retained app events can start an app episode. By default, each
            episode rule uses its usual start events. Activity Resumed only
            allows Android type 1, including Chronicle’s filtered version. GESIS
            app-scoped starts (adapter) uses app-level types 1, 4, 11, 14, 19,
            and 22; device-level types 15, 18, and 27 cannot start app use.
            Other events may still close, bound, explain, or censor an episode.
            The selected episode rule decides what happens when a start has no
            match. Unknown values use the default; direct requests reject
            non-text values.
        episodeReconstructionStrategy:
          type: string
          enum:
            - parry_toth_forward_pairing
            - fused_matcher
            - eyes_complement
            - gesis_start_stop_repair
            - foreground_background_pairing
            - draxler_interruption_aware
            - morrison_lock_tolerant
            - schoedel_2026_app_within_screen_prose_v1
          description: "Choose how raw events become app episodes. Chronicle fused matcher
            (default) keeps the existing matching rule. Parry & Toth forward
            pairing (2025) starts at Activity Resumed and ends at the first of:
            screen off, the same app pausing, or another app resuming. EYES
            complement segmentation removes shutdown, idle, gap, and glance
            periods from the device timeline; an unmatched episode continues to
            the next app start. GESIS start-stop repair (Zerrer et al.) uses
            app, screen, keyguard, and power events; it ends at a same-app end
            when at most 10 events come in between, otherwise at the next event
            within 600 seconds, otherwise at start + 600 seconds, so every
            episode has an end. Ahmed / Okoshi foreground-background pairing
            ends an Activity Resumed event at the next Activity Paused for that
            app; an unmatched start produces no episode. Draxler
            interruption-aware (2021) ends at app backgrounding, screen-off, or
            ten minutes without activity, whichever comes first; after a long
            silence it uses the last observed event. Morrison lock-tolerant
            (2018) ends when the app goes to the background, at an app handover,
            or at a screen lock that lasts 30 seconds; shorter locks count as
            pocket checks. Returning to the same app after a counted lock starts
            a new episode. The 30-second value comes from Bohmer et al. (2011).
            Schoedel within-screen prose derivative (2026) uses the selected
            screen sessions and ends an app episode at its last logged event
            before another app opens or the screen session ends. It is not the
            full PhoneStudy process, which cannot run on ordinary Chronicle
            input."
        microUseClassificationPolicy:
          type: string
          enum:
            - none
            - okoshi_lt_5s
          description: "Don't mark very brief use (default) adds no column. Okoshi: under
            5 seconds marks a bounded episode as very brief only when it lasts
            more than zero and less than five seconds. Exactly five seconds is
            not marked; zero-length and unfinished episodes cannot be
            classified. This setting does not change episode length, start or
            end, inclusion, grouping, or credited time."
        allowStopEventReuse:
          type: boolean
          description: One stop event can close several overlapping sessions. Off by
            default; each stop closes one session.
        useActivityStoppedAsFallback:
          type: boolean
          description: If a session has no recorded stop, use the next Activity Stopped
            event for the same app. This can help with noisy records.
        applyThresholdToFallback:
          type: boolean
          description: When this fallback gives a session longer than the maximum above,
            treat it as having no end instead of as a real session.
        longDurationThresholdHours:
          type: number
          description: For Chronicle's fused matcher, an end more than this many hours
            after the start is not accepted. If no acceptable end is found, the
            episode is reported with a missing end (End of Usage Missing).
        longDurationThresholdHoursExplicit:
          type: boolean
          description: True when you enter a value for the 12-hour maximum, even if it
            stays 12. It does not affect processing; it records whether the
            value was entered or left at its default.
        maximumDurationPolicy:
          type: string
          enum:
            - strategy_native
            - chronicle_observed_close_rejection_v1
            - post_reconstruction_strict_max_v1
          description: Leave this unset to keep Chronicle's existing behavior. Use the
            episode rule's own maximum uses the selected episode rule's own
            limit. Chronicle's original long-episode check (fused matcher only)
            rejects an episode while it is being built if its candidate end is
            too late. Check finished episodes against a maximum (>) checks
            completed episodes that are longer than the limit. Choosing a rule
            also requires a matching action and limit source.
        maximumDurationDisposition:
          type: string
          enum:
            - not_applicable
            - flag_and_retain
            - retain_but_exclude
            - truncate_to_threshold
            - drop_row
          description: This applies only with Check finished episodes against a maximum.
            The available actions keep and count the episode, keep it out of
            headline totals, move its end to the limit and record the removed
            time, or remove its row while recording the exclusion. No action
            creates a zero-duration episode.
        maximumDurationThresholdSource:
          type: string
          enum:
            - strategy_native
            - chronicle_legacy_config
            - fixed_parameter
            - b12_adaptive_participant
          description: Each maximum rule needs a matching source. Use the episode rule's
            own maximum uses that rule's limit. Chronicle's original
            long-episode check uses the maximum app-episode length above. Check
            finished episodes against a maximum can use a fixed value below; its
            adaptive per-participant choice is unavailable until that method is
            added.
        maximumDurationThresholdNs:
          type: string
          description: Only the A fixed length (nanoseconds, below) choice uses this
            value. Enter the length in nanoseconds (billionths of a second) as a
            whole number, with no sign, decimal point, exponent, or leading
            zeros. The largest allowed value is 9223372036854775807. The number
            stays exact.
        correctDuplicateEventTimestamps:
          type: boolean
          description: When several events share a timestamp, order them by event type,
            then move their timestamps back by one-microsecond steps so they
            keep that order every time.
        deduplicateExactRows:
          type: boolean
          description: Remove raw event rows that match on participant, timestamp, app,
            and event type. If a row repeats, keep the first one. Turn this off
            to keep every row.
        dropOutOfSourceOrderEvents:
          type: boolean
          description: Remove an event when its timestamp goes backward in the original
            file order for the same participant (the rule reported by Harbach,
            De Luca and Egelman). Leave it off to keep and sort every row, as
            Chronicle normally does.
        selectedTimezone:
          type: string
          description: Choose a time zone, such as America/Chicago. Time zones found in
            your file are added to the suggestions after scanning.
        timezoneHandling:
          type: string
          enum:
            - selected-filter
            - selected-convert
            - primary-filter
            - primary-convert
          description: Choose whether rows in other time zones are removed or converted,
            and whether to use the selected zone or the file’s primary zone. By
            default, every row is converted to the selected zone, so no row is
            removed and all dates use the same clock.
        dayBoundaryAttribution:
          type: string
          enum:
            - attribute_to_start_day
            - split_at_local_midnight
          description: Count on the day it started (default) keeps a session past midnight
            as one row dated by its start day; a 23:40–00:20 session puts all 40
            minutes on the first day. Split at local midnight makes one row per
            day with that day’s start, end, duration, and date, so daily totals
            count the time in each day. Every split row keeps the same source
            events. The output time zone determines midnight, including
            daylight-saving days of 23 or 25 hours.
        useFilterFile:
          type: boolean
          description: When on, apps in your filter list are marked as filtered instead of
            being removed. Without an uploaded file, the bundled list is used.
            Off by default; turn it on only when your study protocol calls for
            it.
        filterMatchField:
          type: string
          enum:
            - app_package_name
            - application_label
          description: Package name (default) uses the package-name rules. Application
            label (exact case-sensitive match) compares the full label,
            including letter case; it does not guess a package name or match
            part of a label. Matching rows stay in the output as filtered rows
            but are left out of headline app-use totals.
        applicationLabelExclusions:
          type: array
          items:
            type: string
          description: Enter app labels to keep as filtered rows but leave out of headline
            app-use totals. Each entry must match the full label, including
            letter case; package names and partial matches are not used.
        packageExclusionPreset:
          type: string
          enum:
            - all_supplied_rows
            - honor_filter_flag
            - system_scope_only
          description: Every row in the file (default) excludes every listed app. Only
            rows whose filter flag is on follows the filter_bool value, so a 0
            does not exclude the app. Only system and system-defensive rows
            excludes 60 of the 80 apps in the bundled list, leaving carrier,
            audio, navigation, and other apps counted as usual. Excluded apps
            stay in the output as filtered rows, but their exported start, end,
            and duration are blank. Only applies when Use filter file is on.
        useAppsForcingScreenOpenFile:
          type: boolean
          description: Apps in this list count as keeping the screen on, which affects how
            screen locks and unlocks are read. Dekker et al. (2024) removed
            YouTube Vanced and Basic Daydreams from screen-time estimates for
            this reason.
        useBackgroundAppsFile:
          type: boolean
          description: Apps in this list, such as music and navigation apps, keep running
            after another app opens. Their sessions continue past a pause until
            their own Activity Stopped event. When they overlap another app, the
            time is split into foreground and background parts. Without an
            uploaded file, the bundled list is used.
        useAppCodebook:
          type: boolean
          description: Add app category information to each output row, such as Play Store
            genre, USC category, and UMich groupings. Without an uploaded
            codebook, the bundled one is used.
        includeCategoryColumn:
          type: boolean
          description: Add broad app categories such as Games, Education, and Social &
            Communication in a broad_app_category column. This is the same
            category used to color plots and combines the codebook’s source
            columns. Requires the app codebook; off by default.
        includeAppUsageEndReason:
          type: boolean
          description: "Add an app_usage_end_reason column that says what ended each app
            episode: a stop event, another app opening, the screen turning off,
            an inactivity limit, or no observed end. This helps distinguish
            observed endings from inferred ones. On by default; turn it off only
            if another tool needs fewer columns."
        enablePlotting:
          type: boolean
          description: Create one horizontal timeline chart per participant after
            processing and include the PNG files in the ZIP. Bars are colored by
            app category.
        includeFilteredAppUsageInPlots:
          type: boolean
          description: When on, the plots include bars for apps marked as filtered but
            kept in the output.
        enableActivityHeatmap:
          type: boolean
          description: Alongside the timeline, create one heat map per participant showing
            app use by hour and calendar day. Only applies when plots are on.
            Turn it off to keep just the timeline chart.
        exportPlotsAsSvg:
          type: boolean
          description: Save a scalable SVG copy of each plot, including heat maps when
            enabled, alongside the PNG files in the ZIP. SVG files stay sharp
            when enlarged and can be edited in vector tools. Off by default;
            only applies when plots are on.
        enableAggregates:
          type: boolean
          description: Create daily and weekly summaries of app and screen time, session
            counts, app changes, pickups, average and longest session, and first
            and last use. Also create per-app, per-category (when a codebook is
            loaded), and app co-use files (when overlapping use is counted). Off
            by default.
        aggregateShape:
          type: string
          enum:
            - wide
            - long
          description: Wide puts each period on one row with measures in separate columns.
            Long puts each measure for each period on its own row. Per-app,
            category, and co-use files are always long.
        aggregateTopAppsLimit:
          type: integer
          description: Set the maximum ranked apps listed per participant-day. Zero keeps
            the full ranking. A positive number keeps exactly that many apps,
            ordered by use time; package name breaks ties.
        enableParticipantAmountSummary:
          type: boolean
          description: Create one row per participant with days that have raw data, total
            app-use minutes, and average minutes per tracked day (Wenz, Keusch &
            Bach 2024). It also shows that average clamped to the 1st and 99th
            percentiles of all participants' averages in this export, with the
            cut values, and a Huber M estimate of the participant's daily values
            (Stachl et al. 2020). The measures appear side by side for analysis.
            Off by default.
        enableParquetExport:
          type: boolean
          description: Save the app-use and screen-use tables as Parquet files as well as
            CSVs. They contain the same rows and columns, are smaller, keep each
            column’s data type, and load faster in R and Python. Timestamps
            remain formatted text. Off by default.
        enableSpssExport:
          type: boolean
          description: Save the app-use and screen-use tables as SPSS/PSPP .sav files as
            well as CSVs. They contain the same rows and columns, with column
            names as variable labels, and open directly in SPSS or PSPP. Stata
            .dta files are not supported. Off by default.
        neutralizeSpreadsheetFormulas:
          type: boolean
          description: Spreadsheet programs can run CSV text beginning with =, +, -, @, a
            tab, or a carriage return as a formula. When on, these text cells in
            processing CSVs start with an apostrophe so they are treated as
            text; plain numbers are unchanged. This applies to app use, screen
            use, credited use, day coverage, compliance, notification contacts,
            the polling imitation, per-second rows, and summaries. It does not
            change literature-method downloads. The apostrophe becomes part of
            the value in R, Python, and SPSS, including Parquet and SPSS files
            made from these CSVs. Off by default, leaving values unchanged.
        enableInteractiveTimeline:
          type: boolean
          description: Show a zoomable timeline of app and screen sessions in the results.
            Colors show app categories; hovering shows details. The session data
            for this view is created only when this is on to keep large results
            smaller. Off by default.
        minimumUsageDuration:
          type: integer
          description: This is the minimum length checked by the two settings below. It is
            checked once against the original app episode before overlapping-use
            splitting or cleanup. Set it to 0 to turn off this check. A separate
            setting can apply a minimum to the later split intervals.
        minimumDurationComparator:
          type: string
          enum:
            - strict_lt
            - inclusive_le
          description: Strictly below threshold (<, default) counts only episodes shorter
            than the value. At or below threshold (≤) also counts episodes equal
            to it. The comparison uses the exact original episode length before
            overlapping-use splitting.
        minimumDurationDisposition:
          type: string
          enum:
            - chronicle_blank_keep_row
            - retain_and_credit
            - retain_but_exclude
            - drop_row
          description: Choose what happens to an episode that meets the minimum-time rule.
            Blank duration, keep row (default) keeps its start and end but
            clears duration. Keep and count keeps and counts its original time.
            Keep row, leave out of totals leaves it out of main summaries. The
            drop-row choice removes it while recording the exclusion. No choice
            creates a zero-duration episode; this is separate from the
            very-short-use label.
        filterZeroDurationSessions:
          type: boolean
          description: Remove app episodes whose original length is exactly zero.
            Duplicate events at the same millisecond can create these rows,
            especially on Fire tablets.
        intervalQualityPolicy:
          type: string
          enum:
            - none
            - culverhouse_trim_and_log
          description: "Chronicle interval cleaning (default) keeps the existing cleanup.
            Culverhouse trim-and-log leaves episode start and end rules
            unchanged: it joins same-app rows within 1 second, caps a bad-app
            row at 10 minutes and counts it, flags rows of 3 hours up to under 6
            hours long-3h, flags rows of 6 hours or more long-6h, and shortens
            rows strictly over 6 hours to 10 minutes. It marks each
            participant’s first and last day, days around gaps of at least 12
            hours, and days with a clock change as partial. Changes go in the
            existing flag column; no rows are removed."
        sessionGroupingPolicy:
          type: string
          enum:
            - none
            - church_5s
            - smartphone_wellbeing_strict_lt_5s
            - grosse_deters_10s
            - ross_15s
            - van_berkel_45s
            - zerrer_60s
            - peng_zhu_2020_participant_median
          description: Choose how app episodes are combined into sessions. No session
            grouping (default) adds no usage_session_id column; otherwise, IDs
            start at 0 for each participant. Rules compare the time from one
            episode’s end to the next start and can differ in limit, equality
            handling, and whether an app change also ends a session. Church 5 s
            is reported second-hand by van Berkel and has the least source
            support in this set. grosse Deters 10 s joins episodes within 10
            seconds. Smartphone Wellbeing < 5 s joins gaps under 5 seconds;
            exactly 5 seconds splits. Ross 15 s (+ app change) splits at 15
            seconds and also splits when the foreground app changes. App-episode
            gap ≤ 45 s joins gaps up to 45 seconds and splits longer ones; this
            is Chronicle’s grouping rule, not van Berkel’s original classifier,
            and the 45-second recommendation applied to a specific sample and
            outcome. Zerrer 60 s differs between the paper wording (at least 60
            seconds) and published code (>60 seconds); the code produced its
            results. Peng & Zhu per-participant median uses each participant’s
            own median gap from one episode’s end to the next start; equality
            splits. Turn on Record session breaks to write each sequence's
            median and gap count into its first row.
        sessionGapBasis:
          type: string
          enum:
            - previous_episode_stop_v1
            - session_running_maximum_stop_v1
          description: Only used when a session grouping rule is selected. The default
            measures from the previous episode’s end. For example, with a
            30-minute episode, a 1-minute episode nested at its start, and a
            third episode starting 20 seconds after the long one ends, the
            default measures a 28-minute-20-second gap and splits under a
            60-second rule, although the longer episode had only just ended.
            Latest end so far in the session measures from the latest end
            already in that session instead. This differs from all published
            grouping rules, so it is optional.
        sessionBoundaryScope:
          type: string
          enum:
            - participant_v1
            - participant_and_study_v1
            - participant_study_and_person_v1
          description: Only used when a session grouping rule is selected. Participant
            (default) numbers one sequence per participant. Participant + study
            keeps rows from different studies in separate sequences; Participant
            + study + person also separates different usernames. Without those
            choices, a row from another study or username can bridge a
            participant's quiet period. Because each choice changes which
            episodes are next to each other, it can change gaps, app changes,
            and per-participant medians, so sessions may split or join
            differently.
        emitSessionBreakLineage:
          type: boolean
          description: When a session grouping rule is selected, add whether each session
            opened, joined, or broke, the gap in seconds, and whether another
            app also ended it. This uses the existing any_app_usage_flags
            column. Off by default; no flag is added when off.
        customAppEngagementDuration:
          type: integer
          description: A new engagement starts when the gap since the previous app episode
            is longer than this many seconds, whether or not the app changed.
            App switching is measured separately.
        longUsageDurationThresholds:
          type: array
          items:
            type: integer
          description: Enter hours separated by commas. Each app episode at or above a
            value is flagged with the largest value it reaches (one flag per
            episode).
        longDataTimeGapThresholds:
          type: array
          items:
            type: integer
          description: Enter hours separated by commas. Each event whose gap since the
            participant's previous event is at or above a value is flagged with
            the largest value it reaches (one flag per event).
        screenSessionConstructionStrategy:
          type: string
          enum:
            - chronicle_screen_interactive_v1
            - parry_toth_2025_session_glance_v1
            - zhu_2018_unlock_lock_v1
            - unlock_to_lock_v1
            - unlock_to_off_or_lock_v1
          description: By default, Chronicle’s interactive and non-interactive screen
            events define screen sessions separately for each participant.
            Parry–Toth session/glance construction (2025) keeps the original
            order of Android event types 15–18 and 26–27, distinguishing
            sessions from locked glances. Zhu unlock/lock construction (2018)
            requires a screen-on event immediately followed by Keyguard Hidden
            in the complete participant record; sessions start at unlock and end
            at screen-off or shutdown. Unlock to keyguard lock starts at
            Keyguard Hidden and ends at Keyguard Shown. Unlock to first
            screen-off or keyguard lock ends at whichever comes first. These
            four source-based choices require an Device capability file (Study
            inputs) that matches the raw file and stop with an error if signal,
            order, completeness, or device-scope evidence is missing; they do
            not fall back to Chronicle’s rule.
        screenSessionClassificationPolicy:
          type: string
          enum:
            - none
            - phone_check_inclusive_15s
            - null_no_app_strict_gt15s_vs_app
          description: Optional labels after screen sessions are built. Phone check at or
            below 15 seconds marks sessions of 15 seconds or less as phone
            checks. No-app sessions over 15 s vs app sessions labels sessions
            with app evidence as app, and sessions without it over 15 seconds as
            null.
        screenSessionMaximumDurationMinutes:
          type: number
          description: Used with Shorten sessions over the maximum or Leave out a
            participant with any session over the maximum. Zero disables it.
        screenSessionMaximumDurationDisposition:
          type: string
          enum:
            - none
            - truncate
            - exclude_participant
          description: No screen-session cap keeps the full interval. Shorten sessions
            over the maximum shortens intervals above the limit and records the
            cut. Leave out a participant with any session over the maximum
            removes all output for participants with a completed interval above
            the limit.
        lockedScreenAudioDisposition:
          type: string
          enum:
            - include
            - exclude_from_phone_and_app_sessions
          description: By default, app activity while the screen is locked can form a
            phone or app session. Excluding it requires an event showing the
            screen was interactive and unlocked.
        screenUsageAutoLockTimeoutSeconds:
          type: integer
          description: The idle time after which the phone locks itself. A recorded
            screen-session end whose gap since the last activity matches this is
            labeled a probable auto-lock. It does not fill in missing end times.
        screenUsageAutoLockToleranceSeconds:
          type: integer
          description: Allows small clock differences near the auto-lock time when reading
            lock events.
        screenUsageManualLockMaxTailGapSeconds:
          type: integer
          description: Maximum time between the last meaningful activity and a recorded
            lock for it to count as a manual lock.
        screenUsageKeyguardNearStopSeconds:
          type: integer
          description: If the keyguard appears within this many seconds of a session stop,
            count it as part of the same lock.
        parallelProcessing:
          type: boolean
          description: When on, the app can process multiple uploaded raw files at the
            same time. This usually helps only with multiple files; one file
            still runs by itself.
        parallelMaxWorkers:
          type: integer
          description: Maximum number of files processed at once. Use 0 to let the app
            choose based on file sizes and browser capacity. Lower the number if
            the browser slows down or uses too much memory.
        sameAppInteractionTypesToStopUsageAt:
          type: array
          items:
            type: string
          description: Events in this list end the current session when they come from the
            same app.
        otherInteractionTypesToStopUsageAt:
          type: array
          items:
            type: string
          description: Events in this list end the current session when another app opens
            or the device shuts down. End of Usage Missing means an app opened
            but no close was recorded; it still ends use of the app that was
            already open.
        modelConcurrentUsage:
          type: boolean
          description: When on, an app episode lasts until its own stop event instead of
            ending when another app opens. Where episodes overlap, the most
            recently started one is primary and the others are secondary, shown
            in the usage_layer column. Off by default; output is unchanged when
            off.
        applyMinimumUsageDurationToConcurrentSubintervals:
          type: boolean
          description: Only applies when Count overlapping app use is on. The minimum is
            first checked once on the whole episode, and any blank that results
            carries through to all its pieces. When this is on, every split
            piece shorter than the minimum also gets a blank duration, even
            inside a longer episode; the rows stay. Off by default.
        interactionTypesToRemove:
          type: array
          items:
            type: string
          description: Remove output rows for the selected event types. Use this to keep
            unwanted or noisy events out of the CSV.
        interactionTypeRemovalMode:
          type: string
          enum:
            - gap_preserving
            - unconditional
          description: Keep rows that mark a long gap (default) keeps a selected row when
            it shows a gap at least as long as the smallest limit above. Remove
            all of them drops every selected row, as in the
            SmartphoneUsage_Wellbeing removal of STANDBY_BUCKET_CHANGED.
        interactionTypeRemap:
          type: array
          items:
            type: string
          description: Map event names from another data source to Chronicle event names,
            such as Activity Resumed, Activity Paused, or Activity Stopped.
            Enter one mapping as Raw value => Chronicle event name. Mappings run
            before the built-in list and can replace its entries. Empty by
            default.
        proximityIntervalSeconds:
          type: number
          description: When an Activity Stopped fallback is within this many seconds of an
            app’s return, treat it as a brief app restart rather than a real
            end; keep the session open for the next actual stop. Set to 0 to
            turn this off and restore the earlier output exactly. The 2-second
            default matches the study settings.
        addNoActivityPlaceholderDays:
          type: boolean
          description: For each participant, add one zero-duration row named
            com.placeholder.noactivity for each calendar day with raw events but
            no app-use sessions. This helps separate a genuine no-use day from a
            day with no data. The range is the participant's first through last
            day with raw events. Off by default.
        enableScreenGatedCrediting:
          type: boolean
          description: Create an extra Credited App Usage CSV that counts app time where
            screen and device-activity records support it, using the rule below.
            With the default rule, sessions on a device without usable screen
            records keep their time (up to the credited time limit), and
            sessions with no screen record can still be credited when the day
            shows enough different apps. Choose Screen on only, no fallback to
            require screen records. The main app-use output does not change. Off
            by default.
        screenGatingRule:
          type: string
          enum:
            - screen_and_liveness_v1
            - screen_witness_only
            - strict_visual_only
            - device_liveness_only
          description: Screen on and device alive (default) counts where an observed
            screen-on interval overlaps a period with recent device events, with
            the fallbacks described above when screen records are missing.
            Screen on only does not require recent events, so a lit screen
            during a long event silence can count. Screen on only, no fallback
            requires screen records and gives no credit without them. Device
            alive only counts periods with recent events without looking at the
            screen; the no-screen fallback does not apply. Only the extra
            credited-use file changes; the main app-use output does not.
        creditedSessionCapMinutes:
          type: integer
          description: Limit any one credited app session to this many minutes from its
            start. The session is shortened, not removed.
        deviceLivenessGapToleranceMinutes:
          type: integer
          description: An event silence of this many minutes or less keeps the device
            counted as active; a longer silence breaks the period. A Device
            Startup event inside a silence always breaks it because the device
            was off.
        autoLockBridgeSeconds:
          type: integer
          description: "Credited time continues across a screen-off gap shorter than this:
            a gap that short cannot be the auto-lock, so it is a screen flicker,
            not a real lock."
        bridgeScreenOffToSessionEnd:
          type: boolean
          description: When deciding whether to bridge a screen-off gap, count only the
            time through the app-session end, not until the screen turns on
            again. An off period that starts just before the app session ends
            counts through that end even if the screen stays off afterward.
            TECH/GNSM studies use this rule. Off by default.
        noWitnessMinDayApps:
          type: integer
          description: When a session has no screen-on record, count its active time only
            if that participant-day switched among at least this many different
            apps. Below that number, it earns no credited time.
        notificationProxyRule:
          type: string
          enum:
            - none
            - seen_contact_v1
            - interruption_contact_v1
            - any_notification_contact_v1
          description: Off (default) adds no notification rows. Notification Seen only,
            Notification Interruption only, or Both notification types adds
            matching rows to a separate Notification Contact CSV. Each row marks
            a moment, not a session, so it has no start, end, or duration; it
            includes the app, event, and whether it happened during use of that
            app. The main app-use output does not change.
        polledEmulationMethod:
          type: string
          enum:
            - none
            - ross_2025_sampled_gap_v1
            - cerit_2025_sample_count_v1
          description: Chronicle records each foreground change, while some studies check
            which app is on screen every few seconds. These measurements can
            differ. Off (default) adds no file. Ross et al. 2025 — sample gap
            closes a session checks the timeline at the chosen interval and ends
            a session when the next sample is at least the selected gap later or
            another app appears; it closes the last sample so it counts. Cerit
            et al. 2025 — duration from sample count multiplies the number of
            samples by the interval without subtracting endpoints. Both add a
            separate CSV marked EMULATED NOT OBSERVED because resampling loses
            detail and is not the same as collecting actual screen checks. The
            main app-use output does not change.
        polledEmulationIntervalSeconds:
          type: number
          description: "Sets how often the screen is checked for both methods: it sets the
            gap-rule sample times and the time counted for each sample in the
            sample-count method. The default 10 seconds is the foreground check
            interval reported by Ross et al. (2025). Ignored when Imitate a
            polling app tracker is off."
        polledEmulationGapSeconds:
          type: number
          description: The gap between screen checks that ends a session. The default 15
            seconds comes from Ross et al.'s (2025) released code; the authors
            call it a coding rule, not a tested behavior limit. Used only by the
            Ross sample-gap method. The sample-count method does not use it.
            Ignored when Imitate a polling app tracker is off.
        intervalExpansionMethod:
          type: string
          enum:
            - none
            - behapp_start_anchored_half_open_1s_v1
          description: Off (default) adds no file. The Behapp method starts at each app
            interval’s start, drops any fraction of a second, and adds one row
            per whole second before the end; the end is excluded. It does not
            change the main app-use output and uses a different timing rule from
            the polling imitation.
        enableStudyWindowFilter:
          type: boolean
          description: Keep sessions whose local calendar date falls within the
            participant's study dates, including the start and end dates, and
            leave out any break periods listed for that participant.
            Participants with no matching row in the study-dates file are not
            filtered. Requires the study-dates file.
        enablePersonAttribution:
          type: boolean
          description: For shared devices, use the device-sharing table (exact participant
            match only) and optional usage-survey answers to assign app sessions
            to people. A session assigned to someone other than the target stays
            in the app output as Non-Target Participant App Usage and is left
            out of the target's app-use totals. The screen session output does
            not change. Requires the device-sharing file.
        enableComplianceScoring:
          type: boolean
          description: "Create a daily report of the share of minutes whose user is known:
            known / (known + unknown). Devices that are not shared are 100%.
            Days at 100% with zero use stay in the report and are flagged."
        complianceThresholdPercent:
          type: number
          description: A day is valid when that share is at least this percentage. The
            default is 70%, a common study rule.
        enableDayCoverage:
          type: boolean
          description: For each participant, report days with app use, events but no use,
            and no data (device silent) across the loaded study window. Error if
            any day in the window would be missing.
    DiscoverTimezonesRequest:
      type: object
      required:
        - csvText
      properties:
        csvText:
          type: string
        runtime:
          $ref: "#/components/schemas/BrowserProcessingRuntime"
    DiscoverTimezonesResponse:
      type: object
      required:
        - timezones
      properties:
        timezones:
          type: array
          items:
            type: string
    ProcessRawCsvRequest:
      type: object
      required:
        - inputFileName
        - csvText
        - options
      properties:
        inputFileName:
          type: string
        csvText:
          type: string
        options:
          $ref: "#/components/schemas/BrowserProcessingOptions"
        supportFiles:
          $ref: "#/components/schemas/BrowserSupportFiles"
        runtime:
          $ref: "#/components/schemas/BrowserProcessingRuntime"
    ProcessedOutputFileResult:
      type: object
      required:
        - kind
        - outputFileName
        - csv
        - rowCount
      properties:
        kind:
          type: string
          enum:
            - app
            - screen
            - plot
            - aggregate
            - parquet
            - spss
            - lineage
        outputFileName:
          type: string
        csv:
          type: string
        rowCount:
          type: integer
    ProcessedFileResult:
      type: object
      required:
        - inputFileName
        - outputs
        - originalRowCount
        - processedRowCount
        - availableTimezones
        - timezone
        - appRowCount
        - screenRowCount
        - timezoneAction
        - rowsBeforeTimezoneHandling
        - rowsAfterTimezoneHandling
        - rowsRemovedByTimezone
        - duplicateTimestampsCorrected
      properties:
        inputFileName:
          type: string
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ProcessedOutputFileResult"
        originalRowCount:
          type: integer
        processedRowCount:
          type: integer
        availableTimezones:
          type: array
          items:
            type: string
        timezone:
          type: string
        appRowCount:
          type: integer
        screenRowCount:
          type: integer
        timezoneAction:
          type: string
          enum:
            - none
            - filtered_to_selected
            - converted_to_selected
            - filtered_to_primary
            - converted_to_primary
          description: What the pipeline did with rows whose timezones did not match the
            selected/primary one.
        rowsBeforeTimezoneHandling:
          type: integer
        rowsAfterTimezoneHandling:
          type: integer
        rowsRemovedByTimezone:
          type: integer
        duplicateTimestampsCorrected:
          type: integer
