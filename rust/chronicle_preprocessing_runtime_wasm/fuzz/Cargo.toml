[package]
name = "chronicle-runtime-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
chronicle_preprocessing_runtime_wasm = { path = ".." }
csv = "1.3"
hex = "0.4"
libfuzzer-sys = "0.4"
serde_json = "1.0"
sha2 = "0.11"

[[bin]]
name = "raw_file_inspection"
path = "fuzz_targets/raw_file_inspection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_workspace"
path = "fuzz_targets/structured_workspace.rs"
test = false
doc = false
bench = false
