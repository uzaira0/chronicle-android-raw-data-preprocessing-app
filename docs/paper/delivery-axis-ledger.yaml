  - id: "delivery:B12"
    ordinal: 12
    key: "adaptive_participant_threshold"
    label: "Adaptive participant threshold"
    requirement: "Support a deterministic adaptive participant threshold with an inspectable derivation."
    baseline_status: "pending"
    resolution_note: >-
      The consolidated corpus contains no per-participant duration-cap derivation, so the
      cap-scope adaptive source (maximum_duration_threshold_source = b12_adaptive_participant)
      remains a standing typed refusal (adaptive_maximum_threshold_provider_unavailable), the
      same discipline as delivery:B13. The literature's individualized participant threshold is
      a session-grouping rule, and it landed faithfully at the sessionization step:
      session_grouping_policy = peng_zhu_2020_participant_median (Peng & Zhu 2020,
      10.1093/jcmc/zmz029, implemented verbatim — per-participant median of the participant's
      own previous-stop-to-next-start intervals, strict < joins, >= splits, integer-exact in
      doubled nanoseconds). The derivation is inspectable: with emit_session_break_lineage the
      open-session flag carries "MEDIAN <seconds> S N <interval-count>", so each participant's
      derived threshold is reconstructible from the export. An earlier invented derivation
      (a Tukey fence and a median multiplier attributed to no paper) was removed without trace
      before this resolution landed.
    campaign_implementation:
      status: "accepted_on_private_feature_branch"
      option_keys:
        - "session_grouping_policy"
      accepted_values:
        - "peng_zhu_2020_participant_median"
      conditional_refusal:
        crossing: "maximum_duration_threshold_source = b12_adaptive_participant (any policy)"
        reason: "adaptive_maximum_threshold_provider_unavailable"
      private_preview_pr: "uzaira0/chronicle-android-preprocessing-app-preview#20 (squash-merged 2026-08-24 as d5fee649a)"
      gate_evidence:
        - "make dependency-evidence and the complete make all with chromium+firefox e2e exit 0 on the merged tree (2026-08-24; faithful-depev / faithful-makeall logs in /home/opt/chronicle_campaign_backup): kernel 535+5, runtime 112, web 756/756, e2e 42/42, published figures 17/17 and 3/3."
        - "Independent code review (before merge) verified the median math and found one real projection bug (summary toggle with app usage off aborted the run); fixed and pinned by a unit test before the final gate."
        - "With session_grouping_policy at any fixed arm the six existing arms are byte-identical under the doubled comparison (fixed_arms_keep_their_exact_boundaries_under_the_doubled_comparison)."
      pending:
        - "preview_deployment"
        - "production_canary"

