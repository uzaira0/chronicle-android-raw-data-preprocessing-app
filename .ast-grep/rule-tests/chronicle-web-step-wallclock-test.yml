# Meta-test (run with: sg test). The `invalid` snippets are the impurity the
# rule exists to block — a clock read inside a step/stage body.
id: chronicle-web-step-wallclock
valid:
  - "const stamp = ctx.runtime.datetimeOfPreprocessing;"
  - "const started = timing.startedAt;"
  - "const parsed = parseChronicleTimestamp(row.event_timestamp);"
  - "const day = new Date(t).toISOString().slice(0, 10);"
invalid:
  - "const now = Date.now();"
  - "const stamp = new Date();"
  - "const t0 = performance.now();"
