[package]
name = "chronicle_semantic_index_wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    '-Oz',
    '--enable-simd',
    '--enable-bulk-memory',
    '--enable-nontrapping-float-to-int',
    '--enable-mutable-globals',
    '--enable-sign-ext',
    '--enable-reference-types',
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
# Oxigraph 0.5.9 pins quick-xml 0.37, which is affected by
# RUSTSEC-2026-0194/0195. Pin the upstream post-fix commit until the next
# crates.io release; the immutable revision already uses quick-xml 0.41.
oxigraph = { git = "https://github.com/oxigraph/oxigraph.git", rev = "d14ac0b5c4fa67b15d03af945d8669e3497c25a9", default-features = false, features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[build-dependencies]
serde_json = "1.0"
