[build-system]
requires = ["setuptools>=61.0", "setuptools-rust>=1.12.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-android-preprocessor"
version = "1.0.0"
description = "Chronicle Android raw data preprocessing and plotting library"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "Chronicle Android Preprocessing Team"}
]
keywords = ["chronicle", "android", "data-preprocessing", "mobile-research", "screen-time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.17.0,<2.0.0",
    "pyarrow>=15.0.0",
    "pytz>=2025.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/uzaira0/chronicle-android-raw-data-preprocessing-app"
Repository = "https://github.com/uzaira0/chronicle-android-raw-data-preprocessing-app"
"Bug Tracker" = "https://github.com/uzaira0/chronicle-android-raw-data-preprocessing-app/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-benchmark>=5.1.0",
    "hypothesis>=6.152.0",
    "syrupy>=4.0.0",
    "mutmut>=3.5.0",
    "vulture>=2.14",
    "pip-audit>=2.7.0",
    "radon>=6.0.1",
    "pip-licenses>=5.0.0",
]
all = [
    "chronicle-android-preprocessor[dev]",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "chronicle_preprocessing_app",
    "chronicle_preprocessing_app.core",
    "chronicle_preprocessing_app.core.preprocessing",
    "chronicle_preprocessing_app.core.preprocessing.algorithms",
    "chronicle_preprocessing_app.core.plotting",
    "chronicle_preprocessing_app.cli",
    "chronicle_preprocessing_app.config",
    "chronicle_preprocessing_app.utils",
]

[tool.setuptools.package-data]
"*" = ["*.xlsx"]
"chronicle_preprocessing_app" = ["data/*.csv", "data/*.xlsx", "py.typed"]

[[tool.setuptools-rust.ext-modules]]
target = "chronicle_preprocessing_app._rust_app_usage_matcher"
path = "rust/chronicle_app_usage_matcher/Cargo.toml"
binding = "PyO3"
optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--snapshot-warn-unused"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]

[tool.basedpyright]
include = ["src/chronicle_preprocessing_app"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
