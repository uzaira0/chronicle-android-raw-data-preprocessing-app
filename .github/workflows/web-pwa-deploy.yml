name: Web PWA

# Bare-minimum deploy to GitHub Pages. No tests run here — all testing
# (typecheck, unit, contract, parity, e2e, security) is local via `make all`.
# Only runs on push to main (and manual dispatch); does not run on pull requests.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build web app from the reviewed Rust sources
        working-directory: web
        run: npm run build

      - name: Prepare GitHub Pages artifact
        working-directory: web
        run: npm run prepare:github-pages

      # Bundle-budget + artifact-shape gate: without this step the check
      # scripts exist but no workflow runs them (a dead gate).
      - name: Check GitHub Pages artifact (bundle budget)
        working-directory: web
        run: npm run check:github-pages-artifact

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/.github-pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
