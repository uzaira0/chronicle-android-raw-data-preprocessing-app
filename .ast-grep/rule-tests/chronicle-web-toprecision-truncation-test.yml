# Meta-test for a parity bug-shape rule (run with: sg test).
# The `invalid` snippets resurrect a FIXED parity bug — if the rule stops
# matching them, the guard itself has broken.
id: chronicle-web-toprecision-truncation
valid:
  - "const text = value.toPrecision(17).toString();"
  - "const text = value.toExponential();"
invalid:
  - "const text = Number.parseFloat(value.toPrecision(15)).toString();"
  - "const text = value.toPrecision(9);"