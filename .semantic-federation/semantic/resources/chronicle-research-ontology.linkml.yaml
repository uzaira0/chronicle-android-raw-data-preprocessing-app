  compliance_threshold_percent: {description: "The percent a day must reach to count as valid. Study-specific; the product default is 70.", range: float}
  meets_compliance_threshold: {description: "compliance_percent >= compliance_threshold_percent. The engine's is_valid column, computed over imputed 100.0 values exactly as over measured ones.", range: boolean}
  expected_device_count: {description: "Enrolled device count for the participant, joined from the enrolled-devices support file; blank when the participant is absent from it. Reported alongside the measure, not used in it.", range: integer}

  day_coverage_status: {description: "Observability status for this participant-day.", range: DayCoverageStatus}

  assesses_interval: {description: The stream window assessed., range: UsageInterval}
  expected_available: {description: Whether data was expected to be available (needs a heartbeat/expectation to assert NoData)., range: boolean}
  actually_available: {description: Whether any data was actually present., range: boolean}
  availability_threshold: {description: Coverage threshold applied., range: float}
  coverage_cause: {description: Best-supported cause., range: CoverageCause}
  policy_treatment: {description: How the measurement policy treats this interval (e.g. pass / na / exclude)., range: string}

  attribution_status: {description: Required attribution status., range: AttributionStatus, required: true}
  attributed_person: {description: "The actual person, attached only when known.", range: string}
  on_shared_device: {description: Whether the device is shared., range: boolean}

  plan_id: {description: Plan identifier., range: string, identifier: true}
  operations: {description: Semantic operations in the workflow., range: OperationDefinition, multivalued: true, inlined_as_list: true}
  queries: {description: Physical queries in the workflow., range: QueryDefinition, multivalued: true, inlined_as_list: true}
  operation_id: {description: Stable semantic operation identifier., range: string, identifier: true}
  verb: {description: Action the operation performs., range: string}
  engine: {description: Named algorithm or engine the operation realizes., range: string}
  operation_role: {description: Semantic responsibility of the operation., range: string}
  epistemic_role:
    description: Whether the operation observes, infers, applies policy, or presents.
    range: string
  consumes: {description: Channels or inputs the operation reads., range: string, multivalued: true}
  produces: {description: Channels or outputs the operation produces., range: string, multivalued: true}
  depends_on: {description: Operations that must precede this one., range: string, multivalued: true}
  configuration_dependencies: {description: Direct configuration fields read by this operation., range: string, multivalued: true}
  data_effects:
    description: Declared effects such as preserve, drop, split, classify, or encode.
    range: string
    multivalued: true
  is_fatal: {description: Whether a failure fails the whole workflow., range: boolean}
  part_of_operation:
    description: >-
      The coarser semantic operation this operation is a proper part of.
      Referenced by operation_id, not inlined.
    range: OperationDefinition
    slot_uri: dcterms:isPartOf
  sequence_encoding_rule:
    description: Closed encoding rule applied to every ordered occurrence within each declared partition.
    range: SequenceEncodingRuleId
  sequence_scope_operation_ids:
    description: Upstream operations defining the partitions at which sequence history resets; not a global history or an invented raw pairing algorithm.
    range: OperationDefinition
    multivalued: true
  sequence_identity_setting_ids:
    description: Profile-local source assertions identifying what is compared with earlier occurrences within a partition; undisclosed raw comparison fields remain unknown.
    range: MethodSettingAssertion
    multivalued: true
  sequence_first_symbol_setting_id:
    description: Profile-local source assertion of the literal symbol emitted for a first occurrence in the partition.
    range: MethodSettingAssertion
  sequence_repeat_symbol_setting_id:
    description: Profile-local source assertion of the literal symbol emitted for an identity previously encountered in the partition.
    range: MethodSettingAssertion
  group_scope_operation_ids:
    description: >-
      Upstream operations defining enclosing partitions for a group-to-subset rule;
      may be transitive rather than direct dependencies. Does not establish exact
      group construction, ordering, ties, row lineage or execution. Source assertions
      remain linked through configuration_dependencies.
    range: OperationDefinition
    multivalued: true
  grouping_basis:
    description: Whether groups are declared or constructed by field equality or ordered raw string concatenation.
    range: GroupedRecordGroupingBasisId
  equality_key_setting_ids:
    description: Profile-local source field assertions compared for equality inside the enclosing partition.
    range: MethodSettingAssertion
    multivalued: true
  concatenated_key_setting_ids:
    description: >-
      Ordered profile-local source field assertions concatenated without separator
      when grouping_basis is raw_string_concatenation. This is a sequence, not a
      conjunctive equality-field set; repeated operands remain meaningful.
    range: MethodSettingAssertion
    multivalued: true
    list_elements_ordered: true
    list_elements_unique: false
  empty_if_absent_key_setting_ids:
    description: >-
      Subset of concatenated key operands whose absent fields contribute an empty
      string. Does not replace explicit null or coerce a non-string value.
    range: MethodSettingAssertion
    multivalued: true
  selection_rule:
    description: Source-declared group member disposition, independent of the unrecovered ordering or marker implementation.
    range: GroupedRecordSelectionRuleId
  required_event_payload_roles:
    description: >-
      Payloads required together within each interaction-event record produced by
      this operation. These are event composition, not unrelated output channels
      or literal serialized field names. Does not establish instance identities.
    range: InteractionEventPayloadRoleId
    multivalued: true
  optional_event_payload_roles:
    description: Payloads that may be absent from the produced interaction-event record, disjoint from its required payloads.
    range: InteractionEventPayloadRoleId
    multivalued: true
  event_payload_association:
    description: Direction and source-declared association of payloads within one interaction event; no undisclosed temporal predicate is implied.
    range: InteractionEventPayloadAssociationId
  missing_gesture_marks_incomplete:
    description: Whether absence of gesture metadata marks the event incomplete, independently of the captured screenshot and hierarchy.
    range: boolean
  gesture_presence_implies_correctness:
    description: >-
      Whether gesture presence alone establishes correctness. False means presence
      is insufficient evidence, not that every gesture is wrong. Completeness and
      correctness remain independent; no particular instance is assessed here.
    range: boolean
