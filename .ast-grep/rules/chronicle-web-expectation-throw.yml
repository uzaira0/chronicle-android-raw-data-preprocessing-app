# Warn-only contract pin: expectations DESCRIBE, they never DECIDE (doc 13).
# An expectation that throws would abort the step it annotates, turning a
# descriptive check into a behavior change. evaluateStepExpectation converts
# thrown checks into violated warn results as a runtime backstop; this rule
# keeps throw statements out of expectation declarations statically.
# Meta-test: .ast-grep/rule-tests/chronicle-web-expectation-throw-test.yml
id: chronicle-web-expectation-throw
language: typescript
message: >-
  throw inside an expectation. Expectations are warn-only provenance — return
  { ok: false, actual, message } instead of throwing; a throw here would turn
  a descriptive check into a behavior change.
severity: error
files:
  - web/src/**/*.ts
rule:
  any:
    - kind: throw_statement
      inside:
        stopBy: end
        kind: pair
        has:
          field: key
          regex: ^expectations$
    - kind: throw_statement
      inside:
        stopBy: end
        kind: method_definition
        has:
          field: name
          regex: ^check$
