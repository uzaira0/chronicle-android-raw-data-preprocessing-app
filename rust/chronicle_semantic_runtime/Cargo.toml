[package]
name = "chronicle_semantic_runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dependencies]
ciborium = "0.2"
hex = "0.4"
petgraph = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_jcs = "0.2"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
wasm-bindgen = { version = "0.2", optional = true }

[build-dependencies]
hex = "0.4"
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.9"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
