[package]
name = "chronicle_incremental_query_spike"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
chronicle_chrono_kernel_wasm = { path = "../chronicle_chrono_kernel_wasm" }
chronicle_preprocessing_runtime_wasm = { path = "../chronicle_preprocessing_runtime_wasm" }
chronicle_preprocessing_semantic_adapter = { path = "../chronicle_preprocessing_semantic_adapter" }
salsa = { version = "=0.28.1", default-features = false, features = ["macros", "persistence"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
