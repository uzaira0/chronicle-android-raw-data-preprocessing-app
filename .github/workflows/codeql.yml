name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  # actions: read lets the CodeQL action read its own workflow run; private
  # repos deny that by default and the job fails after a clean analysis.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # wasm-bindgen emits the pkg/ glue; it is regenerated by
          # `npm run build:wasm`, so quality findings there are not actionable.
          config: |
            paths-ignore:
              - web/src/wasm/**/pkg/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          # Private repos without GitHub Code Security reject the upload; the
          # analysis still runs there, the results just are not published.
          upload: ${{ github.event.repository.private == true && 'never' || 'always' }}
