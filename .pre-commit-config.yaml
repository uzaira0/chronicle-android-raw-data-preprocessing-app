repos:
  # File hygiene — fast, commit stage
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The kernel output-contract expectations are byte-exact copies of what
      # the pipeline emits; rewriting their whitespace would make the contract
      # test assert bytes the product never produces.
      #
      # The same rule covers two more generated trees, added 2026-08-08 after
      # they were observed in a rewrite loop with their own generators:
      #   web/src/lib/pipelineGraph/golden/expected/  — the pipeline writes these
      #     CSVs with no terminal newline; end-of-file-fixer added one, so every
      #     regeneration re-dirtied all ten files.
      #   web/schema/generated/                        — the LinkML generators emit
      #     a terminal blank line; end-of-file-fixer stripped it, with the same
      #     result in the opposite direction.
      # Neither drift was a content change. A generator owns the byte format of
      # its own output; a hygiene hook must not arbitrate that, or `git status`
      # reports drift forever and real drift stops being visible.
      - id: trailing-whitespace
        exclude: >-
          \.md$|^rust/chronicle_chrono_kernel_wasm/tests/golden/|^web/src/lib/pipelineGraph/golden/expected/|^web/schema/generated/
      - id: end-of-file-fixer
        exclude: >-
          web/src/wasm/|^rust/chronicle_chrono_kernel_wasm/tests/golden/|^web/src/lib/pipelineGraph/golden/expected/|^web/schema/generated/
      - id: check-yaml
        exclude: '\.ast-grep/'
      - id: check-toml
      # The literature corpus ledgers and generated component registries are
      # legitimate multi-megabyte data artifacts, so the ceiling has to clear
      # the largest of them (corpus-openalex-metadata.jsonl, ~19 MB).
      - id: check-added-large-files
        args: [--maxkb=25000]
        exclude: 'web/src/wasm/'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.csv$'

  # Rust formatting — fast, commit stage
  - repo: local
    hooks:
      - id: cargo-fmt-matcher
        name: cargo fmt (matcher)
        entry: cargo fmt --manifest-path rust/chronicle_app_usage_matcher/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false

  # Code complexity ceilings — commit stage (prevent regressions)
  - repo: local
    hooks:
      - id: web-complexity
        name: Web/TS cyclomatic complexity (ESLint, ceiling 137)
        language: script
        entry: scripts/check-web-complexity.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^web/src/

  # Slower checks — push stage only
  - repo: local
    hooks:
      - id: cargo-clippy-matcher
        name: cargo clippy (matcher)
        entry: cargo clippy --manifest-path rust/chronicle_app_usage_matcher/Cargo.toml --no-default-features -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: tsc
        name: tsc (web)
        entry: npm run --prefix web typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: license-compliance
        name: License compliance (npm + Rust)
        language: script
        entry: scripts/check-licenses.sh
        pass_filenames: false
        stages: [pre-push]

      - id: run-fuzz-sanity
        name: Fuzz sanity — matcher + runtime ingestion targets (10s each)
        language: script
        entry: scripts/run-fuzz-sanity.sh
        stages: [pre-push]
        pass_filenames: false
        files: ^(rust/chronicle_app_usage_matcher/|rust/chronicle_preprocessing_runtime_wasm/fuzz/|scripts/run-fuzz-sanity\.sh$)

      - id: e2e-all-browsers
        name: E2E smoke — all browsers
        language: script
        entry: scripts/run-e2e-all-browsers.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: visual-regression
        name: Visual regression (chromium)
        language: script
        entry: scripts/run-visual-regression.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: web-coverage
        name: Web/TS test coverage (vitest thresholds)
        language: script
        entry: scripts/check-web-critical-coverage.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/src/

      - id: lighthouse
        name: Lighthouse Core Web Vitals (local)
        language: script
        entry: scripts/check-lighthouse.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/

      - id: dependency-audit
        name: Dependency vulnerability audit (npm + Rust)
        language: script
        entry: scripts/check-dependencies.sh
        pass_filenames: false
        stages: [pre-push]

      - id: semgrep-security
        name: Semgrep — chronicle security rules
        language: script
        entry: scripts/check-semgrep.sh
        pass_filenames: false
        stages: [pre-push]
        files: ^web/src/

  # Dead code detection — commit stage (fast)
  - repo: local
    hooks:
      - id: knip
        name: Web/TS dead code (knip)
        language: script
        entry: scripts/check-knip.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^web/src/

  # Contract drift detection — push stage
  - repo: local
    hooks:
      - id: contract-check
        name: Generated contract artifacts in sync
        language: script
        entry: scripts/check-contract.sh
        pass_filenames: false
        stages: [pre-push]
        files: |
          (?x)^(
            web/schema/|
            web/src/lib/generatedContract\.ts|
            web/src/lib/types\.ts
          )
  - repo: local
    hooks:
    - id: no-ai-attribution
      name: no AI/agent attribution in the commit message
      entry: co-authored-by:[^\n]*(claude|anthropic|gpt|copilot|cursor)|@anthropic\.com|🤖
        generated with|generated with \[claude|generated by claude|claude-session:|claude\.ai/code|assisted-by:[^\n]*(claude|chatgpt|copilot)
      language: pygrep
      args:
      - -i
      stages:
      - commit-msg
