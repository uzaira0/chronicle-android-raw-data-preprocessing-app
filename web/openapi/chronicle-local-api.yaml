openapi: 3.1.0
info:
  title: Chronicle Local Processing Contract
  version: 1.0.0
  description: Boundary contract for the local-only browser preprocessing surface.
    The canonical source-of-truth model lives in
    `web/schema/chronicle-local-contract.linkml.yaml`; this OpenAPI document is
    generated from that same contract.
servers:
  - url: http://local.worker.invalid
paths:
  /discover-timezones:
    post:
      operationId: discoverTimezones
      summary: Discover distinct timezone values from a raw Chronicle CSV payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverTimezonesRequest"
      responses:
        "200":
          description: Distinct timezone values found in the raw file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverTimezonesResponse"
  /process-raw-csv:
    post:
      operationId: processRawCsv
      summary: Process a raw Chronicle CSV file locally and return app and/or screen
        outputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRawCsvRequest"
      responses:
        "200":
          description: Preprocessing completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessedFileResult"
components:
  schemas:
    BrowserSupportFile:
      type: object
      required:
        - name
        - bytesBase64
      properties:
        name:
          type: string
        bytesBase64:
          type: string
          description: Base64-encoded file contents.
    BrowserSupportFiles:
      type: object
      properties:
        filterFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        appsForcingScreenOpenFile:
          $ref: "#/components/schemas/BrowserSupportFile"
        appCodebookFile:
          $ref: "#/components/schemas/BrowserSupportFile"
    BrowserProcessingRuntime:
      type: object
      properties:
        datetimeOfPreprocessing:
          type: string
          description: Internal/test-only fixed preprocessing timestamp used to make
            output stamping deterministic across runtimes. This is not intended
            as an end-user option.
      description: Internal/test-only runtime metadata that should not be surfaced as
        end-user options.
    BrowserProcessingOptions:
      type: object
      required:
        - studyName
        - processAppUsage
        - processScreenUsage
        - allowStopEventReuse
        - useActivityStoppedAsFallback
        - applyThresholdToFallback
        - longDurationThresholdHours
        - correctDuplicateEventTimestamps
        - timezoneHandling
        - useFilterFile
        - useAppsForcingScreenOpenFile
        - useAppCodebook
        - enablePlotting
        - includeFilteredAppUsageInPlots
        - minimumUsageDuration
        - filterZeroDurationSessions
        - customAppEngagementDuration
        - longUsageDurationThresholds
        - longDataTimeGapThresholds
        - screenUsageAutoLockTimeoutSeconds
        - screenUsageAutoLockToleranceSeconds
        - screenUsageManualLockMaxTailGapSeconds
        - screenUsageKeyguardNearStopSeconds
        - parallelProcessing
        - sameAppInteractionTypesToStopUsageAt
        - otherInteractionTypesToStopUsageAt
        - interactionTypesToRemove
      properties:
        studyName:
          type: string
          description: Your label for this study. Written into the `study_name` column of
            every output row. This is your own naming, not the `study_id` column
            from the raw data — that is preserved unchanged.
        processAppUsage:
          type: boolean
          description: Run the app-usage algorithm and include the app-usage CSV in the
            output ZIP. Each session spans from an Activity Resumed to its
            matching stop event.
        processScreenUsage:
          type: boolean
          description: Derive screen-usage sessions and include the screen-usage CSV in
            the output ZIP. Sessions are inferred from Screen Interactive /
            Screen Non-Interactive events.
        allowStopEventReuse:
          type: boolean
          description: Lets a single stop event close multiple overlapping sessions. Off
            by default — stop events are consumed once.
        useActivityStoppedAsFallback:
          type: boolean
          description: If a session has no explicit stop, fall back to the next Activity
            Stopped event for the same app. Helps with noisy traces.
        applyThresholdToFallback:
          type: boolean
          description: When the fallback path is used and the implied session is longer
            than the max threshold above, treat it as a missing-end-of-usage
            instead of a real session.
        longDurationThresholdHours:
          type: number
          description: Sessions longer than this many hours are flagged as suspiciously
            long, which may indicate an instrumentation gap rather than real
            use.
        correctDuplicateEventTimestamps:
          type: boolean
          description: When two events share the same timestamp, nudge the second one
            forward by microseconds so ordering is preserved deterministically.
        selectedTimezone:
          type: string
          description: Pick from the typical IANA names (e.g. America/Chicago). When
            discovery runs, found timezones from your file are added to the
            suggestions.
        timezoneHandling:
          type: string
          enum:
            - selected-filter
            - selected-convert
            - primary-filter
            - primary-convert
          description: Decides what happens to rows with timezones that differ from the
            selected one — keep only the matching rows, convert mixed rows to a
            common zone, or anchor on the file's primary zone.
        useFilterFile:
          type: boolean
          description: If on, the pipeline labels apps in your filter list as filtered
            (instead of dropping them). Without an uploaded file the app falls
            back to the bundled default.
        useAppsForcingScreenOpenFile:
          type: boolean
          description: Apps in this list are treated as ones that force the screen to stay
            on during screen-usage derivation, which influences how
            locks/unlocks are interpreted.
        useAppCodebook:
          type: boolean
          description: Enriches each output row with category metadata from the codebook
            (Play Store genre, USC category, UMich classifications, etc.).
            Without an uploaded codebook the bundled default is used.
        enablePlotting:
          type: boolean
          description: After preprocessing, renders one horizontal-bar timeline chart per
            participant and includes the PNGs in the output ZIP. Each bar is
            coloured by app category.
        includeFilteredAppUsageInPlots:
          type: boolean
          description: When on, bars for apps that were filtered (but retained in the
            output) are drawn alongside normal app-usage bars.
        minimumUsageDuration:
          type: integer
          description: Sessions shorter than this threshold have their duration_seconds
            and duration_minutes set to null in the output. The session row is
            retained. Set to 0 to disable.
        filterZeroDurationSessions:
          type: boolean
          description: Removes app-usage session rows whose computed duration is exactly
            zero or negative. These arise from duplicate events at the same
            millisecond, common on Fire tablets.
        customAppEngagementDuration:
          type: integer
          description: Window in seconds within which two consecutive activities on the
            same app count as continued engagement. Affects how first new
            engagement is detected.
        longUsageDurationThresholds:
          type: array
          items:
            type: integer
          description: Comma-separated hour values. For each value the pipeline emits a
            column flagging sessions whose duration exceeds it.
        longDataTimeGapThresholds:
          type: array
          items:
            type: integer
          description: Comma-separated hour values. For each value the pipeline emits a
            column flagging time gaps between events that exceed it.
        screenUsageAutoLockTimeoutSeconds:
          type: integer
          description: Idle period after which the screen is assumed to have auto-locked.
            Used to infer screen-off time when an explicit lock is missing.
        screenUsageAutoLockToleranceSeconds:
          type: integer
          description: Slack window around the auto-lock timeout to absorb small clock
            skews when classifying lock events.
        screenUsageManualLockMaxTailGapSeconds:
          type: integer
          description: Maximum allowed gap between the last meaningful activity and an
            explicit lock event for the lock to count as manual.
        screenUsageKeyguardNearStopSeconds:
          type: integer
          description: If the keyguard appears within this many seconds of a session stop,
            treat it as part of the same lock event.
        parallelProcessing:
          type: boolean
          description: When this is on, the app can process more than one uploaded raw
            file at the same time. It usually helps only when you upload
            multiple files; one file still runs by itself.
        parallelMaxWorkers:
          type: integer
          description: The maximum number of files the app may process at the same time.
            Use 0 to let the app choose a safe number based on file sizes and
            browser capacity. Lower it if the browser becomes slow or
            memory-heavy.
        sameAppInteractionTypesToStopUsageAt:
          type: array
          items:
            type: string
          description: Interaction types that, when seen for the same app as the current
            session, end that session.
        otherInteractionTypesToStopUsageAt:
          type: array
          items:
            type: string
          description: Interaction types from any other source that close the current
            session — e.g. a different app coming to the foreground or the
            device shutting down.
        modelConcurrentUsage:
          type: boolean
          description: When enabled, an app session runs to its own stop event instead of
            ending when another app is foregrounded. Overlapping sessions are
            split into a primary (sole-foreground) layer and a secondary
            (running-underneath / PiP) layer, reported via the usage_layer
            column. Default off; output is unchanged when off.
        interactionTypesToRemove:
          type: array
          items:
            type: string
          description: Rows of these types are dropped from the final output. Useful for
            stripping noisy events you don't want surfaced in the CSV.
    DiscoverTimezonesRequest:
      type: object
      required:
        - csvText
      properties:
        csvText:
          type: string
        runtime:
          $ref: "#/components/schemas/BrowserProcessingRuntime"
    DiscoverTimezonesResponse:
      type: object
      required:
        - timezones
      properties:
        timezones:
          type: array
          items:
            type: string
    ProcessRawCsvRequest:
      type: object
      required:
        - inputFileName
        - csvText
        - options
      properties:
        inputFileName:
          type: string
        csvText:
          type: string
        options:
          $ref: "#/components/schemas/BrowserProcessingOptions"
        supportFiles:
          $ref: "#/components/schemas/BrowserSupportFiles"
        runtime:
          $ref: "#/components/schemas/BrowserProcessingRuntime"
    ProcessedOutputFileResult:
      type: object
      required:
        - kind
        - outputFileName
        - csv
        - rowCount
      properties:
        kind:
          type: string
          enum:
            - app
            - screen
            - plot
        outputFileName:
          type: string
        csv:
          type: string
        rowCount:
          type: integer
    ProcessedFileResult:
      type: object
      required:
        - inputFileName
        - outputs
        - originalRowCount
        - processedRowCount
        - availableTimezones
        - timezone
        - appRowCount
        - screenRowCount
        - timezoneAction
        - rowsBeforeTimezoneHandling
        - rowsAfterTimezoneHandling
        - rowsRemovedByTimezone
        - duplicateTimestampsCorrected
      properties:
        inputFileName:
          type: string
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ProcessedOutputFileResult"
        originalRowCount:
          type: integer
        processedRowCount:
          type: integer
        availableTimezones:
          type: array
          items:
            type: string
        timezone:
          type: string
        appRowCount:
          type: integer
        screenRowCount:
          type: integer
        timezoneAction:
          type: string
          enum:
            - none
            - filtered_to_selected
            - converted_to_selected
            - filtered_to_primary
            - converted_to_primary
          description: What the pipeline did with rows whose timezones did not match the
            selected/primary one.
        rowsBeforeTimezoneHandling:
          type: integer
        rowsAfterTimezoneHandling:
          type: integer
        rowsRemovedByTimezone:
          type: integer
        duplicateTimestampsCorrected:
          type: integer
