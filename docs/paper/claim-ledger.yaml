  - id: "claim:C04_HOURLY_PLACEMENT"
    display_name: "Sub-hour placement from hourly aggregates"
    aliases:
      - "C4"
      - "hourly-placement claim"
    canonical_statement: >-
      When only hourly totals are observed, a specified placement procedure can be evaluated below
      the hour using displacement and downstream-statistic preservation, provided its implementation,
      ground-truth inputs, estimands, and uncertainty are independently reproducible.
    status:
      lifecycle: "EXTERNAL_REPORT"
      validation: "UNVALIDATED"
      empirical: "EXTERNALLY_REPORTED_NOT_REPRODUCED"
      rationale: >-
        The current dossier records user-reported results from an external consumer repository that
        was not inspected in this project. No code, data, or output bundle has been independently
        rerun here.
    scope:
      included:
        - "The specifically reported TECH/GNSM placement analysis and its named estimands."
        - "Conditional use as a thesis chapter or companion analysis only after independent reproduction."
      excluded:
        - "All hourly vendor aggregates, populations, placement algorithms, or downstream tasks in general."
        - "Any result whose underlying data or implementation remains unavailable for the declared audit."
    manuscript_role:
      paper: "Omit from Results unless independently reproduced; at most identify as external future/companion work."
      thesis: "Conditional chapter that is removed from the evidentiary thesis if reproduction fails."
      result_eligible: false
      result_condition: "Becomes eligible only after archive, independent rerun, and validation gates pass."
    current_evidence:
      summary: >-
        A literature-dossier section records a user report of placement displacement and reliability
        analyses. The report states that reliability at a 60-minute bin is exactly one because
        within-hour placement conserves hourly mass.
      limitations:
        - "The underlying implementation, data, and rendered outputs were not independently inspected here."
        - "The 60-minute equality is a structural identity, not an empirical validation result."
        - "All reported sub-hour magnitudes remain external and unvalidated."
    required_gates:
      - gate_id: "GATE-C04-ARCHIVE"
        requirement: "Archive the authorized code, input data, environment, configuration, and original outputs with digests."
      - gate_id: "GATE-C04-INDEPENDENT-RERUN"
        requirement: "Independently rerun the analysis and reconcile every reported estimate."
      - gate_id: "GATE-C04-ESTIMANDS"
        requirement: "Freeze displacement, reliability, bias, uncertainty, and intended-use estimands before manuscript promotion."
      - gate_id: "GATE-C04-VALIDATION"
        requirement: "Validate the placement procedure on data and use cases matching the stated scope."
    prohibited_inference:
      - "Do not publish the user-reported magnitudes as independently verified findings."
      - "Do not describe the 60-minute identity as empirical accuracy or validation."
      - "Do not generalize from the reported datasets to other vendors, populations, or placement procedures."
      - "Do not inspect or disclose the external consumer repository without separate authority."
    source_authority_pointers:
      - path: "docs/paper/literature-dossier.md"
        authority_for: "The exact external report, its provenance warning, and the 60-minute structural-identity caveat."
        authority_limit: "Records a user report; it is not an independent reproduction."
      - path: "docs/paper/consolidated-literature/master-review.md"
        authority_for: "Published analogues and current placement-literature context."
        authority_limit: "Does not validate the externally reported implementation."

  - id: "claim:C05_VENDOR_CALIBRATION"
    display_name: "Same-device Android vendor-aggregate calibration"
    aliases:
      - "C5"
      - "Digital Wellbeing calibration study"
      - "vendor-calibration claim"
    canonical_statement: >-
      A planned Android study could compare a versioned Digital Wellbeing aggregate with raw
      UsageEvents bindings on the same device and window to characterize differences between an
      opaque vendor measure and explicit reconstruction policies.
    status:
      lifecycle: "PLANNED"
      validation: "UNVALIDATED"
      empirical: "NO_DATA"
      rationale: >-
        The co-observation design is feasible in principle, but this project currently holds no
        Digital Wellbeing calibration data and has run no acquisition or comparison protocol.
    scope:
      included:
        - "Same-device, same-window Android Digital Wellbeing and raw UsageEvents observations with version metadata."
        - "A planned comparison among the vendor aggregate and separately certified raw-log bindings."
      excluded:
        - "Existing evidence about the size, direction, or cause of a vendor-versus-raw difference."
        - "Inference from an Android calibration result to iOS Screen Time without a separate design."
    manuscript_role:
      paper: "Future-work design unless data are collected and every gate passes."
      thesis: "Conditional study chapter; otherwise retain only as a proposed protocol."
      result_eligible: false
      result_condition: "Becomes eligible only after approved collection, acquisition validation, and preregistered analysis."
    current_evidence:
      summary: >-
        Android can expose UsageEvents while also rendering Digital Wellbeing summaries, which
        motivates a same-device design. The dossier explicitly records that no Digital Wellbeing
        data are held today and that there is no research API for the vendor aggregate.
      limitations:
        - "Feasibility and conceptual asymmetry are not calibration evidence."
        - "Screenshot/OCR or annotation acquisition introduces its own error and missingness."
        - "Raw UsageEvents bindings are constructed measures, not unquestioned ground truth."
    required_gates:
      - gate_id: "GATE-C05-AUTHORITY"
        requirement: "Obtain data authority, ethics/privacy approval as applicable, and a versioned collection protocol."
      - gate_id: "GATE-C05-ACQUISITION"
        requirement: "Validate vendor-summary capture, OCR/annotation, window alignment, device clock, and platform/version metadata."
      - gate_id: "GATE-C05-BINDINGS"
        requirement: "Use complete source-conformant raw-log bindings with explicit refusal and uncertainty handling."
      - gate_id: "GATE-C05-PREREGISTRATION"
        requirement: "Preregister comparison estimands, missingness handling, sample/cohort scope, and uncertainty."
      - gate_id: "GATE-C05-DATA"
        requirement: "Collect and audit same-device paired observations before any result is stated."
    prohibited_inference:
      - "Do not claim that a vendor-versus-raw gap currently exists, has a particular magnitude, or favors either measure."
      - "Do not call Digital Wellbeing or raw UsageEvents ground truth."
      - "Do not transfer an Android result or its direction to iOS Screen Time."
      - "Do not present a feasibility argument as collected data or validation."
    source_authority_pointers:
      - path: "docs/paper/literature-dossier.md"
        authority_for: "Current same-device design rationale, no-data status, no-research-API caveat, and Android/iOS scope warning."
        authority_limit: "Design argument only; no calibration evidence."
      - path: "docs/paper/consolidated-literature/master-review.md"
        authority_for: "Current vendor/platform context and published acquisition analogues."
        authority_limit: "Primary platform documentation governs current capability; no paired data are supplied."
      - path: "web/schema/chronicle-research-ontology.linkml.yaml"
        authority_for: "Canonical provenance entities needed to identify inputs, bindings, and executions."
        authority_limit: "Schema support does not validate a collection protocol or result."
