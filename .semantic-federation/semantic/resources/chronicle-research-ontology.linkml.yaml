  sharing_status: {description: "Whether the participant's device is declared shared, as read from the device-sharing support file.", range: DeviceSharingStatus}
  known_minutes: {description: "Admitted minutes on this participant-day whose username is a real person (neither blank, \"nan\", nor \"None\"). The compliance numerator.", range: float}
  unknown_minutes: {description: "Admitted minutes on this participant-day with no resolved person. In the denominator, never in the numerator, and never dropped.", range: float}
  compliance_percent: {description: "known_minutes / (known_minutes + unknown_minutes) as a percentage rounded to two decimals — OR the literal 100.0 imputed for a non-shared participant or a day with no admitted minutes. Always read with compliance_value_basis.", range: float}
  compliance_value_basis: {description: "Whether compliance_percent was measured or imputed, and which imputation applied.", range: ComplianceValueBasis}
