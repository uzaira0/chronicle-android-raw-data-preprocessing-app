version: 2
# Trimmed for minimal noise: monthly cadence, at most one grouped PR per
# ecosystem (all bumps batched into a single PR). Keeps security currency
# without the weekly per-package PR churn. All testing/builds are local
# (see /Makefile); the only remote workflow is the Pages deploy.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/rust/chronicle_app_usage_matcher"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
