status_vocabulary:
  mechanism_present_alternatives_source_unverified: >-
    A runtime mechanism is present, but the literature-derived alternative settings have not
    been independently source-verified.
  reported_unpublished_artifact_absent: >-
    The recovered operator workflow reports unpublished implementation work, but the named
    commits and byte artifact are absent from all successfully inspected evidence locations.
  accepted_on_private_feature_branch: >-
    A fresh implementation reconstructed from the frozen decision has passed its scoped
    acceptance evidence on the private feature branch. It is neither the absent historical
    artifact nor evidence of PR merge, deployment, or canary completion.
  pending: "No implementation is accepted on the stated baseline."
  conditional_refusal: >-
    Implementation is prohibited unless the named public or synthetic evidence condition is met;
    otherwise the runtime must refuse the option explicitly.

artifact_recovery_policy:
  applies_to: "delivery:B02"
  priority: "recover_and_preserve_original_byte_artifact_before_reimplementation"
  checks_completed_without_recovery:
    - "Local objects and refs in the available checkouts."
    - "All fetched private-preview refs: 39 branch heads and 10 tags."
    - "Recovered prior-session evidence and the handoff/log locations named there."
    - "Available backup locations."
    - "The historical Mac endpoint was attempted but did not respond before timeout."
  result: "original_commits_and_wasm_byte_artifact_not_recovered"
  next_permitted_path: >-
    Only after this documented recovery failure, implement the frozen delivery:B02 requirements
    in a fresh implementation path with new provenance and focused tests.
  prohibitions:
    - "Never overwrite, regenerate in place, or discard an original delivery:B02 artifact if one becomes available."
    - "Never present a reconstruction as the recovered historical artifact."

