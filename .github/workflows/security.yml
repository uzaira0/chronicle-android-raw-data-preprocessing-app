# research-canonical: security-scan v1
# Secret scanning (gitleaks) + dependency-vulnerability audit (osv-scanner) on push/PR.
name: security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: osv-scanner dependency audit
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            ./
