id: https://w3id.org/chronicle-usage-ontology/core
name: chronicle-usage-ontology-core
title: Chronicle Android Usage Measurement — Research Ontology (core module)
description: >-
  Core entity model for the Android UsageStatsManager event-log -> usage-measurement
  research ontology. Implements the D4 five-way split from
  docs/workflow/research-ontology-design.md (occurrence / record / optional
  logging-observation / assertion / execution / interval) so provenance can always
  distinguish what was OBSERVED from what was RECONSTRUCTED, and so absence and
  unresolved attribution can never silently drop from denominators.

  Backbone (D2, upper-neutral): SOSA/SSN + OWL-Time + PROV-O + P-Plan. BFO-vs-DOLCE is
  deliberately deferred and, when needed, bridged via SSSOM — this module asserts only
  the free, standards-grounded mappings. This is the FOUNDATION module: SHACL axioms,
  BCIO/Shaleha close-mappings, DQV quality, and generator wiring are later build-order
  steps (doc 13 §"Prioritized build order").
license: MIT
default_range: string

# External-framework alignment (doc 13 D3). Only VERIFIED anchors are asserted:
#  - BCIO "participant engagement with behaviour change intervention" (BCIO_013000,
#    verified via EBI OLS) is referenced by skos:relatedMatch on the `engagement`
#    layer — NOT closeMatch: BCIO engagement is intervention-scoped, chronicle
#    engagement is device/app usage, so the relation is associative, not interchange.
#  - The Shaleha et al. 2026 screen-use measurement framework is a conceptual
#    framework, NOT an ontology with class IRIs, so it is referenced via see_also to
#    its DOI (below), never skos-mapped to a nonexistent class.
see_also:
  - https://doi.org/10.1177/21522715261417288
comments:
  - >-
    Screen-use measurement framework alignment (Shaleha, Roque, Andrews, Calfee & Lee 2026,
    doi:10.1177/21522715261417288): this ontology's measures sit on the framework's
    OBJECTIVE-LOG / passive-sensing modality axis. Referenced, not class-mapped, because the
    framework has no stable class IRIs.

prefixes:
  linkml: https://w3id.org/linkml/
  chron: https://w3id.org/chronicle-usage-ontology/core/
  sosa: http://www.w3.org/ns/sosa/
  ssn: http://www.w3.org/ns/ssn/
  time: http://www.w3.org/2006/time#
  prov: http://www.w3.org/ns/prov#
  pplan: http://purl.org/net/p-plan#
  skos: http://www.w3.org/2004/02/skos/core#
  dqv: http://www.w3.org/ns/dqv#
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/
  dcterms: http://purl.org/dc/terms/
  BCIO: http://humanbehaviourchange.org/ontology/BCIO_
default_prefix: chron

imports:
  - linkml:types

# ============================================================
# ENUMS  (controlled vocabularies)
# ============================================================
enums:

  EventTypeCode:
    description: >-
      Canonical Android lifecycle / device-state event vocabulary. Modeled as a SKOS
      concept scheme.

      This value set is HAND-AUTHORED, not generated. An earlier description said the
      full both-spellings scheme (human labels plus the "Unknown importance: N"
      spellings) "is generated from the engine constants"; no generator in this
      repository produces such an artifact, and `web/schema/Makefile` has no target
      that emits one. The authority for the both-spellings mapping is
      `normalize_interaction_type` in `rust/chronicle_chrono_kernel_wasm/src/lib.rs`,
      which folds thirty-one "Unknown importance: N" codes plus the Chronicle prose
      spellings onto canonical labels. Nothing checks this enum against that function.

      The values below are the codes THIS ontology's own terms refer to: the ones the
      reconstruction, screen-session, opener-set, event-retention and
      notification-proxy axes name in their own descriptions. Codes the kernel
      normalizes but no term here references (3, 5, 6, 8, 9, 13, 20, 21, 24, 25, 28,
      29, 30, 31) are deliberately not minted, so a code appearing here is one this
      ontology actually reasons about rather than a mirror of the platform.
    permissible_values:
      activity_resumed: {description: App moved to foreground (Move to Foreground / UI:1).}
      activity_paused: {description: App moved to background (Move to Background / UI:2).}
      continue_previous_day: {description: "Continue Previous Day (UI:4). App-scoped; named by the gesis_app_scoped_starts opener set."}
      user_interaction: {description: "User Interaction (UI:7). The only code retained by usage_logger_5 that no other named published retention set keeps (the `none` value retains every event)."}
      notification_seen: {description: "Notification Seen (UI:10). An INSTANT, not an interval: the seen_contact_v1 notification-proxy rule emits it into a separate contact channel and it contributes no duration to app usage."}
      standby_bucket_changed: {description: "Standby Bucket Changed (UI:11). App-scoped; named by the gesis_app_scoped_starts opener set."}
      notification_interruption: {description: "Notification Interruption (UI:12). An INSTANT, like Notification Seen; the interruption_contact_v1 proxy rule emits it. The stronger of the two contact signals."}
      slice_pinned_app: {description: "Slice Pinned App (UI:14). App-scoped; named by the gesis_app_scoped_starts opener set."}
      screen_interactive: {description: Screen turned interactive (UI:15).}
      screen_non_interactive: {description: Screen turned non-interactive (UI:16).}
      keyguard_shown: {description: Keyguard shown / device locked (UI:17).}
      keyguard_hidden: {description: Keyguard hidden / device unlocked (UI:18).}
      foreground_service_start: {description: "Foreground Service Start (UI:19). App-scoped; named by the gesis_app_scoped_starts opener set."}
      rollover_foreground_service: {description: "Rollover Foreground Service (UI:22). App-scoped; named by the gesis_app_scoped_starts opener set."}
      activity_stopped: {description: Activity stopped (UI:23) — proximity/fallback close.}
      device_shutdown: {description: Device shutdown boundary (UI:26 / importance 26).}
      device_startup: {description: Device startup boundary (UI:27 / importance 27).}

  AttributionStatus:
    description: >-
      Attribution status of an App-Usage assertion. Chronicle uses a CLOSED
      attribution vocabulary: "Target Child", "Other", or "None"/blank (survey
      answers arrive as "Other (From Survey)"). Mirrors Rust attribution in
      pipeline_v2_incremental.rs (the runtime source of truth). NEVER a null
      person and NEVER an "unknown person" class.

      This enum is a per-episode label. It is NOT, by itself, "the compliance
      denominator contract" — an earlier version of this description said it was,
      which overstated it. The denominator is a participant-day quantity that
      admits only SOME labelled episodes; what it admits and what it silently
      leaves out is stated on ComplianceDayAssessment, which is the term for the
      measure the engine actually computes.
    permissible_values:
      target: {description: 'Attributed to the enrolled target child (label "Target Child").'}
      known_non_target: {description: 'Attributed to a known person other than the target child (label "Other"). Counts as known/attributed.'}
      unresolved: {description: 'Usage occurred but the person is unresolved (label "None"/blank or an empty/"nan" username). Never dropped: an admitted unresolved episode is in the denominator and out of the numerator. Admission is decided by ComplianceDayAssessment, not by this label.'}

  EndpointStatus:
    description: >-
      Observation-endpoint qualification for a derived interval. Under RDF open-world
      semantics a missing endpoint is UNKNOWN, not observed-absent — so absence is
      always an explicit status, never a null result.
    permissible_values:
      observed: {description: Endpoint directly observed in the event stream.}
      unobserved: {description: Endpoint not observed and not bounded by later evidence.}
      right_censored: {description: Observation ended while usage was believed still open.}
      interval_censored: {description: Endpoint known only to lie within bounds set by later evidence (e.g. a fallback close).}

  MeasurementLayer:
    description: The measurement-model layer a class/assertion belongs to (doc 13; chronicle-ontology.md).
    permissible_values:
      construct: {}
      validity: {}
      presence: {}
      engagement:
        description: >-
          Device/app usage-engagement measurement (screen-on, app-in-foreground). RELATED to,
          but deliberately NOT equated with, BCIO "participant engagement with behaviour change
          intervention" (BCIO:013000): BCIO engagement is intervention-scoped whereas a
          chronicle app is generally not a behaviour-change intervention — hence relatedMatch,
          not closeMatch (doc 13 D3).
        related_mappings:
          - BCIO:013000
      person: {}
      attribution: {}

  ReconstructionStrategyId:
    description: >-
      Canonical IRI-bearing identifiers for the named episode-reconstruction algorithms.
      Forward-pairing is a DISTINCT algorithm, not a knob setting (doc 08). The runtime
      enum carries the canonical procedure IRI; concrete strategies are versioned
      individuals of ReconstructionStrategy.
    permissible_values:
      parry_toth_forward_pairing: {description: Parry & Toth start-only bracket-first forward pairing.}
      fused_matcher: {description: This engine's fused open/close matcher (production).}
      eyes_complement: {description: EYES complement-based device-state segmentation (ACTIVE = not(SHUTDOWN or IDLE or GAP or GLANCE)).}
      gesis_start_stop_repair: {description: "GESIS/Zerrer three-tier start-stop repair. Tier 1 is the nearest same-package close candidate — a Stop, or a Start whose next same-app event is not a Stop, so an app with no stop event closes at its own next Start (ported deliberately from the tutorial code, per the matcher's own comment) — accepted only when at most ten events sit between the start and that candidate (`GESIS_EVENT_THRESHOLD = 10`, pipeline_v2.rs:125, passed to `match_app_usage_gesis_with_openers_indices_core`): the tutorial's `event_threshold`, alongside its `max_timeout`. Tier 2 is the next event of any kind, accepted only when it falls within 600 s of the start; tier 3 cuts the episode at start + 600 s, an instant no event carries (`GESIS_MAX_TIMEOUT_NS`). The event threshold is as load-bearing as the timeout — a same-package stop further than ten events away is rejected even when it is well inside 600 s — and omitting it from this description made the arm look like a pure time rule."}
      foreground_background_pairing: {description: "Ahmed et al. (2023) / Okoshi et al. (2025): each Activity Resumed closed by the next Activity Paused of the same package, with no repair of any kind."}
      draxler_interruption_aware: {description: "Chronicle episode-level derivative informed by Draxler et al. (2021), not their full learning-session/interruption method: closes on own-package backgrounding, a screen-stop event, foreground handover, or a gap strictly over 600 seconds between consecutive input rows (at the preceding row time). It does not reconstruct within-session suspending interruptions, return linkage, or experience-sampling queries."}
      morrison_lock_tolerant: {description: "Morrison et al. (2018): ends on handover or on a lock that keeps the screen off for thirty seconds (inherited from Bohmer et al. 2011); a shorter lock does not end the use."}
      schoedel_2026_app_within_screen_prose_v1: {description: "Controlled derivative of Schoedel et al. (2026)'s simplified prose: within a selected screen interval, a type-1 app row opens an episode and the app's last row before a different-app type-1 row or observed screen end closes it. This is not the full deposited PhoneStudy pipeline."}

  IntervalQualityPolicyId:
    description: >-
      Canonical identifiers for the named interval-quality policies. This is a
      SEPARATE axis from reconstruction, crossed with it: a reconstruction rule
      decides where an episode starts and ends, an interval-quality policy bounds
      one that is already reconstructed but implausible. It never redefines an
      episode boundary.
    permissible_values:
      none: {description: This engine's own interval cleaning (production default).}
      culverhouse_trim_and_log: {description: "Culverhouse: trim an implausible interval and record that it was trimmed, rather than dropping the episode or blanking its duration."}

  SessionGroupingPolicyId:
    description: >-
      Canonical identifiers for the named usage-session grouping rules. A THIRD
      axis, crossed with the two above: reconstruction decides episode
      boundaries, interval quality bounds an implausible episode, and this groups
      finished episodes into usage sessions. Most members differ only in their
      gap constant, so the comparison operator and any package clause are the
      load-bearing differences and are stated per value.
    permissible_values:
      none: {description: No session grouping; no session column is emitted (default).}
      church_5s: {description: "Church et al.: 5 s gap. Weakest provenance in this set — the constant is quoted by van Berkel et al. and has not been read from Church's own text."}
      smartphone_wellbeing_strict_lt_5s: {description: "Schoedel et al. (2024, doi:10.1016/j.chb.2023.107977), from the deposited SmartphoneUsage_Wellbeing preprocessing code: join adjacent usage sessions only when the previous-stop to next-start gap is strictly less than 5 s (`diff.to.previous < 5`). A gap exactly equal to 5 s starts a new session. This is distinct from church_5s because the Church boundary comparator is not established from primary code here."}
      grosse_deters_10s: {description: "grosse Deters et al.: 10 s gap, published as a merge of adjacent use."}
      ross_15s: {description: "Ross et al. (2025): 15 s gap, inclusive (>=), and a package change also ends the session. The package-change clause is unique to this member; the inclusive >= boundary is shared with peng_zhu_2020_participant_median, which adopts Ross's boundary side without his package clause. POLLED-INSTRUMENT CAVEAT, stated here for the same reason PolledEmulationMethodId states it for the same paper: Ross's rule was written over POLLED SAMPLES, not over reconstructed episodes. Their collector repeatedly records ScreenStatus and LatestUsedApp, and the released code measures the gap to the NEXT SAMPLE and forces the terminal sample closed. Chronicle applies the constant to the gap between reconstructed episodes instead, which is a transposition of the rule onto a different instrument, not a replay of it. Their brief is also explicit that the 15 s figure is an engineering rule embedded in code, not a validated behavioral cutoff. To reproduce the sampled shape rather than borrow its constant, use ross_2025_sampled_gap_v1 on the PolledEmulationMethodId axis."}
      van_berkel_45s: {description: "Legacy identifier for Chronicle's app-episode gap grouping: gaps <= 45 s join; gaps > 45 s split. This is not an exact implementation of van Berkel et al. (2016): their Constant Classifier applies Gap < T to device-session gaps and classifies equality as new, against participant objective-continuation labels. Their 45 s recommendation is sample/objective-specific and explicitly not generalizable. Later papers citing the constant must retain their own input, stage and equality semantics."}
      zerrer_60s: {description: "Zerrer et al.: 60 s gap. The prose says 'at least 60 seconds' and the code says '> 60'; the code is authoritative because the code produced the published numbers."}
      peng_zhu_2020_participant_median: {description: "Peng & Zhu (2020, JCMC, doi:10.1093/jcmc/zmz029): the only individualized member of the set. Verbatim: 'An individualized threshold, which is the median score of a user's inter-app intervals, is adopted for each user. If the inter-app interval is smaller than the median inter-app interval of a user, then the two apps are grouped into a mobile session; otherwise, they are assigned to two distinct sessions.' The threshold is the median of each participant partition's own previous-stop-to-next-start intervals — no constant, no multiplier, no observation floor — and 'smaller than joins' places a gap exactly equal to the median on the splitting side (inclusive >=, like Ross, without his package clause). The median is always derived from previous-stop intervals even when the gap-basis departure is selected for the comparison, because a statistic measured from the running maximum would depend on the very session assignments it defines. With session-break lineage on, each partition's OPEN flag records the derived median and its interval count, so the individualized threshold is reconstructible from the export."}

  SessionGapBasisId:
    description: >-
      Canonical identifiers for WHICH endpoint a session gap is measured from.
      Every rule on the SessionGroupingPolicyId axis is stated over a stream in
      which episodes do not overlap — a polled foreground sample, or a table
      already reduced to one app at a time. Chronicle's event stream is not that
      stream, and `model_concurrent_usage` (which splits overlapping episodes)
      defaults OFF, so on a default run an episode nested inside a longer one
      reaches grouping intact.

      The published reading then measures the gap from whichever episode starts
      last, which for a nested pair is the SHORT one. Verified against the
      kernel: a 30 min episode, a 1 min episode nested at its start, and a third
      episode 20 s after the long one ends are numbered `[0, 0, 1]` under the
      60 s rule, although the screen was covered continuously throughout.

      The alternative is a stated DEPARTURE from every published rule, not a
      correction of them, which is why the published reading is the default and
      an unknown identifier widens to it.
    permissible_values:
      previous_episode_stop_v1: {description: "The immediately preceding episode's stop, in start order. What every published rule ships, and the default."}
      session_running_maximum_stop_v1: {description: "The maximum stop of every episode already placed in this session — the coverage envelope the rules describe in prose. An episode nested inside a longer one can no longer pull the measuring point backwards."}

  SessionBoundaryScopeId:
    description: >-
      Canonical identifiers for WHICH rows are numbered as one sequence of
      sessions. The engine partitions by `participant_id` alone, but every other
      dimension of the published classification key
      (`study_id,participant_id,possible_device_model,username`) varies WITHIN a
      participant: `username` is a raw per-row Chronicle column, and nothing
      constrains one export to a single `study_id`.

      The failure this axis addresses is a MISSED break rather than a spurious
      one. A foreign row landing inside a participant's silence bridges it, so
      the participant's session is never split. Verified against the kernel:
      three episodes in which study A is silent for 950 s and study B's episode
      sits inside that silence are numbered `[0, 0, 0]` under the 60 s rule.

      `attribute_person` already retypes a shared device's non-target rows to
      Non-Target Child App Usage, which grouping then excludes — but that runs
      only when a device-sharing file is configured. Without one, a sibling's
      episodes stay App Usage and are numbered into the target child's sequence.

      The scopes nest, so widening can only split a sequence further and can
      never merge two. Unknown identifiers resolve to the narrowest scope, which
      is today's behaviour.
    permissible_values:
      participant_v1: {description: "`participant_id` alone. What the engine has always used, and the default."}
      participant_and_study_v1: {description: "`(study_id, participant_id)`. A participant id reused across studies no longer bridges either study's silences."}
      participant_study_and_person_v1: {description: "`(study_id, participant_id, username)`. Also separates the people on a shared device when no device-sharing file has reclassified them."}

  EventRetentionSetId:
    description: >-
      Canonical identifiers for the named event-retention sets — which raw
      interaction types a published study let its reconstruction see at all. A
      FOURTH axis, crossed with the three above and sitting UPSTREAM of them: it
      narrows the events the app-usage reconstruction sees, before any episode
      is reconstructed, so one study's rule can be replayed on the set of event
      types another study recorded. It does NOT narrow the screen-usage branch,
      which reads the full event stream. Unknown identifiers resolve to `none`,
      which widens rather than narrows, so an unrecognised value can never
      silently delete data.

      PROVENANCE WARNING for every value except `none`: the retained type sets
      below are transcribed from the papers' own descriptions and this
      repository holds NO artifact that can check them. `.refs/` carries no
      bibliography entry and no code for Parry & Toth's retained-type list, for
      Usage Logger, or for Toth & Trifonova. Contrast `zerrer_60s` and
      `smartphone_wellbeing_strict_lt_5s` on the SessionGroupingPolicyId axis,
      whose comparators are read from deposited code. Treat every set
      here as unverified transcription until a source lands in `.refs/`.
    permissible_values:
      none: {description: Retain every interaction type; the engine's own filtering still applies (default).}
      parry_toth_7: {description: "Parry & Toth: types 1, 15, 16, 17, 18, 26, 27. Activity Paused (type 2) is NOT retained — the paper closes on screen and device events instead. This differs from the parry_toth_forward_pairing reconstruction arm, which ports Culverhouse's adaptation and does close on type 2."}
      usage_logger_5: {description: "Usage Logger: types 1, 2, 7, 26, 27. The only set that retains User Interaction (type 7)."}
      toth_trifonova_app: {description: "Toth & Trifonova: types 1, 2, 17, 26 — the foreground pair plus keyguard-shown and shutdown. Type 17 is Keyguard Shown (the screen locking), NOT screen-on, which is type 15 and is not in this set; an earlier version of this description said screen-on and disagreed with the code it documents."}
      foreground_background_only: {description: "Types 1 and 2 only. The minimal set: reconstruction sees the foreground/background pair and nothing else, so every close is an observed app transition. It is a strict subset of usage_logger_5 and toth_trifonova_app, but NOT of parry_toth_7, which drops type 2."}

  InteractionTypeRemovalModeId:
    description: >-
      Whether selected interaction types are removed unconditionally or retain
      rows that carry long-data-gap evidence. `gap_preserving` is Chronicle's
      compatibility behavior. `unconditional` reproduces source pipelines
      such as SmartphoneUsage_Wellbeing that filter the named event before any
      long-gap exception is considered.
    permissible_values:
      gap_preserving: {description: "Drop selected types except rows whose data gap reaches the smallest configured long-gap threshold (default)."}
      unconditional: {description: "Drop every row of a selected type, including rows that carry long-gap evidence."}

  OpenerSetId:
    description: >-
      Canonical identifiers for which retained, app-scoped event rows may begin
      an app episode. This axis runs after event retention and before episode
      reconstruction: it changes opener eligibility without deleting non-opener
      rows that may still close, bound, explain, or censor an episode. It does
      not choose a closer or repair rule, and package handling remains with the
      selected reconstruction strategy and the separate package-policy axis.
    permissible_values:
      strategy_defined: {description: "Compatibility default: preserve the selected reconstruction strategy's native opener and materializer behavior exactly."}
      activity_resumed_only: {description: "Canonical Android type 1 (Activity Resumed / Move to Foreground), including Chronicle's filtered equivalent after normalization. Package policy remains inherited from the selected reconstruction strategy."}
      gesis_app_scoped_starts: {description: "GESIS-derived adapter, not a verbatim source method: begin with source membership {1, 4, 11, 14, 15, 18, 19, 22, 27}, then intersect with app-scoped Android event semantics for effective membership {1, 4, 11, 14, 19, 22}. Device-scoped types 15, 18, and 27 never open app credit; package handling remains separate."}

  MicroUseClassificationPolicyId:
    description: >-
      Canonical identifiers for a non-destructive classification of an already
      reconstructed app episode. Classification never changes duration,
      boundaries, inclusion, grouping, or aggregate credit.
    permissible_values:
      none: {description: "Compatibility default: do not classify episodes and do not add a micro-use column to the default scientific CSV."}
      okoshi_lt_5s: {description: "Okoshi et al. (2025) source-aligned component: a positive, bounded raw reconstructed duration strictly below five seconds is micro-use; equality is not micro-use and an unbounded or zero-length artifact is not classifiable."}

  MinimumDurationComparatorId:
    description: >-
      Comparator applied once to immutable raw reconstructed episode duration
      at the post-materialization, pre-concurrency checkpoint.
    permissible_values:
      strict_lt: {description: "Qualify a bounded episode only when raw duration is strictly less than the configured minimum_usage_duration; compatibility default."}
      inclusive_le: {description: "Qualify a bounded episode when raw duration is less than or exactly equal to the configured minimum_usage_duration."}

  MinimumDurationDispositionId:
    description: >-
      Disposition for an episode qualified by the minimum-duration comparator.
      This is separate from micro-use classification and exact-zero cleanup.
    permissible_values:
      chronicle_blank_keep_row: {description: "Compatibility default: retain the row and its boundaries but blank duration_seconds and duration_minutes."}
      retain_and_credit: {description: "Retain raw timing and credit the episode while recording that it qualified as below the declared floor."}
      retain_but_exclude: {description: "Retain raw timing and lineage but mark the episode ineligible for headline aggregates."}
      drop_row: {description: "Remove the app output row while retaining its exact bounds, duration, reason, and source ranges in a dedicated excluded-lineage artifact."}

  MaximumDurationPolicyId:
    description: >-
      Canonical identifiers for the maximum-duration policy: how an app
      episode whose duration exceeds a maximum threshold is treated. Chronicle's
      legacy behaviour is a candidate-admissibility rule inside the fused
      matcher (a candidate closer more than long_duration_threshold_hours after
      the opener is rejected, so the episode surfaces as End of Usage Missing);
      it is not a post-reconstruction stage. When every maximum-duration key is
      absent the legacy behaviour runs exactly as before and no receipt is
      emitted. Any explicit selection activates checked i128 arithmetic on the
      timestamp differences it evaluates and emits a maximum-duration receipt.

      CITATION CORRECTION. An earlier version of this description offered Dekker
      et al. (2024) as precedent for keeping uncapped EPISODE durations. That
      misreads them. What Dekker et al. kept was extreme PARTICIPANTS — their
      sentence is "some extreme outliers were present, but these people seemed
      to use gaming apps extensively and were thus not removed", a decision
      about participant-level DAILY totals (screen time M = 327.43 min/day,
      max = 1270.00). They state no episode rule at all: their session is
      defined conceptually ("unlocking the phone, followed by a series of phone
      activities, until the phone is locked again") and the event-to-session
      logic belongs to the proprietary Murmuras collector, so they cannot be
      cited for or against an episode-duration policy. They did apply an
      exclusion elsewhere — YouTube Vanced and Basic Daydreams were removed from
      screen time as screen-forcing apps — so "Dekker kept the outliers" is not
      even a general stance of theirs. The honest precedent is therefore for the
      participant-day INCLUSION decision, not for this axis; nothing in the
      collected corpus supports a per-participant duration cap (see
      b12_adaptive_participant on MaximumDurationThresholdSourceId).
    permissible_values:
      strategy_native: {description: "Explicitly adopt the selected reconstruction strategy's native maximum-duration behaviour. Baseline-equivalent output plus a receipt; not the same as omission."}
      chronicle_observed_close_rejection_v1: {description: "Name Chronicle's fused-matcher candidate-admissibility rule explicitly. Executable only with the fused_matcher strategy; every other strategy refuses with maximum_policy_incompatible_with_reconstruction_strategy."}
      post_reconstruction_strict_max_v1: {description: "Generic stage after episode reconstruction and before concurrency: an episode qualifies when raw duration is strictly greater than the threshold (equality is retained), then the configured disposition applies."}

  MaximumDurationConfiguredDispositionId:
    description: >-
      Disposition for an episode qualified by the generic maximum-duration
      stage. Only post_reconstruction_strict_max_v1 reads it; the other
      policies require not_applicable.
    permissible_values:
      not_applicable: {description: "Required with strategy_native and chronicle_observed_close_rejection_v1, which own their endpoint behaviour natively."}
      flag_and_retain: {description: "Retain raw timing and credit the episode while recording that it qualified as above the declared maximum."}
      retain_but_exclude: {description: "Retain raw timing and lineage but mark the episode ineligible for headline aggregates."}
      truncate_to_threshold: {description: "Move the effective stop to start + threshold, record the trimmed nanoseconds and effective_endpoint_reason, and keep the raw episode bounds in lineage."}
      drop_row: {description: "Remove the app output row while retaining its exact bounds, duration, reason, and source ranges in the maximum-duration excluded-lineage receipt."}

  MaximumDurationThresholdSourceId:
    description: >-
      Where the selected policy's threshold comes from. Each policy accepts
      exactly one pairing: strategy_native with strategy_native,
      chronicle_observed_close_rejection_v1 with chronicle_legacy_config, and
      post_reconstruction_strict_max_v1 with fixed_parameter or
      b12_adaptive_participant. Any other pairing refuses with
      request_shape_invalid; no missing sibling is filled in.
    permissible_values:
      strategy_native: {description: "The selected reconstruction strategy's own threshold, if it has one; pairs only with the strategy_native policy."}
      chronicle_legacy_config: {description: "Chronicle's long_duration_threshold_hours, canonicalized exactly to integer nanoseconds (1.25 h -> 4500000000000; a value that is not a whole number of nanoseconds refuses); pairs only with chronicle_observed_close_rejection_v1."}
      fixed_parameter: {description: "Read maximum_duration_threshold_ns: exact base-10 nanoseconds, [1-9][0-9]{0,18}, at most i64::MAX; pairs only with post_reconstruction_strict_max_v1."}
      b12_adaptive_participant: {description: "Standing refusal (adaptive_maximum_threshold_provider_unavailable): no paper in the collected corpus derives a per-participant duration CAP, so there is nothing faithful for this source to execute and no fallback threshold is fabricated. The individualized-threshold practice that exists in the literature is Peng & Zhu (2020)'s per-user median of inter-app intervals, which is a session-grouping rule and is implemented as the peng_zhu_2020_participant_median arm of SessionGroupingPolicyId."}

  ScreenSessionConstructionStrategyId:
    description: >-
      Canonical identifiers for device-level screen-session construction. The
      two source-sensitive strategies require a digest-bound capability sidecar
      and preserved physical source order; missing prerequisites refuse rather
      than falling back to Chronicle.
    permissible_values:
      chronicle_screen_interactive_v1: {description: "Compatibility default: Chronicle's participant-isolated Screen Interactive / Screen Non-Interactive state machine with its existing duplicate, orphan, and right-edge behavior."}
      parry_toth_2025_session_glance_v1: {description: "Parry and Toth (2025) source-aligned adapter over separate Android event types 15-18 and 26-27, preserving screen-only physical adjacency and distinguishing sessions from locked glances."}
      zhu_2018_unlock_lock_v1: {description: "Zhu et al. (2018) source-aligned adapter: an immediately adjacent full-log screen-on then keyguard-hidden opens at unlock; screen-off or shutdown closes."}
      unlock_to_lock_v1: {description: "Direct literature rule family: keyguard-hidden (unlock) opens a session and keyguard-shown (lock) closes it."}
      unlock_to_off_or_lock_v1: {description: "Direct literature rule family: keyguard-hidden (unlock) opens a session and the first screen-non-interactive or keyguard-shown event closes it."}

  ScreenSessionClassificationPolicyId:
    description: Source-selectable labels derived from a constructed screen interval.
    permissible_values:
      none: {description: "Do not assign a literature screen-session class."}
      phone_check_inclusive_15s: {description: "Tkaczyk et al. (2024): label a screen-on session lasting no longer than 15 seconds as phone_check; equality is included."}
      null_no_app_strict_gt15s_vs_app: {description: "Hammer and Yan (2014): label sessions with app evidence as app, and no-app sessions strictly longer than 15 seconds as null."}

  ScreenSessionMaximumDurationDispositionId:
    description: Action applied to a constructed screen interval above its declared maximum duration.
    permissible_values:
      none: {description: "Preserve the constructed screen interval."}
      truncate: {description: "For a strictly over-threshold interval, stop at start plus the configured maximum and retain truncation lineage."}
      exclude_participant: {description: "If any completed interval is strictly over the threshold, exclude that participant's analytical outputs; equality is retained."}

  LockedScreenAudioDispositionId:
    description: Whether locked-screen app/audio continuation counts as interactive phone use.
    permissible_values:
      include: {description: "Compatibility default; retain normal Chronicle app and screen construction."}
      exclude_from_phone_and_app_sessions: {description: "Menthal rule: activity while the screen remains locked/noninteractive creates neither a phone session nor an app session."}

  ScreenGatingRuleId:
    description: >-
      Canonical identifiers for the rule that decides which parts of an app
      session earn screen-gated credit. Chronicle's shipped rule is the
      intersection of two independently observed conditions: intervals where a
      screen event witnessed the screen ON (bridged across sub-auto-lock
      blips), and spans where the device was demonstrably alive (event cadence
      within the liveness tolerance, broken by a Device Startup). Naming the
      rule makes each conjunct selectable on its own, so a researcher can state
      which observation their measurement rests on instead of inheriting the
      intersection implicitly. The rule affects only the credited side output;
      the headline app-usage output is never changed by any value.
    permissible_values:
      screen_and_liveness_v1: {description: "Compatibility default: credit the intersection of witnessed screen-ON intervals and demonstrably-alive spans. Byte-identical to the pre-B07 credited output."}
      screen_witness_only: {description: "Credit witnessed screen-ON intervals alone, without requiring the device to be demonstrably alive. More permissive: a lit screen inside a long event silence still earns credit."}
      strict_visual_only: {description: "Credit witnessed screen-ON intervals alone and exclude any app session with no screen witness. This is the source-faithful visual-only rule; it never uses Chronicle's no-witness alive-span fallback."}
      device_liveness_only: {description: "Credit demonstrably-alive spans alone, without requiring a screen witness. An activity-based rather than screen-based measurement; the no-screen-witness fallback never applies because no screen evidence is consulted."}

  TimezoneNormalizationPolicyId:
    description: >-
      Canonical identifiers for how a run resolves the ONE output timezone that
      every downstream day boundary is measured in, and for what happens to rows
      whose recorded timezone is not that zone.

      This is the axis DayBoundaryAttributionId presupposes. That term defines a
      day as local midnight "in the row's output timezone" but says nothing about
      how the output timezone is chosen, and two of the four values here DELETE
      ROWS to make the answer unique. A daily total is therefore not fully
      specified by a day-boundary rule alone; it also depends on which value of
      this axis produced the clock and the surviving rows.

      Timestamps themselves are absolute. "Convert" re-expresses the same instants
      on one clock and drops nothing; it changes the local-time columns and the
      `date` a row is attributed to. "Filter" keeps the recorded clock and removes
      every row that disagrees with it — a data-deletion decision made before any
      episode is reconstructed, upstream of every other axis in this ontology and
      of the compliance and coverage denominators.

      Implemented by `resolve_timezone_strategy` (pipeline_v2_incremental.rs) and
      `standardize_event_clock`; the contract slot is `timezone_handling`, whose
      local enum TimezoneHandlingMode carries exactly these four values. The
      default is selected-convert, so the default run deletes no row for its
      timezone. This is the ONE axis whose values are declared in the local
      contract's own enum rather than read from here, because the kernel reads it
      as a plain string field; the two vocabularies are kept identical by
      `npm run check:contract`.
    permissible_values:
      selected-filter: {description: "Keep only rows whose recorded timezone equals the researcher-selected zone; that zone becomes the output timezone. Every other row is DELETED before reconstruction. An empty selection refuses, and so does a selection that would remove all rows — but a selection that removes some rows does not warn."}
      selected-convert: {description: "Default. The researcher-selected zone becomes the output timezone and every row is re-expressed on it. No row is deleted for its timezone. This is what the studies' locked configuration runs, and it is also the kernel's absent-key default."}
      primary-filter: {description: "The output timezone is the file's primary zone — the most frequent non-empty recorded value, ties resolved to the first encountered — and every row not carrying that exact value is DELETED, including rows with a blank timezone, which are skipped when the primary is counted but not when the filter is applied."}
      primary-convert: {description: "The output timezone is the file's primary zone, computed the same way, and every row is re-expressed on it. No row is deleted."}

  DayBoundaryAttributionId:
    description: >-
      Canonical identifiers for how a usage session that spans local midnight is
      attributed to calendar days. Chronicle dates a session by the local
      calendar day of its START instant and never divides it, so a session that
      runs from 23:40 to 00:20 contributes all forty minutes to the first day
      and none to the second. That is a measurement decision, not a fact about
      the device: a study reporting daily screen time is asking how much use
      fell within each day, and the undivided form answers a different
      question. Naming the rule lets a researcher state which one their daily
      totals rest on. The day boundary itself is local midnight in the row's
      output timezone under every value, resolved through the zone's own
      transitions so a daylight-saving day is 23 or 25 hours rather than an
      assumed 24. WHICH zone that is, and whether any row was deleted for
      disagreeing with it, is decided upstream by
      TimezoneNormalizationPolicyId — a daily total is specified by the two
      terms together, never by this one alone.
    permissible_values:
      attribute_to_start_day: {description: "Compatibility default: a spanning session stays one row, dated by the local calendar day of its start instant. Byte-identical to the pre-B14 output."}
      split_at_local_midnight: {description: "A spanning session is divided at each local midnight it crosses into one row per calendar day, each carrying its own start, stop, duration, and date, and all of them carrying the same raw source evidence. Daily totals then sum the time that actually fell within each day."}

  PackageExclusionPresetId:
    description: >-
      Canonical identifiers for WHICH rows of the supplied package-filter file
      actually exclude a package from app-usage measurement. This is the
      package-policy axis that the opener-set and reconstruction-strategy axes
      defer to; it selects the membership of the excluded set and changes
      nothing about how an episode is reconstructed.

      Exclusion in this pipeline is a RELABEL, never a deletion: an excluded
      package's episode is retained as `Filtered App Usage`, keeps its raw
      evidence and its place in the event order, and still closes and opens
      neighbouring episodes exactly as it would if it were not excluded. Every
      value below therefore moves which rows carry the excluded label and the
      headline app-usage totals derived from them, and none of them moves
      episode reconstruction.

      The shipped default filter file
      (`Chronicle_Android_raw_data_preprocessor_apps_to_filter.csv`) carries an
      `app_filter_category` classification and a per-row `filter_bool`. Before
      this axis existed no kernel step read either column — the filter map was
      built from the package and label columns alone — so every supplied row
      excluded regardless of its category, and a row marked `filter_bool` 0 was
      excluded anyway. That silent disagreement between a shipped artifact and
      engine behavior is what naming this axis resolves. Unknown identifiers
      resolve to `all_supplied_rows`, which is the widest membership and the
      pre-existing behavior, so an unrecognised value can never silently
      narrow the excluded set.
    permissible_values:
      all_supplied_rows: {description: "Compatibility default: every row of the supplied filter file excludes its package, whatever its `app_filter_category` and whatever its `filter_bool` says. Byte-identical to the pre-B10 output. The category and flag columns remain unread under this value."}
      honor_filter_flag: {description: "Read `filter_bool`: a row whose flag parses as 0 (or `false`/`no`/`off`, case-insensitively) does not exclude its package; every other row does, including a row whose flag is absent or unparseable, which keeps an unreadable flag from silently narrowing the set. All 80 rows of the shipped default file carry 1, so this value is a no-op on the shipped file and takes effect only on a file a researcher has edited."}
      system_scope_only: {description: "Read `app_filter_category`: exclude only rows classified `system` or `system-defensive` — the launcher, system-UI, settings and keyguard surfaces that are not user-facing apps. On the shipped default file that is 60 of the 80 rows, leaving the carrier, audio, navigation, external-remote, lockscreen-phantom and non-child-productivity rows measured as ordinary app usage. A row with no category, or a category outside those two, is not excluded under this value."}

  FilterMatchFieldId:
    description: >-
      Canonical identifier for the field whose exact value makes a filter-file
      row match an input row. app_package_name is the compatibility default.
      application_label uses case-sensitive full-string equality and retains
      a matched row as filtered lineage without inferring a package identity.
    permissible_values:
      app_package_name: {description: "Compatibility default: match the supplied package identity, optionally narrowed by the supplied known label."}
      application_label: {description: "Match the input application_label by exact, case-sensitive, full-string equality; never case-fold, use substrings, or infer a package."}

  NotificationProxyRuleId:
    description: >-
      Canonical identifiers for WHICH raw notification rows, if any, become
      explicit proxy contact events. This axis exists so that notification-derived
      usage is represented only through a named rule with visible provenance,
      never implicitly.

      Chronicle records Android's `NOTIFICATION_SEEN` (event type 10) and
      `NOTIFICATION_INTERRUPTION` (type 12) as app-scoped rows carrying a package
      name, and the app-usage reconstruction reads neither: output rows are
      episodes, so a raw notification row produces no output at all. The only
      notification decision the engine made before this axis was internal to one
      reconstruction strategy, which declares `Notification Seen` unmatchable as
      an episode stop.

      A notification is an INSTANT, not an interval. No value below contributes a
      duration to app usage or changes the headline app-usage output in any way:
      admitted rows are emitted into a separate `Notification Contact` CSV whose
      rows carry no start, stop, or duration at all. Each emitted row keeps its
      source interaction type and gains two flags in `any_app_usage_flags` — the
      rule that emitted it, and whether its instant falls inside a reconstructed
      episode of the same package, so notification contact can be separated from
      time already counted as observed usage.

      Unknown identifiers resolve to `none`, which emits nothing. This is the one
      axis that NARROWS on an unrecognised value rather than widening: the failure
      it must prevent is fabricating proxy usage a study did not ask for.
    permissible_values:
      none: {description: "Compatibility default: notification rows play no role beyond whatever the selected reconstruction strategy already does with them, and no proxy channel is emitted. Byte-identical to the pre-B08 output."}
      seen_contact_v1: {description: "`Notification Seen` (Android type 10) only. The notification was posted and surfaced to the user; nothing in the event says it was acted on. This is the weaker of the two contact signals."}
      interruption_contact_v1: {description: "`Notification Interruption` (Android type 12) only. The notification actively interrupted the user rather than merely being visible, so it is the stronger contact signal of the two."}
      any_notification_contact_v1: {description: "Both notification types, emitted into one channel. Each row still records which type it came from, so the two can be separated after the fact without a second run."}

  PolledEmulationMethodId:
    description: >-
      Canonical identifiers for WHICH published polled-collection rule, if any,
      is re-derived from this run's reconstructed episode timeline and emitted
      as a declared approximation alongside the headline app-usage output.

      Chronicle collects the EVENT STREAM: every foreground transition carries
      its own timestamp. A large part of the smartphone-use literature does not.
      It POLLS — a background service records what is on screen at a fixed
      cadence — and derives sessions from those samples. A researcher holding
      Chronicle totals cannot compare them to a published polled study, because
      the two instruments did not observe the same thing. This axis exists so
      that comparison can be made explicitly, under a named rule, rather than
      by assuming the two measurements are interchangeable.

      Every value other than `none` emits a SEPARATE `Polled Emulation` CSV.
      The headline app-usage output is never changed by any value here. Each
      emitted row carries, in `any_app_usage_flags`, the method and cadence
      that produced it and the flag `EMULATED NOT OBSERVED`, because the one
      thing a reader must not do is mistake a re-derived row for collected
      data.

      The approximation is lossy in a measurable direction, which is why it
      must be declared rather than folded into a default. ScreenTK 2024
      (`10.1145/3675094.3677547`) reports that five-second sampling misses
      substantial active and passive UI events against an interval baseline.
      Resampling an event-derived timeline can only LOSE detail relative to
      that timeline: it does not reproduce what a real polled collector would
      have missed differently — jitter, doze, service restarts, permission
      loss. Treat the difference as a lower bound between instruments, not as
      a simulation of one.

      Screen state is an assumption, not an observation. The published rules
      retain only samples whose `ScreenStatus` is `Interactive`. In an
      event-derived timeline a sample instant falling inside an app episode IS
      an interactive sample with that package foregrounded, so the retention is
      already implied by the episode. Every emitted row is produced under that
      equivalence, and carries the flag that says so.

      Package exclusion is NOT part of this axis. The published rules exclude
      the study app, Android, System UI and launchers; this repository already
      owns that decision through the filter file and the package-exclusion
      preset, and emulation runs over whatever the run's existing exclusion
      already decided rather than introducing a second package list.

      Unknown identifiers resolve to `none`. Like the notification-proxy axis
      this NARROWS on an unrecognised value: the failure it must prevent is
      fabricating an emulated measurement a study did not ask for.
    permissible_values:
      none: {description: "Compatibility default: no resampling is performed and no emulated channel is emitted. Byte-identical to the pre-B09 output."}
      ross_2025_sampled_gap_v1: {description: "Ross, Rhee, Le, Mount, Chang & Bayer (2025), Scientific Reports `10.1038/s41598-025-25174-2`, OSF `bjh2m`. The rule is declared in released code, not inferred from prose: a retained sample ends and counts a session when the gap to the next sample is at least the gap threshold or the next foreground package differs, and the terminal sample is forced closed so that it counts. Duration comes from endpoint subtraction over the retained samples. The brief for this source is explicit that the 15 s figure is an engineering rule embedded in code, not a validated behavioral cutoff — which is exactly why it is reproducible here as a named choice instead of a default."}
      cerit_2025_sample_count_v1: {description: "Cerit et al. (2025), `10.2196/59875`. A different polled shape: duration is the RETAINED SAMPLE COUNT converted by the sampling cadence, never endpoint subtraction. Emitted for the same timeline as the Ross rule so the two conversions can be compared directly; the gap threshold does not apply, because this rule never asks how far apart two samples were."}

  IntervalExpansionMethodId:
    description: >-
      Canonical identifiers for source-declared expansions of bounded app
      intervals into a separate derived timeline. This is not polling: every
      emitted point is anchored to its own source interval start, and the
      headline reconstructed episode table is never changed.
    permissible_values:
      none: {description: "Compatibility default: emit no interval-expansion artifact."}
      behapp_start_anchored_half_open_1s_v1: {description: "Exact deposited Behapp preprocessing for `10.1037/emo0001485` (`Match_ESM_App.py`): compute end as start plus `int(duration)`, then emit start, start + 1 second, ... strictly before end. Thus a three-second interval emits offsets 0, 1, and 2, never the stop endpoint."}

  DayCoverageStatus:
    description: >-
      Per participant-day observability status, as the engine actually computes
      it in `build_coverage` (pipeline_v2_incremental.rs) and emits it in the
      `day_coverage_csv` `status` column. Exactly these three values are
      produced; there is no fourth.

      The day spine is the participant's study window when one is configured, and
      otherwise the inclusive range from their first to their last observed date,
      so "no data" is only ever asserted INSIDE a window that was expected to
      hold data. That is what makes the no-activity / no-data distinction an
      observability claim rather than a claim about the person.

      Admission to `usage` is narrower than "an app episode exists on that day":
      the row must be App Usage (a Filtered App Usage row does not count), must
      be aggregate-eligible under the minimum-duration disposition, and must
      carry a duration strictly greater than zero. A day whose only app rows are
      filtered, sub-floor, or zero-length is therefore `no_activity`, not
      `usage`, even though app activity was observed.
    permissible_values:
      usage: {description: "At least one App Usage episode on this day is aggregate-eligible with a duration strictly greater than zero minutes."}
      no_activity: {description: "Raw events exist for this participant-day but no episode meets the `usage` bar. Observation happened; qualifying usage did not. Related to, but NOT identical with, `add_no_activity_placeholder_days`: the placeholder (a zero-duration `com.placeholder.noactivity` row synthesized from the day's first raw event — a marker for an observed day, never invented usage) is suppressed by ANY retained App Usage row (`add_no_activity_placeholder_rows`, pipeline_v2.rs), while this status applies the stricter `usage` bar — so a day whose only app rows are sub-floor or zero-length is `no_activity` here yet receives no placeholder."}
      no_data: {description: "The day lies inside the participant's spine but carries no raw event at all. Nothing was observed, so nothing can be said about use; this is the only value that means absence of observation rather than absence of qualifying usage."}

  CoverageCause:
    description: >-
      Best-supported cause of a coverage gap. A gap is an OBSERVABILITY
      condition — never asserted as physical inactivity.

      NOT CURRENTLY COMPUTED. No path in the kernel produces any of these four
      values: the shipped day-coverage output is DayCoverageStatus, which
      classifies a day as usage / no_activity / no_data and offers no cause at
      all. This enum, and the CoverageAssessment class that carries it, are
      design-time vocabulary for a cause attribution the engine does not yet
      make. They are retained because the distinctions are the ones the event
      stream could support — Device Shutdown and Device Startup are already
      canonical EventTypeCode values and the screen-gating layer already reads
      device liveness — but an instance carrying a value here is an assertion by
      whoever wrote it, not a reading of this pipeline's output.
    permissible_values:
      shutdown_boundary: {description: Gap opens with a clean shutdown-class event.}
      unclean_power_loss: {description: Gap ends with a startup-class event but no clean shutdown (battery death / forced off).}
      collector_reporting_gap: {description: Device on but the collector did not report.}
      unknown: {description: Cause not determinable from events.}

  DeviceSharingStatus:
    description: >-
      Whether a participant's device is declared shared, as the compliance step
      reads it from the device-sharing support file. Emitted verbatim in the
      `sharing_status` column of the `compliance_csv`.
    permissible_values:
      shared: {description: 'The participant appears in the device-sharing file (CSV literal "Shared"). Only for these participants is a compliance share measured.'}
      non_shared: {description: 'The participant does not appear in the device-sharing file (CSV literal "Non-Shared"). The compliance percent is imputed, not measured — see ComplianceValueBasis.'}

  ComplianceValueBasis:
    description: >-
      How a ComplianceDayAssessment's compliance_percent came to hold its value.
      This distinction exists because the engine writes the literal 100.0 into
      two cases where nothing was measured, and the CSV column that carries it is
      the same column that carries a real share — so a reader summarizing the
      column without this basis is averaging measurements together with
      imputations.
    permissible_values:
      measured_share: {description: "known_minutes / (known_minutes + unknown_minutes), rounded to two decimals. Produced only when the participant is shared AND the day admitted a positive total."}
      imputed_non_shared_device: {description: "The participant is not in the device-sharing file, so no attribution question arises and the engine writes 100.0. Nothing about this day's attribution was measured."}
      imputed_no_eligible_usage: {description: "The admitted total for the day is zero — no App Usage or Non-Target Child App Usage row survived aggregate eligibility with nonzero minutes — so the share is 0/0 and the engine writes 100.0. The day is recorded with zero_eligible_usage set, which is the only signal separating it from a genuine perfect day."}

  QueryExecutionStatus:
    description: Observed state of one physical query in a runtime execution.
    permissible_values:
      cached: {description: Reused from a compatible in-memory or durable checkpoint.}
      recomputed: {description: Evaluated during this run.}
      error: {description: Evaluation failed.}
      skipped: {description: Intentionally omitted by the execution mode.}
      bypassed: {description: Not applicable for the supplied inputs and configuration.}

  ScreenStateId:
    description: "Normalized supplied screen state, not recovered Android serializer codes (Hard Lock Life, printed p218 Figure1)."
    permissible_values:
      "ON":
      "OFF":

  KeyguardStateId:
    description: "Normalized supplied keyguard state; screen-off does not imply locked (Hard Lock Life, printed p218 Figure1)."
    permissible_values:
      LOCKED:
      UNLOCKED:

  DeviceStateIntervalKindId:
    description: "Distinct supplied interval meanings, not reconstruction algorithms or raw codes."
    permissible_values:
      screen_bout: {description: "SCREEN_ON to SCREEN_OFF, including lock-screen use (Hard Lock Life, printed p220 Section4.2.1)."}
      unlock_cost_upper_bound: {description: "ON_LOCKED to ON_UNLOCKED, potentially including clock/notification viewing, not pure authentication time (printed p218 Section4.1.1)."}

  MethodSettingRoleId:
    description: Functional role of one source-supported method setting in a complete study profile.
    permissible_values:
      acquisition:
      event_schema:
      diary_schema:
      participant_schema:
      reconstruction:
      quality_control:
      aggregation:
      feature_engineering:
      analysis:
      intervention: {description: "Source-controlled app behavior that delivers an intervention, changes content availability, or actuates a device setting, distinct from data acquisition and downstream analysis."}
      validation:
      reporting:
      provenance:

  TypingTrialRepresentationId:
    description: "Retained action membership versus explicitly supplied derived-only trial cells. Missing actions never select a branch."
    permissible_values:
      action_membership:
      derived_metrics:

  MethodTargetLayerId:
    description: The layer whose meaning or behavior a method setting changes.
    permissible_values:
      collector:
      raw_occurrence:
      raw_record:
      acquired_snapshot:
      app_episode:
      app_session:
      screen_bout:
      device_session:
      device_setting_state_interval: {description: "An observed occupancy interval for a device setting such as ringer mode, bounded by state changes; not a device-use session or proof of occupancy during unobserved power-off time. Chang and Tang DOI 10.1145/2785830.2785852, PDF pp. 11–12, 14–15."}
      device_setting_actuation: {description: "Source-controlled behavior that changes a device setting, including action eligibility, calibration guards and triggering conditions; distinct from observed setting-change occurrences, occupancy intervals, intervention-content availability and predictive models. Pielot DOI 10.1145/2632048.2632060, author PDF p. 2, The Silencer Application: per-call acceleration calibration gates conditional temporary ringer muting."}
      pickup_activation:
      participant_day:
      participant_hour: {description: "A supplied participant-specific one-hour period, distinct from a participant day or pooled hour-of-day bucket. CHI2020 Paper36 CCM, DOI 10.1145/3313831.3376163 pp5–6, aggregates each retained emotion independently alongside app-launch counts and total use duration; period endpoints and clocks remain source-specific."}
      participant_record:
      participant_measure:
      study_window:
      analysis_record_set: {description: "Source-defined subset of observed records selected for a named downstream analysis, without changing what the collector acquired or which participants entered the study. Snooze! DOI 10.1145/3229434.3229436 excludes installation-day snooze events from its reported analyses (PDF p. 5); Dismissed! DOI 10.1145/3229434.3229445 excludes immediately attended notifications only from its Sankey flow (PDF p. 3:7)."}
      text_entry_trial: {description: "One source-defined typing-analysis trial, distinct from app/device-use sessions or an analysis subset. Akpinar et al. DOI 10.1145/3577013 p13§4.2 reconstructs action sequences; Rodrigues et al. DOI 10.1145/3491102.3501908 p5§3.1.2 retains derived metrics for first-letter-to-keyboard-closure trials without retaining raw actions."}
      diary_item:
      diary_response:
      derived_feature:
      model:
      notification_item: {description: "A source-defined notification identity that can persist across observed snapshots or repeated snoozes; distinct from a posted callback, an analytic alert proxy, and each item appearance or user action. Clear All DOI 10.1145/3340764.3340765, PDF p. 5; Snooze! DOI 10.1145/3229434.3229436, PDF p. 5. Identity keys remain source-specific and may be undisclosed."}
      notification_alert: {description: "An analytic alert proxy inferred from inbound Android notification callbacks, not an observed perceptible alert. Dismissed! retains the last posted callback in a same-second burst because it usually contains the perceived alert; it does not establish one-to-one callback/alert identity (DOI 10.1145/3229434.3229445, PDF pp. 3:3–3:4). An Annotif annotation candidate is a filtered record, not an alert claim."}
      notification_attendance: {description: "An inferred per-notification seen, checked, consumed, or related attendance state, not direct observation of human reading (Dismissed! DOI 10.1145/3229434.3229445, PDF p. 3:6; My Phone and Me DOI 10.1145/2858036.2858566, accepted manuscript pp. 4–5)."}
      notification_delivery: {description: "Outbound intervention notification scheduling, triggering, and payload selection; not an observed Android notification event."}
      intervention_content_state: {description: "Intervention tool availability and unlock transitions; not a released artifact or measured outcome."}
      call_handling: {description: "Source-controlled incoming-call alert presentation and handling, including accept/decline/repeated-postpone actions, call/conversation transitions and scripted call-arrival or caller-hangup rules. Distinct from intervention-tool availability/unlocking, device-setting actuation, outbound notification delivery and observed notification-record identity. Böhmer et al. DOI 10.1145/2556288.2557066, PDF pp. 3–4, 7–9; source-defined behavior does not establish raw event keys or an executable call-state implementation."}
      outcome:
      released_artifact:

  MethodValueKindId:
    description: Serialization shape of a method setting's source-declared value.
    permissible_values:
      boolean:
      integer:
      float:
      string:
      enumeration:
      duration:
      timestamp:
      time_window:
      list:
      object:
      expression:
      artifact_reference:
      unspecified:

  MethodImplementationStatusId:
    description: Whether Chronicle can execute a source-supported setting without silently approximating it.
    permissible_values:
      native:
      external_executor:
      specification_only:
      refused_missing_signal:
      unresolved:

  MethodExecutionRouteId:
    description: Exact destination through which a source-supported setting participates in replication.
    permissible_values:
      native_option_binding:
      protocol_input:
      native_operator_parameter:
      external_named_executor:
      receipt_conformance:

  DocumentaryExecutionEligibilityId:
    description: Closed execution eligibility for documentary-only provenance receipts.
    permissible_values:
      documentary_only:
        description: The provenance receipt is executable; the referenced artifact is not executed.

  MethodDisclosureStatusId:
    description: Normalized disclosure state; access depth and implementation state remain separate.
    permissible_values:
      declared:
      declared_partial:
      delegated:
      absent:
      not_applicable:
      undetermined:

  MethodApplicabilityStatusId:
    description: Whether a setting is required to reproduce this profile, independent of whether the source disclosed it.
    permissible_values:
      applicable:
      not_applicable:
      undetermined:

  MethodProfileExecutionStatusId:
    description: Whole-profile execution state after every required setting, input, GUI control, receipt, and conformance gate is evaluated.
    permissible_values:
      executable:
      blocked:
      specification_only:

  MethodConfigurationStructureId:
    description: How a source relates multiple method specifications without flattening them into one paper-wide value.
    permissible_values:
      fixed:
      full_factorial:
      one_factor_at_a_time:
      coherent_joint_specifications:
      ablation:
      cross_study_catalog:
      source_declared_axes:
      enumerated_combinations:
      conditional:
      documentary_only:
      evidence_blocked:

  MethodConfigurationSelectionStatusId:
    description: Whether a source configuration selection is exact and source-authorized.
    permissible_values:
      exact:
      incomplete:
      prohibited:

  DiaryTriggerKindId:
    description: What causes a diary prompt or entry opportunity to become due.
    permissible_values:
      scheduled:
      random:
      event_triggered:
      participant_initiated:
      completion_relative:

  SequenceEncodingRuleId:
    description: History-dependent encoding of an ordered sequence, not record selection or deduplication.
    permissible_values:
      first_vs_previously_seen_in_partition:
        description: >-
          Emit one symbol for every ordered occurrence. Emit the first symbol if
          this identity has not occurred earlier in the current partition and the
          repeat symbol otherwise, retaining every repeat and resetting history
          at each partition. Does not specify raw identity extraction or tie order.
          Jones DOI 10.1145/2750858.2807542, physical PDF p.6 (Bath cover=p.1).

  GroupedRecordGroupingBasisId:
    description: How candidate records are grouped inside an already established partition.
    permissible_values:
      declared_group_membership:
        description: Use the upstream declared groups; do not infer undisclosed equality fields.
      field_equality:
        description: Group by equality of the referenced source fields inside the upstream partition.
      raw_string_concatenation:
        description: >-
          Group by equality of the raw strings concatenated in the declared operand
          order, without separator, escaping or type coercion. Only explicitly
          listed absent fields default to the empty string; null is not absence.

  GroupedRecordSelectionRuleId:
    description: Which members of each candidate group survive; not a timestamp or tie-order rule.
    permissible_values:
      FIRST:
        description: Retain the first member in the source-defined order; undisclosed ordering stays unresolved.
      LAST:
        description: Retain the last member in the source-defined order; undisclosed ordering stays unresolved.
      DISCARD_SUMMARY_IF_NON_SUMMARY_EXISTS:
        description: >-
          Discard summary members only when non-summary members coexist, preserving
          all non-summary members. Preserve summary-only groups without imposing
          singleton cardinality or FIRST/LAST reduction. The literal summary marker
          and its extraction are separate source-schema facts, not supplied by this rule.
      RETAIN_SUMMARIES_IF_PRESENT_ELSE_ALL:
        description: >-
          Preserve every summary member when any summary exists, otherwise every
          member, retaining their relative input order. Do not collapse multiple
          summaries or impose FIRST/LAST. Marker extraction is a separate source fact.

  InteractionEventPayloadRoleId:
    description: Payload roles within one captured UI interaction-event record, not independent input channels.
    permissible_values:
      screenshot: {description: Captured visual representation of the UI.}
      view_hierarchy: {description: Captured structural representation of the same UI.}
      gesture: {description: Associated interaction type and location; its presence does not establish correctness.}

  InteractionEventPayloadAssociationId:
    description: Source-declared payload association, without inventing synchronization, matching timeouts or tie handling.
    permissible_values:
      gesture_to_most_recent_paired_snapshot:
        description: Associate the inferred gesture with the most recent event's paired screenshot and view hierarchy.

  SensorControlActionId:
    description: Supplied normalized enable/disable occurrence label, not proof of successful collection or a reconstructed active interval.
    permissible_values:
      enable:
      disable:

  InteractionTraceRecordOriginId:
    description: Epistemic status of supplied normalized records; neither value authenticates an original source export. Reused for interaction traces, notification snapshots/histories and ringer-state intervals.
    permissible_values:
      analyst_constructed_example:
      supplied_normalized_records:

  NotificationEvidenceKindId:
    description: >-
      Distinct supplied notification-history evidence quantities in My Phone and
      Me (2016), accepted manuscript pp.3-4 Figure2/Table1/Data Collection.
      A classification record is not necessarily a directly observed action.
    permissible_values:
      arrival:
      removal:
      phone_unlock:
      corresponding_app_launch:
      notification_bar_click:
      swipe_dismiss:
      assumed_seen:
      seen_latency:
      clicked:
      dismissed:
      context: {description: "A supplied item-linked context value, distinct from a lifecycle/action event or response classification (My Phone and Me p.4 Table1; Content-driven notifications p.3 Table1)."}
      category: {description: "Supplied item-specific information category, not a participant/title multi-label annotation or a category computed on import (Content-driven notifications p.4 Dataset)."}
      response_stage: {description: "Supplied stage-specific response evidence with independent observability; unobservable does not mean no decision or negative response (Reachable pp.3-4 Sections3.1-3.2.1/Figure1)."}
      response_endpoint: {description: "Supplied graded response endpoint, separate from evidence availability: Reachable pp.3-4/p.6 distinguishes null, partial and complete responses. No endpoint is inferred."}
      response_objective_label: {description: "Independently supplied named response-objective label (Reachable p.4/p.6: reachability, engageability, receptivity), not a universal acceptance recode or computed truth table."}
      quantity: {description: "Independently supplied named item-owned quantity, distinct from context, seen latency or response classification. Call to Action (DOI 10.3390/s24082612, pp.7–8) defines Interaction Delay from appearance to removal. Import retains a supplied value/unit/supports without endpoint pairing, arithmetic, rounding or eligibility filtering."}
      action_occurrence: {description: "Separately identified supplied item-owned action with an open action label; repeated postpones and widget moves are distinct from call endings (Interrupted by a Phone Call pp.3,7–8). No raw action code or intent is inferred."}
      posted_callback: {description: "Separately identified supplied NotificationListenerService posted callback, not a logical item arrival or perceived alert (Dismissed! printed pp.3:3–3:4). Populated ingress requires a supplied callback-group owner, not an item history."}

  NotificationResponseObservabilityId:
    description: "Supplied availability of stage observation, independent of the stage's supplied classification or whether the decision occurs (Reachable p.4 Section3.2.1)."
    permissible_values:
      observable: {description: "Stage evidence can be observed; does not itself assert a positive response."}
      unobservable: {description: "Stage observation is unavailable; a supplied inferred annotation is not direct observation or a negative response."}

  NotificationEvidenceRoleId:
    description: Status of a supplied evidence record, not an authenticity, causality or human-attention guarantee.
    permissible_values:
      recorded: {description: Supplied recorded event or source-recorded classification; clicked/dismissed can incorporate inference.}
      inferred: {description: "Explicitly inferred assertion or derived quantity, not directly observed attention or an executed inference here."}

  ParticipantDayObservationKindId:
    description: "Supplied objective period aggregate, subjective response or separately owned collection-run modality availability. Legacy day-named enum retains period observations; collection runs are not calendar periods. None computes aggregation, eligibility or correlations."
    permissible_values:
      objective_aggregate: {description: "Supplied aggregate of objective log data for the referenced participant-period."}
      subjective_response: {description: "Supplied subjective answer about the explicit period; submission time does not identify the period described."}
      modality_availability: {description: "Supplied modality contribution within an explicitly identified collection run (Moodable primary508–517,603–611,685–689). Provided/unavailable are constructed normalized states, not source serializer codes; unavailable does not imply refusal, permission denial, empty history, zero count or model eligibility."}

  NotificationOpeningKindId:
    description: "Distinct opening proxies in In-Situ notifications (DOI 10.1145/2628363.2628364), p.4 Notification Viewed. Neither establishes actual reading or response."
    permissible_values:
      app_opening: {description: "Opening the corresponding application; not necessarily process launch. Membership refers to supplied pending items associated with that app."}
      drawer_opening: {description: "Opening the drawer; membership refers to supplied pending items shown there, not all outstanding items inferred from arrivals."}

  NotificationContextSamplingBoundaryId:
    description: Collection boundary of supplied item-linked context; distinct from a feature's retrospective window or a verified sample timestamp.
    permissible_values:
      arrival: {description: "Collected at arrival (My Phone and Me accepted manuscript p.4 Table1); no exact clock alignment or GPS join is implied."}
      removal: {description: "Collected at removal (My Phone and Me accepted manuscript p.4 Table1); not a response, swipe or seen-time boundary."}
      interruption: {description: "Interruption-relative context alignment, not necessarily a sensor sample exactly at interruption (Reachable p.6 Section4.2: closest screen reading within plus/minus0.5s). No alignment or tie handling runs on import."}
      posting: {description: "Posting-relative feature anchor, not a sensor sample exactly at posting. Beyond Interruptibility (DOI 10.1145/3130956, pp.8,11–12) starts sensor collection 30 seconds earlier and describes independent retrospective windows. Neither sample-time equality nor a reducer is inferred."}
      source_unreported: {description: "The inspected source does not disclose context sampling alignment (Content-driven notifications p.3 Table1/NotifyMe); previous-minute features do not supply it."}

  RingerModeId:
    description: "Normalized ringer-setting vocabulary in Chang and Tang (2015), printed p.12 / physical PDF p.7. Not Android numeric mode codes or a claim of device use."
    permissible_values:
      Normal:
      Vibrate:
      Silent:

  NotificationItemIdentityBasisId:
    description: Distinct Clear All paper and linked-analysis identity definitions; their equivalence is not established.
    permissible_values:
      paper_four_field_combination:
        description: Package, notification ID, notification tag and creation instant (Clear All PDF p.5), represented by supplied normalized tokens.
      linked_code_key_posttime:
        description: Supplied key and str(postTime) tokens used by the pinned release's key + '@' + str(postTime), not a recovered four-field expansion.

  InteractionRedactionSelectionId:
    description: ODIM's distinct device and web selection relations (PDF pp. 8-9, section 4.4); no IoU cutoff is inferred.
    permissible_values:
      selected_ui_element:
      drawn_region_sufficient_iou:

  ScreenshotRedactionEffectId:
    description: Source-declared pixel effects, not evidence that a supplied image is sanitized.
    permissible_values:
      selected_element_pixels_deleted:
      drawn_region_blackened:

  HierarchyRedactionEffectId:
    description: Tagging corresponding text/content and removing qualifying metadata are not interchangeable.
    permissible_values:
      corresponding_text_content_tagged:
      qualifying_element_metadata_removed:

# ============================================================
# CLASSES
# ============================================================
classes:

  # ---- Raw event: THREE entities, not one (D4) ----
  PlatformEventOccurrence:
    description: >-
      The real-world Android lifecycle/system occurrence (an app resuming, the screen
      turning off, a shutdown). This is the thing that happened in the world — NOT the
      logged record and NOT an observation. Deliberately untyped as sosa:Observation.
    slots: [occurrence_instant, event_code]

  UsageEventRecord:
    description: The logged information artifact for one Android usage event. A prov:Entity, not an observation.
    broad_mappings: [prov:Entity]
    slots:
      - event_timestamp_ns
      - event_code
      - app_package_name
      - app_class_name
      - participant_id
      - device_id
      - timezone
      - records_occurrence

  LoggingObservation:
    description: >-
      OPTIONAL. The OS logger's act of observing a device property, modeled only if that
      abstraction is genuinely needed. Do NOT type UsageEventRecord as this.
    broad_mappings: [sosa:Observation]
    slots: [observed_property, result_record]

  InteractionTraceRecord:
    description: >-
      A supplied normalized current interaction trace, not a device-use session,
      prospective method plan or claimed ODIM serialization. Events belong to this
      trace in explicit sequence positions; absent events are not current members.
      ODIM PDF pp. 6-7 sections 4.2-4.3 supports sequential events and manual removal.
      No timestamp-sort predicate, edit journal or payload-byte verification is implied.
    broad_mappings: [prov:Entity]
    slots: [interaction_trace_id, trace_description, method_profile_id, source_work_id, participant_id, trace_record_origin, interaction_events, source_locators]
    slot_usage:
      participant_id: {required: false, description: "Optional supplied trace participant identity. Known identities constrain linked tasks; unknown identity is not inferred from payloads or accounts."}
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      source_locators: {required: true}

  InteractionEventRecord:
    description: >-
      One normalized trace member with paired visual/structural payload identities
      and optional gesture. Positions express current trace order, not timestamps.
      Capture incompleteness and human-detected incorrectness are independent nullable
      assertions; gesture presence implies neither correctness nor a human assessment.
      ODIM PDF pp. 6-7 sections 4.2-4.3. IDs and field names are normalized, not recovered.
    broad_mappings: [prov:Entity]
    slots: [interaction_event_id, screen_description, event_sequence_position, screenshot_artifact_id, hierarchy_artifact_id, gesture_artifact_id, capture_incomplete, human_detected_incorrect, interaction_redactions]

  InteractionRedactionRecord:
    description: >-
      A supplied record of paired effects on its owning event's screenshot and
      hierarchy. ODIM device selection deletes selected-element pixels and tags
      corresponding text/content; web selection blackens a drawn region and removes
      metadata for supplied sufficiently-high-IoU elements (PDF pp. 8-9 section 4.4).
      The actual cutoff, tag spelling, pixel fill and node/pixel correspondence are
      not inferred. Records do not establish effective sanitization of payload bytes.
    broad_mappings: [prov:Entity]
    slots: [redaction_record_id, redaction_selection_basis, selected_element_ids, target_region_id, redacted_screenshot_artifact_id, redacted_hierarchy_artifact_id, screenshot_redaction_effect, hierarchy_redaction_effect, redaction_justification, source_locators]
    slot_usage:
      source_locators: {required: true}

  NotificationDrawerSnapshotRecord:
    description: >-
      One supplied normalized observation of pending Android drawer state, not a
      posted/removed callback, image, usage session or prospective method. Clear All
      PDF pp.4-5. Required empty membership means observed empty; an absent snapshot
      does not. A normalized ID is not the source ascending transmission ID. No
      inter-snapshot arrival, removal, dismissal, continuous residence or fixed
      realized sampling interval is inferred (PDF p.10).
    broad_mappings: [prov:Entity]
    slots: [snapshot_record_id, method_profile_id, source_work_id, device_id, snapshot_record_origin, snapshot_instant, timezone, android_version, device_model, device_product, device_manufacturer, snapshot_transmission_id_token, pending_item_appearances, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      device_id: {required: true}
      source_locators: {required: true}

  NotificationItemAppearanceRecord:
    description: >-
      One pending-item appearance in its owning observed snapshot. Repeated item
      references preserve recurrence without creating callback events. Supplied
      item identity is scoped by profile, device and identity basis; identical
      tokens on another device or basis do not imply the same item. Paper identity
      components and release key/postTime tokens are alternative normalized
      representations, not recovered raw types or automatically equated identities.
      Drawer position is observation-specific and has no assumed ordinal base.
    broad_mappings: [prov:Entity]
    slots: [appearance_record_id, notification_item_id, item_identity_basis, app_package_name, notification_id_json, notification_tag_json, creation_instant, notification_key_token, post_time_identity_token, drawer_position, priority_value_json, clearability_value_json, group_key_compat_value_json, group_summary_compat_value_json, group_key_compat_absent, source_locators]
    slot_usage:
      app_package_name: {required: true}
      source_locators: {required: true}

  NotificationHistoryRecord:
    description: >-
      One supplied normalized item history with independently retained evidence,
      linked subjective responses and supplied acceptance outcomes. My Phone and
      Me (2016), accepted manuscript pp.3-4 and p.8. Identity is local to the
      profile, participant and supplied device (when known), not a recovered raw
      key, Clear All identity definition or a package/title/time match. Inlining
      scopes references to this item; it does not imply exclusive ownership of a
      world occurrence such as an unlock shared by multiple pending items. No
      action matching, timestamp arithmetic, acceptance recode or missing-data
      completion runs during import. Tokens, omissions and supplied order remain.
      Optional original-history references distinguish a temporary snooze prompt
      or retriggered copy from the original item (Snooze DOI
      10.1145/3229434.3229436 pp.3–4 Figure2). Supplied references resolve within
      profile/source/participant/device, including forward references; no
      package/title matching, chronology or five-second realized interval is inferred.
    broad_mappings: [prov:Entity]
    slots: [notification_history_id, method_profile_id, source_work_id, participant_id, device_id, history_record_origin, notification_item_id, app_package_name, notification_title, title_annotation_reference, original_notification_history_reference, notification_evidence, questionnaire_responses, acceptance_records, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      notification_item_id:
        description: Supplied normalized item reference scoped by profile/participant/known device; no Clear All basis or source-key recovery is asserted.
      source_locators: {required: true}

  NotificationCallbackGroupRecord:
    description: >-
      Supplied normalized group of independently recorded notification-posted
      callbacks, with an optional supplied member designated as an analytic
      alert proxy. Dismissed! (DOI 10.1145/3229434.3229445), printed pp.3:3–3:4,
      distinguishes posted-event bursts from usually perceived alerts and retains
      the last posted event after title filtering. The retained callback itself
      is the proxy; no third proxy identity or logical notification-item identity
      is required. Group membership and designation are supplied, not computed.
      Positive proxy references resolve only within this group at ingress;
      omission/null is unknown, not observed perception or a negative alert.
      Ingress admits only recorded posted_callback members, retaining opaque
      times, lexical payloads, local supporting references and supplied order.
      Group IDs are scoped by profile/participant/supplied device, not recovered
      raw keys. No timestamp sorting, LAST selection, title filtering, second
      bucket, grouping partition, tie rule or notification matching is inferred.
      Equal times or payloads do not merge independently identified callbacks.
    broad_mappings: [prov:Entity]
    slots: [callback_group_id, method_profile_id, source_work_id, participant_id, device_id, history_record_origin, notification_evidence, analytic_alert_proxy_reference, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      participant_id: {required: true}
      notification_evidence:
        description: Supplied recorded posted_callback members local to this group; no item owner or automatically reconstructed burst is asserted.
      source_locators: {required: true}

  NotificationTitleAnnotationRecord:
    description: >-
      Supplied participant-relative multi-label annotation of a communication
      title, shared by referenced notification items; not a permanent category,
      globally identified sender or deduplicated notification. Content-driven
      notifications (DOI 10.1145/2750858.2807544), p.4 Dataset and footnote2.
      Normalized identity is scoped by profile and participant, not app/device.
      Labels remain independent of each item's location-resolved category.
      Optional title allows withheld/discarded raw content (p.4 privacy passage);
      omission/null is not an invented title hash. No matching, deduplication,
      normalization, GPS join or category resolution runs during import.
    broad_mappings: [prov:Entity]
    slots: [title_annotation_id, method_profile_id, source_work_id, participant_id, annotation_record_origin, notification_title, sender_relationship_labels, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      source_locators: {required: true}

  ParticipantDayObservationRecord:
    description: >-
      Supplied populated objective aggregate, subjective response or collection-run modality availability owned by a
      profile/work/participant, an optional explicitly supplied device, and exactly one
      supplied day, specific-hour, night or collection-run identity. Energy Drain2015
      §3.4 distinguishes daily energy per device; device identity is never inferred
      from participant identity. Same- and cross-period supports stay within the
      supplied device owner (or the unknown-device owner when omitted/null).
      The class and day_* transport names are retained for compatibility; an hour
      or night is never stored in referenced_day_token. CHI2020 Paper36 p5 CCM separately
      aggregates each retained emotion, application launches and use duration per
      participant per one-hour period. Hour tokens identify particular periods,
      not recurring hour-of-day buckets, and do not establish their endpoints.
      In-Situ notifications pp.3-4 asks about the prior day; p.6 associates daily
      objective notification logs with subjective responses about that same day.
      No notification-item identity is required. Each period token is opaque, not
      an inferred calendar date, cutoff, timezone or raw study join key. Values,
      units, categories and optional question wording are supplied independently;
      absence/null is not zero. Subjective supports point only to objective
      records in the same owner/period kind/token unless an explicit cross-period
      reference identifies a different target period and the supplied relationship.
      Murnane2016 pp3,7–8 distinguishes prior-night sleep, following-day use and
      event counts during that night. No night/day identity or adjacency is inferred.
      Moodable primary508–517,603–611,685–689 separately permits any subset of
      contributed modalities. Run-owned modality availability uses its local method
      definition, not a day or classifier campaign; run tokens do not assert repeated
      original participation. Unavailable does not infer why data were not contributed.
      Import neither aggregates, joins timestamps,
      schedules prompts nor computes correlations. Normalized origin does not
      authenticate original participant rows or recover the full instrument.
    broad_mappings: [prov:Entity]
    slots: [day_observation_id, method_profile_id, source_work_id, participant_id, device_id, referenced_day_token, referenced_hour_token, referenced_night_token, referenced_run_token, method_setting_reference, day_record_origin, day_observation_kind, observed_property, observation_category, app_package_name, day_observation_value_json, evidence_unit, questionnaire_item_label, aggregate_observation_references, cross_period_aggregate_references, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      participant_id: {required: true}
      method_setting_reference: {required: false, description: "Local quality-control definition required only for collection-run modality availability; absent on period aggregates/responses."}
      observed_property: {required: true, description: "Supplied measured quantity or subjective-property label; not necessarily verbatim question wording or a raw field name."}
      app_package_name: {required: false, description: "Optional supplied package identity for per-app period observations (Screenomics2024 primary236–257; Energy Drain2015 §4). Independent of observation_category and supplied device; omitted/null identity never implies a category-wide total or a UID/package join, and overlapping categories are not collapsed."}
      questionnaire_item_label: {required: false, description: "Optional supplied wording on a subjective response only; omission/null does not recover undisclosed wording."}
      source_locators: {required: true}
    rules:
      - preconditions:
          slot_conditions:
            day_observation_id: {value_presence: PRESENT}
        postconditions:
          exactly_one_of:
            - slot_conditions:
                referenced_day_token: {required: true, pattern: '\S'}
                referenced_hour_token: {value_presence: ABSENT}
                referenced_night_token: {value_presence: ABSENT}
                referenced_run_token: {value_presence: ABSENT}
                method_setting_reference: {value_presence: ABSENT}
                day_observation_kind: {pattern: '^(objective_aggregate|subjective_response)$'}
            - slot_conditions:
                referenced_hour_token: {required: true, pattern: '\S'}
                referenced_day_token: {value_presence: ABSENT}
                referenced_night_token: {value_presence: ABSENT}
                referenced_run_token: {value_presence: ABSENT}
                method_setting_reference: {value_presence: ABSENT}
                day_observation_kind: {pattern: '^(objective_aggregate|subjective_response)$'}
            - slot_conditions:
                referenced_night_token: {required: true, pattern: '\S'}
                referenced_day_token: {value_presence: ABSENT}
                referenced_hour_token: {value_presence: ABSENT}
                referenced_run_token: {value_presence: ABSENT}
                method_setting_reference: {value_presence: ABSENT}
                day_observation_kind: {pattern: '^(objective_aggregate|subjective_response)$'}
            - slot_conditions:
                referenced_run_token: {required: true, pattern: '\S'}
                method_setting_reference: {required: true, pattern: '\S'}
                referenced_day_token: {value_presence: ABSENT}
                referenced_hour_token: {value_presence: ABSENT}
                referenced_night_token: {value_presence: ABSENT}
                day_observation_kind: {equals_string: modality_availability}

  CrossPeriodAggregateReference:
    description: >-
      Explicit support/comparison from a subjective participant-period observation
      to an objective aggregate in a different supplied period, within the same
      profile/work/participant. The target observation identity and exact period
      kind/token both resolve; the relationship label and provenance preserve why
      the records are compared, not a computed calendar adjacency or causal claim.
      Murnane2016 p7 compares prior-night reported sleep with following-day use;
      p8 same-night counts use the separate existing same-period reference.
    broad_mappings: [prov:Entity]
    slots: [day_observation_id, referenced_day_token, referenced_hour_token, referenced_night_token, relationship_label, source_locators]
    slot_usage:
      relationship_label: {required: true, pattern: '\S'}
      source_locators: {required: true}
    rules:
      - preconditions:
          slot_conditions:
            day_observation_id: {value_presence: PRESENT}
        postconditions:
          exactly_one_of:
            - slot_conditions:
                referenced_day_token: {required: true, pattern: '\S'}
                referenced_hour_token: {value_presence: ABSENT}
                referenced_night_token: {value_presence: ABSENT}
            - slot_conditions:
                referenced_hour_token: {required: true, pattern: '\S'}
                referenced_day_token: {value_presence: ABSENT}
                referenced_night_token: {value_presence: ABSENT}
            - slot_conditions:
                referenced_night_token: {required: true, pattern: '\S'}
                referenced_day_token: {value_presence: ABSENT}
                referenced_hour_token: {value_presence: ABSENT}

  NotificationOpeningOccurrenceRecord:
    description: >-
      One supplied normalized opening occurrence shared by item-specific inferred
      views. In-Situ notifications (DOI 10.1145/2628363.2628364), p.4 Notification
      Viewed. Identity is scoped by profile/participant/supplied device, never
      inferred from equal app/time tokens. Optional membership retains supplied
      pending app items or shown drawer items; omission/null is unknown and an
      empty list is explicitly empty. Positive links require a known common
      device at ingress. No pending queue, matching, time conversion or inference
      runs. Normalized IDs and relationships do not claim recovered source keys
      or original rows. Opening is not observed reading, dismissal or response.
    broad_mappings: [prov:Entity]
    slots: [opening_occurrence_id, method_profile_id, source_work_id, participant_id, device_id, opening_record_origin, opening_kind, occurrence_instant, app_package_name, pending_history_references, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      occurrence_instant: {description: "Supplied textual opening time; omission/null is unknown. No verified epoch, precision, timezone, or equality with inferred view time."}
      app_package_name: {description: "Optional supplied app identity for an application opening; null/omission stays unknown. Drawer membership does not require app equality."}
      source_locators: {required: true}

  NotificationEvidenceRecord:
    description: >-
      One owner-local event, classification or inferred quantity with independent
      provenance and optional local supporting evidence. Arrival, removal,
      unlock-derived assumed-seen, already-unlocked zero seen latency and clicked
      status are not interchangeable (My Phone and Me pp.3-4). Removal alone is
      not swipe, rejected content or accepted outcome; clicked may include app
      launch. Missing time/basis/value means not supplied, not a negative event.
      An instant is a supplied representation, not a verified epoch/precision.
      Context evidence requires a property label and independent collection
      boundary at normalized ingress. My Phone and Me p.4 Table1 records
      arrival/removal context; Content-driven notifications p.3 Table1 has
      unknown sampling alignment and separately described last-minute features.
      Null/omitted value and optional lookback/unit/time remain unknown; no
      context reducer, alert/ringer equivalence or sensor/location join runs.
      Optional shared-opening reference supports an inferred seen/latency only
      with positively supplied owner-local pending membership; it does not
      replace item-local supporting references or compute the view.
      Response stages carry independent observability and open stage identifiers:
      Reachable pp.3-4 allows variable/merged decisions, not a fixed D1-D3 enum.
      Unobservable is neither a negative response nor a prohibition on supplied
      inferred annotations. Endpoint and named objective labels are independent;
      string-valued null endpoint is not an unknown JSON null or omitted value.
      Import does not infer stages, labels, chronological order or truth tables.
      Item-owned action occurrences retain open source-qualified labels and an
      optional supplied ordinal, distinct from array position, event time and
      supporting references. Interrupted by a Phone Call pp.3,7–8 distinguishes
      repeated postpones, widget moves and accepted/declined/unanswered endings.
      Non-null ordinals are unique among actions in one history at ingress;
      neither zero-based indexing, contiguity nor complete capture is asserted.
      No action sorting, time conversion, raw-key recovery or outcome recode runs.
      The callback-group carrier reuses only the recorded posted_callback variant
      and its lexical time/value/basis/supports; it does not assign item ownership
      or action, context, response, opening or attention semantics to a callback.
      Named quantities retain independent lexical values, units and local
      supporting events. In Call to Action pp.7–8, IDL is an appearance-to-removal
      difference, not seen latency or observed attention; neither endpoint
      arithmetic nor positive/one-day analysis filtering runs during import.
    broad_mappings: [prov:Entity]
    slots: [evidence_record_id, evidence_kind, evidence_role, evidence_instant, evidence_value_json, evidence_unit, evidence_basis, evidence_references, opening_occurrence_reference, observed_property, context_sampling_boundary, lookback, response_stage_id, response_observability, action_kind, occurrence_ordinal, source_locators]
    slot_usage:
      observed_property:
        description: Supplied context property, item-owned quantity name or independent response-objective name; required for those evidence kinds at ingress, not a computed value or recovered raw key.
      lookback:
        description: Supplied retrospective context-feature scope independent of collection boundary; last one minute in Content-driven notifications p.3 Table1 does not disclose a reducer or timestamp anchor.
      source_locators: {required: true}

  NotificationQuestionnaireResponseRecord:
    description: >-
      A supplied subjective answer associated with the owning item, not the
      prospective DiaryItem instrument, an action timestamp or a population-wide
      observation. My Phone and Me p.4 Table2/Data Collection and p.8. The item
      label and lexical JSON answer do not claim recovered raw questionnaire keys.
      A handling self-report need not agree with a recorded final status.
    broad_mappings: [prov:Entity]
    slots: [questionnaire_response_id, questionnaire_item_label, response_value_json, source_locators]
    slot_usage:
      source_locators: {required: true}

  NotificationAcceptanceRecord:
    description: >-
      Independently supplied binary acceptance outcome, separate from clicked or
      dismissed evidence. My Phone and Me p.8 recodes a dismissal as accepted
      when its handling answer says no further action was required; the clicked
      branch need not have that answer. Import preserves supplied references and
      code without applying this formula, enrolling an item in the questionnaire
      analysis, or filling an absent response/outcome with zero.
    broad_mappings: [prov:Entity]
    slots: [acceptance_record_id, acceptance_code, evidence_references, questionnaire_response_references, source_locators]
    slot_usage:
      evidence_references: {required: true}
      source_locators: {required: true}

  # ---- Time (OWL-Time) ----
  UsageInterval:
    description: A phenomenon-time interval a usage assertion denotes. A time:ProperInterval.
    broad_mappings: [time:ProperInterval]
    slots: [start_instant, end_instant, duration_seconds, start_status, end_status]

  DeviceUseSessionRecord:
    description: >-
      Supplied normalized device-use session with independently identified
      questionnaire answers and definition-specific labels. Rabbit Hole (2023)
      physical p7 Section3.1.1 starts at ON_USERPRESENT and ends at OFF_LOCKED,
      OFF_UNLOCKED or SHUTDOWN; this is not necessarily unlock-to-lock, one app
      episode or a screen/keyguard observation. Physical pp8-11 associate ESM
      answers and original classifications with sessions; pp21-22 separately
      revise the definition. Source definition references and membership are
      supplied, not recovered raw joins. No constructor, scheduling, eligibility,
      scoring, relabeling or inference of missing responses runs during import.
      Oulasvirta et al. DOI10.1007/s00779-011-0412-2 printed p106 instead
      preserves separate opener, closer and action-membership definitions in
      the existing SessionConstructionPolicy. Its supplied record references
      the opener in one unambiguous profile-local policy; activation and next
      idle/lock phrases remain intact, not translated into Rabbit state codes.
      Approximate sampled inputs (p108) do not establish exact idle predicates,
      sample-to-boundary timestamp assignment or repaired action membership.
      Supplied session actions retain all-user-action membership and app-launch
      order independently of equal times (pp106–107). Hush Section3.2/6.1 also
      distinguishes alternating screen-on/off intervals with app activity and
      foreground membership in an explicitly supplied immediately following
      interval. Neither the successor nor app membership is inferred from times;
      missing membership cannot be classified as no activity. BFC is not computed.
      Jones DOI10.1145/2750858.2807542 physicalp6 preserves its scalar unlock/lock
      constructor and session-local repeated application launches with supplied
      F/B roles. Session-owned supplied quantities and labels remain distinct
      from actions and intervals; import computes neither ratios nor strategies.
      APNOMS2011 SectionIII-C independently supplies voice/3G/Wi-Fi sessions,
      AC/USB charging intervals and battery-change intervals. These are distinct
      source-defined intervals, not unlock-to-lock use; no raw boundary codes,
      charging/change equivalence or snapshot membership is inferred.
      Mathur2016 separately owns the four-member SessionLogger policy (screen-on,
      screen-off bounds, unlock inclusion gate, inclusive five-second merge and
      its provenance) versus
      QuantApp supplied sessions at screen-on/context start with unknown end.
      Hiniker2016 owns ordered app windows with lock/dark or state-conditioned
      system/launcher inactivity delimiters; it does not impose universal inactivity.
      Tapping2024 separately retains phone unlock-to-lock ownership, ordered
      foreground-change app periods and timestamped taps. Regret2025 instead
      uses screen-on/off parents and app-local intention, daily regret and
      screenshot context. Anatomy2016 keeps local key-entry attempts and separate
      code versus dismissal outcomes; supplied parent/action links are not a
      constructor, timestamp repair or raw join.
      AngryBirds2011 owns higher-order application chains separated by standby
      longer than thirty seconds, distinct from independent sampled app-or-epsilon
      states and individual foreground episodes. No sample/event construction runs.
    broad_mappings: [prov:Entity]
    slots: [device_use_session_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, method_setting_reference, denotes_interval, start_condition, end_condition, session_questionnaire_responses, session_labels, session_actions, session_quantities, following_device_use_session_reference, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      denotes_interval: {required: false, inlined: true}
      method_setting_reference: {description: "Compatible combined constructor, flat alternating-screen definition or opener of one complete separate-definition policy; references do not execute session construction."}
      source_locators: {required: true}

  DeviceSessionQuestionnaireResponseRecord:
    description: >-
      Supplied answer identity local to the containing device-use session,
      referencing a compatible instrument in its profile. Rabbit Hole physical
      pp8-9 Figure3 distinguishes intention, completion, deviation, regret and
      perception questions without establishing complete numeric slider codes.
      Repeated equal answers remain separate. Optional wording and lexical
      value do not imply a prompt, completion, observed negative or raw key.
    broad_mappings: [prov:Entity]
    slots: [questionnaire_response_id, questionnaire_setting_reference, observed_property, questionnaire_item_label, response_value_json, support_task_action_references, source_locators]
    slot_usage:
      support_task_action_references: {description: "Optional explicitly supplied local foreground-period support for Regret2025 intention/daily-regret answers. At most one known visit; null/omission is unknown and [] explicitly empty. Repeated same-app visits remain distinct. No survey eligibility, timing or last-visit selection is inferred."}
      questionnaire_response_id: {description: "Supplied answer identity unique within its owning device-use session."}
      questionnaire_setting_reference: {description: "Compatible local instrument definition, not a schedule, suppression rule or invented numeric recode."}
      observed_property: {required: true, description: "Supplied measure designation, distinct from optional exact item wording."}
      questionnaire_item_label: {required: false}
      response_value_json: {required: false}
      source_locators: {required: true}

  DeviceSessionLabelRecord:
    description: >-
      Independently supplied classification local to a device-use session
      or tracked-app interruption,
      referencing its applicable profile-owned label definition. Rabbit Hole
      physical p11 original intention-deviation and regret classifications are
      not the revised RH/negative-RH definitions at pp21-22 Figure14/Section6.
      Supplied lexical labels and local answer supports remain separate; missing
      is not negative. Import does not apply formulas, recover thresholds or
      fabricate an absent-answer truth table or original-to-revised mapping.
      Jones physicalp8/Table3 separately supplies whole-session strategy classes
      bound to the profile's analysis/derived-feature pattern definitions.
      Those labels are not action-local F/B roles; no regex execution is implied.
      APNOMS2011 also supplies network-modality and charging-power-source labels;
      those interval descriptors are not questionnaire-derived classifications.
    broad_mappings: [prov:Entity]
    slots: [label_record_id, label_setting_reference, observed_property, label_value_json, support_task_action_references, questionnaire_response_references, source_locators]
    slot_usage:
      observed_property: {required: true, description: "Supplied designation of the independent session classification or source-defined app-period classification; whole-session and app-period scopes are not interchangeable."}
      support_task_action_references: {description: "Optional supplied action/foreground-period IDs resolving only within the containing session. Repeated visits to the same app remain distinct by local action ID; null/omission is unknown support, [] explicitly empty. No EEG join, app matching, classifier or weighted vote runs."}
      questionnaire_response_references: {description: "Supplied supporting answer IDs resolving only within the containing device-use session; null/omission is unknown support, [] explicitly empty."}
      source_locators: {required: true}

  SessionQuantityRecord:
    is_a: SampledQuantityRecord
    description: >-
      Independently identified supplied quantity local to one device-use or
      tracked-app session, linked to its source feature or record-field definition.
      Jones physicalpp6,8 distinguishes
      session-string length and B/length from physical duration and strategy.
      Rabbit Hole physicalp11 Section4.1 distinguishes per-app and per-category
      counts/time/interactions from session-wide features. Explicit scope survives
      unknown app/category identity; missing identity is not a session total.
      Qualifiers preserve absolute counts, time-relative frequencies, supplied
      state and normalization variants. Figure7 seconds/session/minute and
      Figure11 normalized-by-session-length do not establish a universal fraction,
      percentage, formula or missing-unit conversion. No aggregation, app join,
      timestamp inference, normalization or repair runs during import.
      APNOMS2011 Figure7 supplies separate start/end battery levels in percent
      for charging or battery-change intervals, not computed energy consumption.
      Meaningful (3191754) released Event.java103-117 separately preserves four
      millisecond duration fields, including lexical NA; sample duration is not
      silently added to duration_total. WhyStop net length excludes suspending
      interruption time but supplies no overlap/union algorithm. Values remain
      independent rather than being derived from containing intervals.
      Chang printedpp9,12 additionally preserves each ringer-occupancy-local
      attending-action gap with independently supplied ordered endpoints, its
      ordinal attendance category and its separate supplied mean. No arithmetic,
      within-boundary selection, chronology or completeness is asserted.
    slots: [quantity_record_id, quantity_setting_reference, quantity_scope, app_identifier, observation_category, support_task_action_references, questionnaire_response_references, start_action_reference, end_action_reference, source_locators]
    slot_usage:
      app_identifier: {required: false}
      support_task_action_references: {description: "Optional supplied action/foreground-period IDs resolving only within the containing session, not app identity or a derived join. A→B→A retains separate visits; supports do not execute raw-to-period construction, clipping or feature calculation."}
      questionnaire_response_references: {description: "Optional supplied answer IDs resolving only within the containing session. Hiniker2016 Table4 retains each response-specific context row independently of unresolved displayed/collected/submitted timing; this relation is not a clock anchor. Null/omission is unknown support, [] explicitly empty."}
      source_locators: {required: true}

  ScreenshotSessionRecord:
    description: >-
      Supplied normalized screenshot container with local image identities and
      annotations. PULSE phone-use sessions are not app episodes or an
      unlock-to-lock interval. Regret2025 pp5–8 instead supplies foreground-app
      screenshot ownership, its definition and optional explicit screen-parent/
      app-period action links. App and parent identities are not inferred from
      images, times or equal values. PULSE
      (2025), printed p.202 Section2.2 and p.203 Figure1b/c, groups screenshots into
      continuous phone-use sessions and applies labels to selected first/last
      screenshot ranges. Capture or upload membership may be incomplete (p.203
      Section2.3.1); no session construction, timestamp conversion or label
      propagation runs during import. IDs are normalized, not recovered raw keys.
    broad_mappings: [prov:Entity]
    slots: [screenshot_session_id, method_profile_id, source_work_id, participant_id, device_id, session_record_origin, method_setting_reference, app_identifier, device_use_session_reference, session_action_reference, denotes_interval, screenshots, screenshot_range_annotations, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      denotes_interval: {required: false, inlined: true}
      method_setting_reference: {required: false, description: "Source-compatible local foreground-app screenshot-container definition for Regret2025, not a PULSE constructor or inferred screenshot grouping."}
      app_identifier: {required: false}
      source_locators: {required: true}

  SessionScreenshotRecord:
    description: >-
      One supplied screenshot identity local to its owning source-defined
      screenshot container (PULSE phone use or Regret foreground-app use).
      Optional supplied sequence position, capture-time token and existing
      ArtifactRef identity remain independent; equal times or shared payloads
      do not collapse captures. PULSE printed pp.202-203 Section2.2 describes
      chronological display and visual stacking, not underlying row deletion.
      Missing payload metadata does not require fabricated size/digest/hierarchy.
      No image bytes, raw serialization or complete capture stream is verified.
    broad_mappings: [prov:Entity]
    slots: [screenshot_record_id, screenshot_sequence_position, screenshot_instant, screenshot_artifact_id, source_locators]
    slot_usage:
      screenshot_artifact_id: {required: false}
      source_locators: {required: true}

  ScreenshotRangeAnnotationRecord:
    description: >-
      Supplied annotation of a first/last screenshot range within the owning
      phone-use session, not whole-session intent or a populated app-feature
      selection. PULSE printed p.202 Section2.2 and p.203 Figure1b/c allows labels
      in any order and study-specific dimensions. Positive endpoint references
      resolve only within that session; null/omission retains unknown endpoints.
      The open lexical label object preserves partial/unknown dimensions rather
      than enforcing the later analysis completeness filter (p.204 Section3.3).
      Endpoint inclusion, overlap/relabel handling and stack expansion remain
      unknown. No range membership, duration or missing labels are inferred.
      Regret2025 pp6–8 additionally uses source-bound single-image descriptions,
      classifier category/justification, independent human categories and
      consensus. Optional supplied assessor identity is not the participant.
      Description context has at most one known prior image; classification and
      human context at most four within the same app-owned container. Partial
      supports do not fill missing images or execute models/consensus.
    broad_mappings: [prov:Entity]
    slots: [range_annotation_id, method_setting_reference, assessor_id, support_screenshot_references, first_screenshot_reference, last_screenshot_reference, range_label_values_json, source_locators]
    slot_usage:
      method_setting_reference: {required: false, description: "Optional source-qualified local screenshot-analysis definition; distinct descriptions, model judgments, human judgments and consensus are not collapsed."}
      assessor_id: {description: "Optional opaque supplied human/model/consensus assessor, distinct from the assessed participant and independent of other judgments; no rater identity or agreement is inferred."}
      source_locators: {required: true}

  AppInterruptionSessionRecord:
    description: >-
      Supplied tracked-app session containing separately identified interruption
      intervals, not continuous app use or unlock-to-lock device use. Why Did
      you Stop (2021), author-copy physical p.3 Section3.2 and p.7 Section4.4.2,
      records each interruption individually within a learning session. Figure1
      p.4 illustrates independent session/interruption times and app labels.
      Meaningful (3191754) primary279-284 uses one before/during/after sampling
      timing per app instance, not three waves within every instance. Supplied
      session answers, optional interruption references and independent
      quantities retain their own definitions. Package identity is independent
      of an optional printed app label. IDs and pairing are normalized, not
      recovered raw serialization. Unknown membership is not observed zero.
      No timer, constructor, return-to-learning, interruption cause, scoring,
      last-interruption selection, ESQ eligibility or duration is inferred.
    broad_mappings: [prov:Entity]
    slots: [app_interruption_session_id, method_profile_id, source_work_id, participant_id, device_id, app_name, app_package_name, session_record_origin, denotes_interval, interruptions, session_questionnaire_responses, session_quantities, session_labels, session_actions, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      app_name: {required: false}
      app_package_name: {required: false}
      denotes_interval: {required: true, inlined: true}
      session_questionnaire_responses: {range: AppSessionQuestionnaireResponseRecord}
      source_locators: {required: true}

  AppSessionQuestionnaireResponseRecord:
    is_a: TaskQuestionnaireResponseRecord
    description: >-
      Supplied answer identity local to one tracked-app session, using the
      existing subjective-answer slots and compatible local source definition.
      Optional response-role labels retain before/during/after or another
      supplied designation without reconstructing sampling chronology.
      Meaningful released Sample.java527-554 cancels only the current prompt:
      earlier answers survive, current NO_RESPONSE differs from later NA.
      WhyStop ESQ answers may be partial; no answer is mandatory. An optional
      supplied interruption reference resolves only within the containing
      session and does not infer the last interruption, cause or outcome.
    slots: [response_role_label, interruption_record_reference]
    slot_usage:
      questionnaire_response_id: {required: true, description: "Supplied answer identity unique within its owning tracked-app session."}
      questionnaire_item_label: {required: false}
      response_value_json: {required: false}
      source_locators: {required: true}

  SessionInterruptionRecord:
    description: >-
      One supplied interruption identity local to its containing app session,
      independent of label or equal time tokens. Why Did you Stop physical p.4
      Figure1 prints APP_SWITCH and a visited-app label list containing repeated
      Google. These labels are not package IDs, classified causes, complete
      app histories or independently timed visits. Preserve supplied order and
      optional/null/empty descriptors; no sorting, deduplication, containment
      arithmetic, resumption or terminating/suspending outcome is inferred.
    broad_mappings: [prov:Entity]
    slots: [interruption_record_id, denotes_interval, interruption_type, interruption_classifications, notification_history_references, visited_app_labels, source_locators]
    slot_usage:
      denotes_interval: {required: true, inlined: true}
      source_locators: {required: true}

  SessionAssociationDatabaseRecord:
    description: >-
      Supplied session-transaction database and its mined rules scoped to a
      profile, participant and analysis run. Habitual Smartphone Use (3447991),
      physical pp10-12 sections3.2.2-3.2.3, mines each participant's cluster
      separately; pp20-21 section5 pools Android Socialize sessions without
      clustering. Group labels are not globally unique or recovered raw keys.
      Supplied memberships/results do not execute mining or establish exact
      collector, clock, platform, context join or original-row provenance.
    broad_mappings: [prov:Entity]
    slots: [association_database_id, analysis_run_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, association_group_label, grouping_setting_reference, transaction_definition_setting_reference, session_transactions, association_rules, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      participant_id: {required: true}
      source_locators: {required: true}

  SessionTransactionRecord:
    description: >-
      A supplied transaction for a separately identified phone-use session in
      its containing database. Habitual physical p12 section3.2.3 and p14
      Figure5 distinguish binary app/context presence, explicit absence and
      undisclosed columns. This is not the preceding duration-weighted TF-IDF
      Bag-of-Apps representation. Unknown bounds/membership stay unknown; no
      missing item becomes zero. The illustrated Session i is not linked to
      U34 or Table5's clusters by the source.
    broad_mappings: [prov:Entity]
    slots: [session_transaction_id, source_session_id, denotes_interval, present_app_items, absent_app_items, present_context_items, absent_context_items, source_locators]
    slot_usage:
      denotes_interval: {required: false, inlined: true}
      source_locators: {required: true}

  AssociationRuleRecord:
    description: >-
      Supplied rule within its containing mining database, with independently
      supplied antecedent/consequent app and contextual itemsets. Habitual
      physical p17 Table5 R6 is WhatsApp=>Instagram for U34's cluster3; reversing
      the sides changes the rule without changing combined app membership.
      Printed quality values and category/type annotations remain lexical JSON,
      not calculated values, temporal order, causes or execution receipts.
    broad_mappings: [prov:Entity]
    slots: [association_rule_id, antecedent_app_items, antecedent_context_items, consequent_app_items, consequent_context_items, rule_quality_values_json, rule_annotation_json, source_locators]
    slot_usage:
      source_locators: {required: true}

  AssociationContextItemRecord:
    description: >-
      Context item value with an optional supplied dimension. Habitual physical
      p14 Figure5 distinguishes notification, period, time, location and
      activity from app labels. Missing dimension is not inferred from a label;
      equal labels in different dimensions remain distinct. Array order is
      preserved as supplied, never interpreted as chronology.
    slots: [context_item_label, context_dimension]

  TaskOccurrenceRecord:
    description: >-
      Supplied normalized occurrence of a task, potentially spanning several apps
      and screen/notification/unlock actions, not one app session or paired visual
      trace. S-ADL (2024), physical pp8 Figure2 and25 Table11, supplies expected
      scripts and subtask roles; p21 AppendixA.1 and p23 Table6 supply independent
      content-based criteria. Existing source-setting definitions are referenced,
      not copied. IDs, role assignments, assessments and links are supplied
      normalization, not recovered source rows or an executed script matcher.
      Supplied answers may concern the owning task/session, as in ACII2019
      text-entry-session emotion reports. A separately identified questionnaire
      completion can represent condition-level administration (Alt2012 SUS;
      Böhmer2014 post-condition TLX). It does not create a browser, call or
      navigation-trial join or imply task-correctness assessment. Anatomy2016
      additionally admits explicitly supplied authentication-task links to one
      parent screen session and one local attempt action. Code success, retry,
      screen-off abort and keyguard dismissal remain independent supplied
      evidence; no finite-state execution or timestamp scheduling repair runs.
      DynamicSecurity layout874–896 separates the answering participant from an
      optional supplied history subject. Shared question cases span responders;
      equal wording does not establish identity and role-varying wording does
      not contradict an explicitly supplied shared case.
    broad_mappings: [prov:Entity]
    slots: [task_occurrence_id, method_profile_id, source_work_id, participant_id, device_id, assessor_id, history_subject_participant_id, record_origin, task_label, referenced_day_token, device_use_session_reference, session_action_reference, interaction_trace_reference, expected_script_setting_reference, denotes_interval, task_actions, criterion_assessments, task_questionnaire_responses, task_observation_windows, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      source_work_id: {required: true}
      participant_id: {required: true}
      referenced_day_token:
        description: >-
          Optional supplied response/aggregation day, distinct from the response
          instant (Digital Nightlife released timeframe R:22 and combination
          R:89–94). Does not assert calendar containment of every owned window,
          derive a date from an action time, or merge independently identified tasks.
      denotes_interval: {required: false, inlined: true}
      source_locators: {required: true}

  TaskActionRecord:
    description: >-
      Individually supplied member of its containing task or device-use session
      with optional action label, app identity, time, role labels and lexical
      content. S-ADL physical p25 Table11
      distinguishes observed app/screen actions from extracted subtask roles.
      Missing/extra/tied-event handling and the automatic constructor are not
      inferred. Same labels or times do not merge members or create order.
      Supplied array order remains intact. Oulasvirta pp106–107 distinguishes
      all-user-action session membership from app-launch order; app identity
      is independently supplied, never extracted from labels. Hush Section6.1
      distinguishes active-in-off from foreground-in-following-on membership.
    broad_mappings: [prov:Entity]
    slots: [task_action_id, app_identifier, action_label, assigned_role_labels, denotes_interval, action_content_json, source_locators]
    slot_usage:
      app_identifier: {required: false}
      denotes_interval: {required: false, inlined: true}
      source_locators: {required: true}

  TaskCriterionAssessmentRecord:
    description: >-
      Independently supplied assessment of a designated criterion for the owning
      task. S-ADL physical p23 Table6 has separate registration-number and spoken
      information criteria. Supplied content evidence, result and supporting task
      actions remain distinct. A definition reference does not recover the actual
      stimulus or demonstrate automated correctness. No scoring runs at import.
      Password Entry Usability (2012) pp4–6 also supplies performance criteria:
      first-to-last-character entry time in milliseconds, guess-to-target
      Levenshtein distance and participant/password-local best-attempt selection.
      A supplied value and supporting action identities do not execute those
      calculations or make the later Send action an entry-time endpoint.
      Murnane2016 p4 supplies participant-baseline-relative PVT performance;
      its record does not recover trial granularity or a percentage convention.
      Source-defined questionnaire summaries, including affect means and PHQ-9
      scores/classifications, are assessments rather than individual answers.
      Supplied summaries remain independent of item values; no scoring,
      classification or missing-item policy is inferred during import.
    broad_mappings: [prov:Entity]
    slots: [criterion_assessment_id, criterion_setting_reference, criterion_label, assessment_value_json, assessment_content_json, support_task_action_references, support_criterion_assessment_references, source_locators]
    slot_usage:
      source_locators: {required: true}

  TaskQuestionnaireResponseRecord:
    description: >-
      Supplied subjective response concerning its owning task/session or a
      separately identified questionnaire completion, independently referencing
      the owning profile's disclosed categorical answers, response scale or
      instrument definition. Oh App (2013) physical p2 Procedure and p3 Self-Assessment
      distinguish completing the post-study instrument from logged navigation
      and from issuing its invitation. This is not task correctness, a
      navigation-trial link or a reconstructed questionnaire row. Property
      designation is not exact question wording; endpoints do not supply the
      complete offered labels, numeric codes or missing-response policy.
      ACII2019 explicit No Response is a supplied skip, not absent membership
      or a fifth modeled emotion. Alt2012 physical p3 specifies SUS per
      condition without administered items/endpoints; Böhmer2014 p5 specifies
      post-condition dimensions and a 20-point scale without anchors. These
      omissions do not justify invented instrument details. Import preserves
      lexical answers without scoring or recoding.
    broad_mappings: [prov:Entity]
    slots: [questionnaire_response_id, questionnaire_setting_reference, observed_property, questionnaire_item_label, response_value_json, assessment_case_token, support_task_action_references, source_locators]
    slot_usage:
      support_task_action_references: {description: "Optional explicitly supplied owner-local actions: Chang retrospective event supports or DynamicSecurity answer-local evidence/confidence supports, resolving only within the containing TaskOccurrence. The preceding24h end-of-day event selection horizon remains a method definition; these links do not turn an event into a24h window or infer prompt time/selection. Shared answer supports do not compute confidence or recover missing case identities. Null/omission is unknown, [] explicitly empty; unrelated response carriers reject this field unless their own ingress validates it."}
      questionnaire_response_id: {required: true, description: "Supplied answer identity unique within the owning task; repeated labels or values do not merge answers."}
      observed_property: {required: true, description: "Supplied subjective measure designation, not necessarily exact question wording."}
      questionnaire_item_label: {required: false}
      response_value_json: {required: false}
      source_locators: {required: true}

  TaskObservationWindowRecord:
    description: >-
      Supplied observation/summary window anchored to an explicitly identified
      action in its containing task or questionnaire completion. Personality
      states (2020) printed697 ends its preceding30-minute window at the first
      photographic-affect-meter response, not later personality submission.
      Sarsenbayeva (2020) p5 compares ESM valence against1/5/60-minute Affectiva
      windows; only the1-minute case explicitly says preceding. Local source
      definitions preserve that distinction; unspecified sidedness and endpoints
      are never inferred. Supplied answer links designate comparisons, not the
      anchor event or equality of their timestamps. Quantities are supplied,
      not computed; valence does not inherit raw emotion-confidence scale bounds.
      Local references preserve normalization but do not authenticate firstness,
      reconstruct time, match raw rows or establish observation completeness.
      Murnane2016 p7 preserves a one-hour window surrounding a PVT assessment
      and independent mean-session-seconds, distinct-app and switch summaries;
      surrounding does not specify centered offsets or a phone-session closer.
    broad_mappings: [prov:Entity]
    slots: [observation_window_id, window_setting_references, anchor_task_action_reference, questionnaire_response_references, screen_text_capture_references, denotes_interval, quantities, source_locators]
    slot_usage:
      denotes_interval: {required: false, inlined: true}
      questionnaire_response_references: {description: "Supplied compared/supporting answer IDs resolving only within the containing task completion. Null/omission is unknown support, [] explicitly empty; the anchor event remains separately identified."}
      anchor_task_action_reference: {description: "Supplied local action anchor. STDD's preceding-EMA alignment does not disclose receipt/open/submission semantics and alone permits an omitted/null anchor. Established action-anchored policies retain their required local action in source validation; no action is fabricated to satisfy the structure."}
      screen_text_capture_references: {description: "Supplied ordered Screen Text Sensor capture IDs, resolved within the same profile/source/participant and compatible known device. Null/omission is unknown membership, [] explicitly empty. The five-minute policy is anchored to questionnaire receipt, not response; no timestamp matching, sorting or text-equality deduplication is performed."}
      source_locators: {required: true}

  AppFeatureSessionRecord:
    description: >-
      Supplied normalized app session containing individually identified timed
      feature-use instances and optional instance-selection responses. Finesse
      (2021), published-layout p.8 Section3.3 and p.3 Figure1, stores session
      start/duration and each instance's feature name/start/end. Same-label
      instances are not one occurrence. IDs are supplied normalized identities,
      not recovered raw keys; no classification, session construction, sampling,
      timing conversion or regret computation runs during import.
    broad_mappings: [prov:Entity]
    slots: [feature_session_id, method_profile_id, source_work_id, participant_id, device_id, session_record_origin, app_name, app_package_name, denotes_interval, feature_occurrences, session_feature_selections, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      denotes_interval: {required: true, inlined: true}
      source_locators: {required: true}

  AppFeatureOccurrenceRecord:
    description: >-
      One supplied feature-use instance local to its owning app session, not
      merely a feature label, app episode or Accessibility callback. Finesse
      p.8 Section3.3 preserves each instance's name/start/end. Supplied order,
      opaque time tokens and unknown endpoints survive without inferring an
      overlap, adjacency, containment, carry-forward or duration policy.
    broad_mappings: [prov:Entity]
    slots: [feature_occurrence_id, feature_name, denotes_interval, source_locators]
    slot_usage:
      denotes_interval: {required: true, inlined: true}
      source_locators: {required: true}

  SessionFeatureSelectionRecord:
    description: >-
      Supplied response state and optional membership of selected feature-use
      occurrences in the owning app session. Finesse p.8 Section3.3 asks users
      to select individual instances; p.3 Figure1 illustrates SUBMIT and SKIP.
      Submitted empty membership differs from an unanswered or expired prompt.
      Status labels are supplied normalized descriptions, not recovered stored
      codes; SKIP's deployed storage mapping remains unknown. Unknown wording,
      answers and membership are never manufactured from a status.
    broad_mappings: [prov:Entity]
    slots: [questionnaire_response_id, questionnaire_item_label, response_value_json, selection_response_status, selected_feature_occurrence_references, source_locators]
    slot_usage:
      questionnaire_response_id:
        description: Supplied normalized response identity local to the owning app session, not a notification history.
      questionnaire_item_label: {required: false}
      response_value_json: {required: false}
      source_locators: {required: true}

  ScreenTextCaptureRecord:
    description: >-
      Supplied normalized text snapshot, with its raw or derived meaning declared
      by the referenced local source definition. ScreenTextSensor
      (10.1145/3613904.3642347) physical pp3–4 Sections3.1–3.2 describes a saved
      flat string, application package and individually delimited text-node phrases
      with pixel rectangles from Android Accessibility. JMIR55999 (10.2196/55999)
      physical p4 describes EasyOCR-derived screenshot text and its confidence
      filter and normalization; these are not raw Accessibility observations.
      ScreenTK (10.1145/3675094.3677547) Figures2–3 separately describe capture
      time and Unix event time; source_event_time_token preserves the latter
      independently, without assuming units or conversion between them.
      This record is not screenshot pixels or a UsageStats event, and importing
      it does not execute OCR or normalization. Equal text/time tokens do not
      merge captures or phrases. Flat text
      and phrase membership are independently supplied; no delimiter parsing,
      concatenation, filtering, tree/visibility inference or time conversion runs
      at import. Null, empty and omitted membership remain distinct. Normalized
      IDs do not recover raw keys, serializer or the study build.
    broad_mappings: [prov:Entity]
    slots: [text_capture_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, method_setting_reference, capture_instant, source_event_time_token, app_package_name, screen_text, screen_phrases, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      source_locators: {required: true}

  TypingTrialRecord:
    description: >-
      Supplied normalized trial membership or explicitly selected derived-only cells.
      Akpinar et al. DOI 10.1145/3577013 physical pp12-13 Figure4/Section4.2
      distinguishes raw actions from later trial construction by participant,
      timestamp order, app switch, text reset and transition-specific pauses.
      This class retains supplied ordered references, not an executed trial
      constructor, timestamp tie rule, computed correction verdict or recovered ESM join. IDs and
      membership are normalized, not recovered source keys. Rodrigues et al.
      DOI10.1145/3491102.3501908 p5§3.1.2 stores metrics without raw text,
      touchpoints or app identity. Its released CSV's repeated Index tuples
      must not be deduplicated or treated as trial identity. Derived-only rows
      reference their own lifecycle and column definitions, not CABAS boundaries.
      Optional action-trial-owned token evaluations and text-change cases, independent system verdicts,
      participant follow-up answers and separately supplied questionnaire answers
      preserve the pp18–20 follow-up and pp7–8/32–33 ESM relationships without
      executing a classifier or recovering raw case keys and joins.
    broad_mappings: [prov:Entity]
    slots: [typing_trial_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, trial_representation, trial_partition_setting_reference, trial_app_switch_setting_reference, trial_reset_setting_reference, trial_pause_setting_reference, keyboard_transaction_references, trial_lifecycle_setting_reference, trial_schema_setting_reference, released_values_json, text_change_cases, token_evaluation_cases, trial_questionnaire_responses, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      source_locators: {required: true}

      trial_partition_setting_reference: {required: false}
      trial_app_switch_setting_reference: {required: false}
      trial_reset_setting_reference: {required: false}
      trial_pause_setting_reference: {required: false}
      keyboard_transaction_references: {required: false, minimum_cardinality: 1}
    rules:
      - preconditions:
          slot_conditions:
            trial_representation: {equals_string: derived_metrics, value_presence: PRESENT}
        postconditions:
          slot_conditions:
            trial_lifecycle_setting_reference: {required: true, pattern: '\S'}
            trial_schema_setting_reference: {required: true, pattern: '\S'}
            released_values_json: {required: true}
            trial_partition_setting_reference: {value_presence: ABSENT}
            trial_app_switch_setting_reference: {value_presence: ABSENT}
            trial_reset_setting_reference: {value_presence: ABSENT}
            trial_pause_setting_reference: {value_presence: ABSENT}
            keyboard_transaction_references: {value_presence: ABSENT}
            text_change_cases: {value_presence: ABSENT}
            token_evaluation_cases: {value_presence: ABSENT}
            trial_questionnaire_responses: {value_presence: ABSENT}
        elseconditions:
          slot_conditions:
            trial_representation: {required: false, equals_string: action_membership}
            trial_partition_setting_reference: {required: true, pattern: '\S'}
            trial_app_switch_setting_reference: {required: true, pattern: '\S'}
            trial_reset_setting_reference: {required: true, pattern: '\S'}
            trial_pause_setting_reference: {required: true, pattern: '\S'}
            keyboard_transaction_references: {required: true, minimum_cardinality: 1}
            trial_lifecycle_setting_reference: {value_presence: ABSENT}
            trial_schema_setting_reference: {value_presence: ABSENT}
            released_values_json: {value_presence: ABSENT}

  TokenEvaluationCaseRecord:
    description: >-
      Supplied word-evaluation case local to an action-membership typing trial,
      distinct from removed/reentered text. Akpinar et al. DOI10.1145/3577013
      pp18–19 Section4.4.1–4.4.2 presents selected words with overall text and
      independently retained system judgments and participant F/T feedback.
      F means participant-reported typo, not correction or system disagreement.
      Withheld text remains unknown. Equal words do not merge case identities;
      supplied ownership does not recover original word/action/trial joins.
    broad_mappings: [prov:Entity]
    slots: [token_evaluation_case_id, token_text, overall_text, system_verdicts, followup_responses, source_locators]
    slot_usage:
      system_verdicts: {range: TokenEvaluationVerdictRecord}
      source_locators: {required: true}

  TokenEvaluationVerdictRecord:
    description: >-
      Independently supplied word-correctness judgment referencing a profile-local
      token classification definition, not an edit/correction definition.
      Akpinar et al. pp18–19 Section4.4 keeps judgments separate from first-task
      F/T answers. Optional supporting answers resolve only within this token
      case. No classifier, version assignment, chronology or agreement recoding.
    broad_mappings: [prov:Entity]
    slots: [label_record_id, label_setting_reference, observed_property, label_value_json, questionnaire_response_references, source_locators]
    slot_usage:
      label_record_id: {description: "Supplied verdict identity unique within its containing token-evaluation case."}
      observed_property: {required: true}
      questionnaire_response_references: {description: "Optional supplied answer IDs local to this token case, not a text-change case or trial questionnaire."}
      source_locators: {required: true}

  TextChangeCaseRecord:
    description: >-
      Supplied text-change case local to an action-membership typing trial.
      Akpinar et al. DOI10.1145/3577013 pp18–19 §4.4.1–4.4.2 provides overall,
      removed and reentered text for independent system-verdict and participant
      follow-up comparison. Withheld text remains null/omitted. Equal content
      does not merge case IDs. Optional action supports resolve within the trial,
      not an inferred segmentation, exhaustive membership or disjoint partition.
      Array order is preserved but does not establish case or revision chronology.
    broad_mappings: [prov:Entity]
    slots: [text_change_case_id, overall_text, removed_text, reentered_text, support_keyboard_transaction_references, system_verdicts, followup_responses, source_locators]
    slot_usage:
      source_locators: {required: true}

  TextChangeVerdictRecord:
    description: >-
      Independently supplied text-change verdict, referencing a profile-local
      classification definition. Akpinar et al. pp18–20 §4.4 distinguishes
      initial and revised verdicts; printed Algorithm2's version placement remains
      unresolved. No verdict is computed from supplied feedback or assigned to a
      version by array position. Supporting answer IDs, when supplied, resolve
      only within this case's follow-up answers, not ESM or another case.
    broad_mappings: [prov:Entity]
    slots: [label_record_id, label_setting_reference, observed_property, label_value_json, questionnaire_response_references, source_locators]
    slot_usage:
      label_record_id: {description: "Supplied verdict identity unique within the containing text-change case, not a device session."}
      observed_property: {required: true}
      questionnaire_response_references: {description: "Optional supplied supporting answer IDs local to the case's follow-up responses; no causal or temporal inference."}
      source_locators: {required: true}

  TypingQuestionnaireResponseRecord:
    description: >-
      Individually identified supplied answer owned either by a token or text-change case's
      follow-up or separately by its typing trial's questionnaire association.
      Akpinar et al. pp18–19 §4.4.1 uses F for participant-reported error correction
      and T otherwise in the change task; the distinct word task uses F for a
      participant-reported typo and T otherwise. Neither means system agreement. ESM
      context and subjective-error instruments on pp7–8/32–33 are separate.
      Each answer references its own local definition. Null/omission/lexical JSON
      null and repeated values remain distinct; no raw join, scoring or recoding.
    broad_mappings: [prov:Entity]
    slots: [questionnaire_response_id, questionnaire_setting_reference, observed_property, questionnaire_item_label, response_value_json, source_locators]
    slot_usage:
      questionnaire_response_id: {description: "Supplied answer identity unique within its containing case or trial; equal IDs in separate owners do not merge."}
      questionnaire_setting_reference: {description: "Local compatible task-specific word/change follow-up or questionnaire instrument definition, not a prompt cadence or reported statistic."}
      observed_property: {required: true}
      questionnaire_item_label: {required: false}
      response_value_json: {required: false}
      source_locators: {required: true}

  KeyboardTransactionRecord:
    description: >-
      One supplied keyboard action independent of any reconstructed trial. Preserve
      both text states, the opaque timestamp, application package and supplied
      normalized boolean flags independently. Figure4 prints 0/1 flags but
      does not disclose its deployed raw serializer or timestamp unit. Trial
      membership may remain unknown; no source row key, correction verdict or
      sequence position is inferred from equal time/text values.
    broad_mappings: [prov:Entity]
    slots: [keyboard_transaction_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, keyboard_schema_setting_reference, keyboard_timestamp, app_package_name, before_text, current_text, is_deleted, is_password, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      source_locators: {required: true}

  ScreenTextPhraseRecord:
    description: >-
      One supplied normalized text-node member of its owning capture, with its
      own capture-local identity. ScreenTextSensor physical p4 Section3.2 and
      Figure2 distinguishes individual phrases and their top-left/bottom-right
      pixel coordinates. Equal phrase strings do not merge children. Bounds
      denote node rectangles, not glyph coordinates, visibility or a tree
      relation (physical p17 Section6.6). Optional partial values remain unknown;
      importer preserves supplied child order without asserting source chronology.
    broad_mappings: [prov:Entity]
    slots: [phrase_id, phrase_text, phrase_left_px, phrase_top_px, phrase_right_px, phrase_bottom_px, source_locators]
    slot_usage:
      source_locators: {required: true}

  SensorControlOccurrenceRecord:
    description: >-
      A separately identified supplied normalized logged sensor enable/disable
      instance, independent of text captures. ScreenTextSensor physical p17
      Section6.6 describes AWARE-Light logging these instances. This is neither
      screen/keyguard state nor an active-collection interval; do not infer
      success, actor, disabled duration, missing capture or a neighboring join.
      The profile-owned definition reference identifies the logged-control
      acquisition claim, not an execution receipt or recovered raw event code.
    broad_mappings: [prov:Entity]
    slots: [sensor_control_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, method_setting_reference, sensor_label, sensor_control_action, occurrence_instant, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      source_locators: {required: true}

  SampledQuantityObservationRecord:
    description: >-
      TimeKilling CHI2023 additionally retains supplied capture-pair and feature
      identities distinct from source phone-use screenshot sessions and
      nonoverlapping seven-pair prediction sequences. Optional parent/child
      screenshot references retain supplied membership without clock equality,
      padding inference or tensor/model execution. Explicit padding, unknown
      membership and captured black images are distinct. Source-qualified
      quantities retain current/session/past-window scopes and named axes;
      independently supplied user/group and model summaries do not manufacture
      participants or calculate outputs.
      Supplied normalized observation with independently retained quantities
      and an explicitly typed subject. Falaki et al. IMC2010 Section2 Dataset2
      records these every two minutes; Section4's later per-application interval
      analysis does not disclose cumulative-versus-delta storage or process/app
      joins. Tokens and IDs are supplied, not inferred packages, PIDs or clocks.
      Equal subjects, times and values do not merge observation identities.
      Missing quantities remain unknown; no arithmetic or interval construction.
      Hush Section3.1 additionally distinguishes process/core CPU readings,
      core frequency-residency durations, UID network bytes and device battery
      and signal readings; PID/UID-to-app aggregation is not inferred. CHI2020
      Sarsenbayeva p3 supplies participant facial-expression confidence values
      from 0 to 100, not probabilities, percentages or questionnaire answers.
      Energy Drain2015 §§3–5 additionally supplies device summaries and distinct
      application-owned foreground/background/component quantities, independent
      application-category averages/totals/shares and version-scoped foreground
      drain rates plus total foreground energy/time/EDR. A category aggregate is
      not an individual app or evidence of app membership. An app token is not a process or
      Android UID; its identity and any period token are supplied, never joined.
      Participant context may be omitted/null only for exact source-compatible
      across-device Energy app/category summaries, Meaningful pooled U&G shares,
      Falaki across-user application-category popularity and Next App Table2
      application classifications, and exact Mercati DATE2014 per-core reporting
      records from the hardware-only governor experiment with supplied device/core
      ownership. The wireless-signal controlled handset, system-call-model and
      validation observations (doi:10.1145/2465529.2466586) additionally permit
      unknown human context only with a supplied device; volunteer trace and
      selected-user what-if observations still require participant ownership.
      Screen Text and Angry Birds additionally distinguish exact source-scoped
      participant-group summaries from individual participant observations;
      unknown original group IDs are not manufactured. Screen Text application
      and application-category summaries retain their distinct subject kinds.
      A cohort or hardware device is never manufactured as a participant. Observation
      time may be omitted for study-wide summaries. Import performs no
      division, mean, weighting, membership propagation or classifier execution.
      Energy Drain2015 Section2.5 additionally retains independent dynamic event
      occurrences, not resulting state snapshots; source event time remains
      distinct from collection time. Appendix A logged per-core CPU frequency
      is not a residency duration, and raw screen brightness has an unreported
      unit, not the later duration-weighted percentage. Its UID-owned Nsnd/Nrcv
      byte values and T interval in seconds remain independent supplied
      quantities, without a UID-to-app join, cadence inference or network-call
      or energy reconstruction.
      Supplied student-course subjects keep the participant as the student and
      require a separate opaque course token. Distinct class/attendance evidence
      observations do not merge on course equality; explicitly supplied same-owner
      supports retain Wi-Fi-primary, GPS-building fallback and unavailable-evidence
      distinctions without inferring attendance. Scheduled, attended and effective
      class time, screen exposure and the class-time denominator remain independent.
      Source-compatible local definitions constrain entity, property and units.
      Next App §§3–5 additionally retains separately identified raw action
      occurrences, independently supplied basic/last-family vector features,
      app-opening analysis anchors and role-specific sampled supports. A
      following Gaussian context member is not a preceding last-action feature.
      Static inventories, cold-app class/prior values and explicit cold-user
      inventory/history relationships retain their independent owners. Vectors
      do not establish a dimension, training recipe or computed representation.
      No callback equivalence, latest selection, time ordering, Gaussian draw,
      aggregation, class cutoff or cross-user history alignment is inferred.
      Supplied predictor rows may name a same-owner task explicitly, without
      asserting an action anchor, original row join, window bounds or calculation.
      A supplied scan can own ordered AP appearances; a supplied inferred place
      can own AP/cell members. List position is not a rank or clustering proof.
      Root membership is an optional local reference, never inferred from order.
      Device summaries over observed days are not particular-day observations.
      A current-running-app snapshot owns simultaneous application appearances;
      a supplied per-user binary feature row owns vocabulary members with
      independent app-use values. Neither implies launch, foreground attribution
      or a reconstructed episode. A static installed-app inventory owns installed
      applications and optionally supplied native versus user-installed origin.
      Static membership is not a particular-day, monthly-use or running claim.
      No source cadence, timestamp, binary conversion, inventory count, native
      proportion or raw-to-derived join is inferred from members.
      A ranked recent-task snapshot can instead own application members with
      independently supplied source keys, zero-based ranks, boot-elapsed
      logging-time tokens, component strings and source values
      (Gouin-Vallerand2014 p3 Sample1). Per-member times may differ within a list;
      they are not a parent collection instant or a known launch time. No scalar
      time unit, boot-to-wall-clock join, unchanged-list filtering, rank reversal
      or transition is inferred.
      Mercati DATE2014 Figure2 per-core H/L allocation is distinct from scheduler
      PID observations, dynamic H-PID lists, foreground episodes and idle frequency
      context. Experimental seconds and reliability virtual-years quantities remain
      independent of scheduler/temperature cadences and the accelerated aging
      definition. H never constructs a maximum-frequency value; the reported
      budget-exhaustion qualification and unknown raw-to-plot constructor persist.
      Tapping2024 app/tap observations additionally admit explicitly supplied
      phone-session and local foreground-period action references. A→B→A visits
      retain independent identities. Source event time is not collection time;
      these supports never select a nearest episode or construct app periods.
      Independent authentication durations need not belong to the usage cohort;
      configuration booleans are normalized truth values, not recovered codes.
      PlacesActivities activity reports and CoronaHealth released active-use or
      inferred-inactivity records may additionally retain a supplied UsageInterval.
      That optional interval is not a fabricated task, place visit, day, inferred
      boundary pair or computed duration. Its endpoints and duration remain
      independent, with omission, null and populated values distinct. Corona
      submission observations keep ordered optional app blocks and separately
      permissioned coarse GPS; release windows are not necessarily one day.
      PlacesActivities context summaries distinguish participant means by activity,
      place type or characteristic from pooled participant-group summaries. Sleep
      Prediction daily graphs likewise retain an explicit participant-group owner,
      directed peer-day edges and independently supplied own previous-day quality.
      No callback, submission/GPS equality, calendar offset, membership, category,
      threshold, mean, questionnaire score or prediction is inferred.
    broad_mappings: [prov:Entity]
    slots: [sampled_observation_id, screenshot_session_reference, screenshot_record_reference, method_profile_id, source_work_id, participant_id, device_id, record_origin, method_setting_reference, denotes_interval, device_use_session_reference, session_action_reference, task_occurrence_reference, screen_text_capture_references, observed_entity_kind, observed_entity_token, observation_instant, source_event_time_token, quantities, entity_members, root_entity_member_reference, app_interruption_session_reference, sampled_observation_references, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: false, description: "Exact TimeKilling supplied group summaries additionally permit omitted/null individual context only on their source-authorized pooled route; no individual participant or device is inferred. Optional supplied context only for source-compatible application/application-category Energy Drain2015 aggregates, Meaningful pooled application U&G shares, Falaki across-user application-category popularity, Next App Table2 application classifications, exact Screen Text pooled application/category, participant-group or explicitly scoped place summaries, exact Angry Birds pooled application/category/participant-group and Kim2019 pooled application/participant-group summaries, and exact Mercati DATE2014 hardware-only per-core reporting records with supplied device/core ownership. Exact doi:10.1145/2465529.2466586 controlled handset, system-call-model and validation device/process observations also permit omitted/null human context only with a nonblank device; volunteer trace and selected-user what-if rows still require participant context. Exact PlacesActivities pooled context summaries and Sleep Prediction supplied daily graphs also permit omitted/null human context only as participant-group subjects without an individual participant/device. Exact KeyboardStress pooled participant-group windows/features and HMOG controlled-device energy observations also permit omitted/null human context; the former cannot name an individual participant/device and the latter require the supplied device. The importer retains a required nonblank participant for all other subject/source routes, including named-person Screen Text summaries, ordinary HMOG authentication and Hush CPU cores; it never invents a cohort or hardware participant."}
      denotes_interval: {required: false, description: "Optional supplied UsageInterval only for source-compatible PlacesActivities activity reports and CoronaHealth active-use/inferred-inactivity release records. Start/end tokens, duration and endpoint statuses remain independent; no inclusivity, calendar, one-day boundary, clock arithmetic, place visit or session constructor is inferred."}
      screen_text_capture_references: {description: "Supplied ordered Screen Text capture membership, source-qualified and local to profile/source/participant/compatible known device. Per-screen density/sentiment admits at most one known capture, sequential phrase difference at most two, and selected-set screen counts admit independently supplied members. Null/omission/empty membership remains distinct; no timestamp selection, chronology, completeness, set arithmetic or aggregate is inferred."}
      observation_instant: {description: "Opaque supplied collection-time token; no units, timezone or observed interval bounds inferred."}
      source_event_time_token: {required: false, description: "Optional opaque source-designated event time, distinct from observation_instant collection time. Boredom Table1 has screen on/off/unlock occurrences and timed incoming/outgoing call and receiving/reading/sending SMS occurrences; WhyStop p3 also records timestamped RINGING/SMS_RECEIVED occurrences. Each is independently owned by its source definition, not a state snapshot or an invented task/session group. No point-time conversion, cadence, boundary pairing, temporal order, collector execution or ESM join is inferred."}
      source_locators: {required: true}

  SampledObservationReferenceRecord:
    description: >-
      Supplied role-qualified relationship to another normalized observation,
      not a matcher or temporal selection. Next App pp4–5 distinguishes one
      AppOpen anchor, six independently named last-action supports and a
      separate before/after Gaussian-context membership. Same-owner links
      resolve within profile/work/participant and compatible known device.
      Sections5.2.1–5.2.2 separately permit explicit cross-participant input
      inventories and surrogate-history members; target identities retain
      their source participant, never an inferred identity merge. Omitted/null
      target leaves this role's support unknown. Equal timestamps or values
      do not establish linkage, latest/nearest selection or order.
    slots: [relationship_label, sampled_observation_reference, source_locators]
    slot_usage:
      relationship_label: {required: true, pattern: '\S'}
      sampled_observation_reference: {required: false, pattern: '\S'}
      source_locators: {required: true}

  SampledEntityMemberRecord:
    description: >-
      One supplied AP appearance, cell/AP member, or application member owned
      by one observation. Application meaning comes from the local source
      definition: simultaneous running appearance, supplied app-vocabulary
      feature member, static installed membership, or ranked recent-task member
      are distinct.
      Its local record identity is distinct from an optional recurring entity
      token and independently retained CID/LAC or anonymized MAC/SSID readings.
      Equal tokens/values do not merge members. RSSI/frequency belong to the scan
      appearance, not a stable AP property or an inferred place fingerprint.
      Omitted/null quantities remain unknown; an empty list is explicitly empty.
      Membership does not recover a scan-to-place join, ranking, geographic
      coordinate, hash algorithm, clustering execution, visit or session context.
      An application token is a supplied opaque identifier, not an inferred
      package/name mapping. Installation origin is an optional member-owned
      categorical quantity, not a device/cohort mean or inferred app use.
      Ranked recent-task source rank/key, boot-elapsed token, component and
      source value remain independent member quantities. Same-package/different-
      activity appearances retain distinct member IDs and ordered source keys;
      list position does not synthesize rank.
    slots: [entity_member_id, member_entity_kind, observed_entity_token, quantities, source_locators]
    slot_usage:
      source_locators: {required: true}

  SampledQuantityRecord:
    description: >-
      One independently supplied quantity owned by its observation or window.
      Window summary values do not inherit raw-emotion confidence bounds. Traffic
      byte directions occur at most once per observation and require bytes.
      Hush frequency-residency members may have distinct opaque frequency
      qualifiers; unknown qualifiers never merge members or require inference.
      CPU/residency/signal units are undisclosed and remain omitted/null; UID
      network bytes and battery percent remain distinct. Emotion confidence
      has no inferred physical unit and its components need not sum to 100.
      Lexical JSON retains zero, quoted numeric text and JSON null separately
      from an omitted or null field. The source's raw serializer and counter
      reset/interval interpretation remain unknown; values are not converted.
    slots: [observed_property, evidence_value_json, evidence_unit, quantity_qualifier]
    slot_usage:
      observed_property: {required: true}

  MonthlyAppUseCellRecord:
    description: >-
      Supplied partial user/app/month binary cell, as distinguished in Sekara
      et al. Scientific Reports2021 Figure1 and Methods. One means used in that
      month and zero otherwise, not installed/uninstalled. Omitted/null values
      are normalized unknowns, never filled with zero. App and user tokens are
      opaque pseudonymous identifiers, not inferred packages or hash algorithms.
      No day/session, calendar boundary, complete fingerprint, eligibility or
      annual maximum/OR computation is inferred from these supplied cells.
    broad_mappings: [prov:Entity]
    slots: [cell_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, method_setting_reference, month_label, app_identifier, used_in_month, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      source_locators: {required: true}

  DeviceStateObservationRecord:
    description: >-
      Supplied normalized logged state-entry record, not a real-world occurrence,
      ringer occupancy or unlock-to-lock session. Hard Lock Life printed p218
      Figure1/Section4.1.1 combines screen and keyguard states and timestamps state
      entry. Preserve independent state components and separately identified
      records at equal opaque times, including OFF/UNLOCKED. Optional/null values
      remain unknown, not inferred from the other component or an adjacent row.
      IDs and tokens are supplied, not recovered raw serialization.
    broad_mappings: [prov:Entity]
    slots: [state_observation_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, method_setting_reference, observation_instant, screen_state, keyguard_state, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      source_locators: {required: true}

  DeviceStateIntervalRecord:
    description: >-
      Supplied kind-qualified interval with independently supplied endpoint
      state-record references. Hard Lock Life printed pp218/220 distinguishes
      screen bouts from upper-bound unlock cost. Equal time tokens do not equate
      endpoints or erase kind. Positive references resolve in the same profile,
      participant and known device; unknown endpoints remain null/omitted. Reuse
      UsageInterval without sorting, pairing, duration calculation, missing-event
      repair, or authentication inference. This is not an executed constructor.
    broad_mappings: [prov:Entity]
    slots: [state_interval_id, method_profile_id, source_work_id, participant_id, device_id, record_origin, method_setting_reference, interval_kind, denotes_interval, start_observation_ref, end_observation_ref, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      participant_id: {required: true}
      denotes_interval: {required: true, inlined: true}
      source_locators: {required: true}

  RingerStateIntervalRecord:
    description: >-
      Supplied normalized ringer-setting occupancy over an interval, not a
      continuous device-use session, mode-change callback or executed constructor.
      Chang and Tang (2015), printed p.12 / PDF p.7, defines occupancy until a
      different mode and calculates attendance gaps within that scope. The local
      source policy preserves the unknown powered-off duration (printed pp.14-15 /
      PDF pp.9-10); no bridge, deletion, duration or endpoint is inferred here.
      IDs and tokens are normalized, not recovered source serialization.
    broad_mappings: [prov:Entity]
    slots: [ringer_state_interval_id, method_profile_id, source_work_id, participant_id, interval_record_origin, session_construction_policy_reference, ringer_mode, denotes_interval, session_actions, session_quantities, source_locators]
    slot_usage:
      method_profile_id: {required: true, identifier: false}
      denotes_interval: {required: true, inlined: true}
      source_locators: {required: true}

  # ---- Derived assertions: assertion != interval != execution (D4) ----
  UsageEpisodeAssertion:
    description: A claim that one app was in continuous use over an interval. A derived prov:Entity (what the pipeline asserts, not a ground truth).
    broad_mappings: [prov:Entity]
    slots: [denotes_interval, app_package_name, participant_id, reconstructed_by, attribution, measurement_layer]

  UsageSessionAssertion:
    description: A claim of continuous device use between unlock and lock. Derived prov:Entity.
    broad_mappings: [prov:Entity]
    slots: [denotes_interval, participant_id, reconstructed_by, measurement_layer]

  GlanceAssertion:
    description: A claim that the screen activated then deactivated without an unlock. Derived prov:Entity.
    broad_mappings: [prov:Entity]
    slots: [denotes_interval, participant_id, reconstructed_by, measurement_layer]

  EffectiveUsageMeasure:
    description: >-
      One screen-gated credited app EPISODE — the unit the engine actually emits
      when `enable_screen_gated_crediting` is on.

      An earlier version of this class described a per-participant-day
      `effective_minutes` figure governed by a free-text `coverage_policy`. No
      such daily measure exists. `apply_screen_gated_credit_incremental`
      (pipeline_v2.rs) emits `credited_app_csv`, a side-by-side CSV written by the
      same `write_app_csv_from_iter` as the headline app output, so a credited
      measure is an episode row with the app schema's own start, stop, duration
      and date — not a daily total. Its workflow checkpoint is named
      `effective_usage`, which is where this class's name comes from.

      The rule that decides which parts of a session earn credit is typed:
      ScreenGatingRuleId, not prose. Its three values select witnessed screen-ON
      intervals, demonstrably-alive spans, or (the default) their intersection.
      The numeric bounds around it — `auto_lock_bridge_seconds`,
      `credited_session_cap_minutes`, `device_liveness_gap_tolerance_minutes`,
      `no_witness_min_day_apps` — are ordinary ParameterBindings of the cited
      ParameterSet.

      NOT asserted as physical truth, and never a replacement for the headline
      app-usage output, which no value of the gating rule changes. A daily
      credited total is an aggregation a consumer performs over these rows under
      a stated DayBoundaryAttributionId and TimezoneNormalizationPolicyId; it is
      not something this pipeline emits.
    broad_mappings: [prov:Entity]
    slots: [participant_id, date, app_package_name, denotes_interval, produced_by, cites_parameter_set, screen_gating_rule]

  ComplianceDayAssessment:
    description: >-
      One participant-day row of the `compliance_csv` — the compliance measure
      this engine actually computes. Its slots mirror the CSV columns: the
      eight-field `ComplianceDayCheckpoint` (pipeline_v2.rs) plus
      `expected_device_count`, which the writer joins from the enrolled-devices
      support file at write time; `compliance_threshold_percent` is the scalar
      input the engine compares against (not a CSV column), and
      `compliance_value_basis` is this ontology's own name for the imputation
      distinction, present in no engine output. This term exists because AttributionStatus
      formerly claimed to BE the compliance denominator contract while nothing
      described the quantity, its denominator, or its defaults.

      WHAT THE DENOMINATOR ADMITS. `accumulate_minutes`
      (pipeline_v2_incremental.rs) walks the output rows and adds
      `duration_minutes` to the day's bucket only when the row's interaction type
      is App Usage or Non-Target Child App Usage AND
      `minimum_duration_aggregate_eligible` is set. Numerator = minutes whose
      username is neither blank, "nan", nor "None"; denominator = numerator plus
      the rest.

      WHAT IT SILENTLY EXCLUDES, in every case without a receipt in this output:
      (1) Filtered App Usage — excluded packages are RELABELLED rather than
      deleted, keep their raw evidence, and are then absent from both numerator
      and denominator, so package-exclusion policy moves this measure;
      (2) episodes ruled ineligible by the minimum-duration disposition, so a
      sub-floor episode's minutes are attributed to nobody;
      (3) any episode whose duration is blank, which contributes 0.0;
      (4) every non-app row type, including End of Usage Missing — so an episode
      zeroed by the long-duration cap leaves the denominator entirely.
      The compliance percent is therefore a share of ADMITTED minutes, never a
      share of the participant's day.

      THE 100.0 DEFAULT IS AN IMPUTATION. When the participant is not in the
      device-sharing file, or when the admitted total for the day is zero, the
      engine writes compliance_percent = 100.0 without measuring anything, and
      `is_valid` then compares that literal against the threshold like any other
      value — so an unshared participant and a participant with no qualifying
      usage both count as valid days. The distinction survives only in
      `sharing_status` and `zero_real_usage`; compliance_value_basis is this
      ontology's name for it, so a summary of the percent column can state which
      rows it measured and which it inherited.

      The participant-day spine is every (participant, date) pair seen on any
      APP-output row — the screen output is not consulted — including rows
      contributing no minutes, so a day can appear here with a zero total and a
      100.0 percent.
    broad_mappings: [prov:Entity]
    slots:
      - participant_id
      - date
      - sharing_status
      - known_minutes
      - unknown_minutes
      - compliance_percent
      - compliance_value_basis
      - zero_eligible_usage
      - compliance_threshold_percent
      - meets_compliance_threshold
      - expected_device_count

  DayCoverageAssessment:
    description: >-
      One participant-day row of the `day_coverage_csv`: the observability status
      the engine actually computes, over a spine that is the participant's study
      window when one is configured and otherwise their first-to-last observed
      date. Distinct from CoverageAssessment, which models a cause attribution
      this pipeline does not make (see CoverageCause).
    broad_mappings: [prov:Entity]
    slots: [participant_id, date, day_coverage_status]

  # ---- Absence / observability (D4) ----
  CoverageAssessment:
    description: >-
      A coverage/observability judgement over a stream window: expected vs actual data
      availability, its threshold, bounding events, and best-supported cause. A gap MAY
      CONCEAL usage — this asserts only how the measurement policy treats the interval,
      never that the device was inactive.

      DESIGN-TIME ONLY, like the CoverageCause it carries: no kernel path emits
      an expectation, an availability threshold, a policy treatment, or a cause.
      The coverage judgement this engine ships is the per-day
      DayCoverageAssessment. Keep the two apart when reading an instance graph —
      this class describes a window-level cause attribution that is available to
      an author, not a reading of pipeline output.
    slots: [assesses_interval, participant_id, device_id, expected_available, actually_available, availability_threshold, coverage_cause, policy_treatment]

  # ---- Person attribution (D4) — mandatory status + optional person ----
  AttributionAssertion:
    description: >-
      Attribution of usage to a person. Exactly one status is required; an actual person
      is attached only when known. The participant-device-day denominator must satisfy
      duration conservation: target + known_non_target + unresolved = eligible.
    broad_mappings: [prov:Entity]
    slots: [attribution_status, attributed_person, on_shared_device]

  # ---- Pipeline structure (P-Plan) — ParameterSet is config, NOT a Plan (D4/D7) ----
  WorkflowPlan:
    description: The prospective processing workflow. A p-plan:Plan / prov:Plan.
    broad_mappings: [pplan:Plan]
    tree_root: true
    slots: [plan_id, operations, queries]

  OperationDefinition:
    description: >-
      One semantic operation in the workflow at any useful scale. Operations
      compose recursively via part_of_operation so a coarse responsibility and
      its independently invalidatable transformations share one model without
      forcing presentation and execution boundaries to coincide.
    broad_mappings: [pplan:Step]
    slots:
      - operation_id
      - verb
      - engine
      - operation_role
      - epistemic_role
      - consumes
      - produces
      - depends_on
      - configuration_dependencies
      - data_effects
      - is_fatal
      - part_of_operation
      - group_scope_operation_ids
      - grouping_basis
      - equality_key_setting_ids
      - concatenated_key_setting_ids
      - empty_if_absent_key_setting_ids
      - selection_rule
      - required_event_payload_roles
      - optional_event_payload_roles
      - event_payload_association
      - missing_gesture_marks_incomplete
      - gesture_presence_implies_correctness
      - sequence_encoding_rule
      - sequence_scope_operation_ids
      - sequence_identity_setting_ids
      - sequence_first_symbol_setting_id
      - sequence_repeat_symbol_setting_id

  OperationExecution:
    description: A retrospective execution of an OperationDefinition. A prov:Activity.
    broad_mappings: [prov:Activity]
    slots: [execution_id, executes_operation, used_parameter_set, started_at, ended_at]

  QueryDefinition:
    description: >-
      One physical computation and memoization boundary. Its realizes_operations
      links are prospective mappings and do not imply that those semantic operations
      were applied in a particular run.
    broad_mappings: [pplan:Step]
    slots:
      - query_id
      - query_group_id
      - query_dependencies
      - realizes_operations
      - query_outputs
      - query_request_fields

  QueryExecution:
    description: >-
      Retrospective evidence for one physical query. Kept distinct from
      OperationExecution because a fused query can realize several semantic
      operations with different applicability.
    broad_mappings: [prov:Activity]
    slots:
      - executes_query
      - used_parameter_set
      - query_execution_status
      - query_input_key
      - query_output_digest
      - query_reason_id
      - part_of_execution
      - execution_started_at
      - execution_ended_at

  ReconstructionExecution:
    description: The execution that produced a usage assertion. A prov:Activity.
    broad_mappings: [prov:Activity]
    slots: [follows_strategy, used_parameter_set]

  ReconstructionStrategy:
    description: A named, versioned episode-reconstruction algorithm (semantic category + canonical IRI). Subclass only where formal restrictions genuinely differ.
    broad_mappings: [sosa:Procedure]
    slots: [strategy_id, strategy_kind, strategy_version, canonical_iri]

  ParameterSet:
    description: >-
      A content-addressed configuration entity — a set of ParameterBindings over the
      plan's variables. NOT a Plan: the plan is the workflow; this binds its variables.
    broad_mappings: [prov:Entity]
    slots: [parameter_set_sha256, bindings]

  ParameterBinding:
    description: >-
      One knob = value binding within a ParameterSet: a key and its canonical
      JSON value, and nothing else.

      THIS IS FLAT AND UNTYPED, DELIBERATELY AND COMPLETELY. The runtime
      provenance builder (`workflow_provenance.rs`) emits one of these nodes per
      entry of the request's parameter object with only `chron:knob_key` and
      `chron:knob_value`. No binding declares what kind of consequence its knob
      has, and that is true of the named research axes as well: selecting
      `zerrer_60s` reaches the sidecar as the string pair
      ("session_grouping_policy", "zerrer_60s"), carrying no link to
      SessionGroupingPolicyId. A reader recovers axis identity by matching
      knob_key against the option slots that carry a `research_axis_enum`
      annotation in `chronicle-local-contract.linkml.yaml`, and recovers nothing
      for the rest.

      THE SHAPE OF WHAT IS LEFT OVER. Some keys the contract classifies as
      computational (`COMPUTATIONAL_BROWSER_OPTION_KEYS`) carry a
      `research_axis_enum`; `timezone_handling`, via `research_ontology_enum`,
      also binds an ontology enum. The remaining computational keys have no
      term here at all. That set is not a residue of presentation knobs — it includes keys
      that change measured quantities: `use_app_codebook` (DEFAULT ON) RESTATES
      WHAT EACH ROW'S APP IS — `join_codebook` attaches a second,
      codebook-sourced identity (`application_label` arrives as
      `codebook_application_label` beside the row's own label) and the whole
      category/genre block, then `derive_broad_category` and
      `collapse_app_genre` write the row's reported broad category and
      `genre_id_scraped`, each defaulting to "Unknown" when the codebook
      offers nothing. The package key is untouched, but every category-level
      analysis of the output is a reading of the codebook rather than of the
      device; `proximity_interval_seconds` MOVES EPISODE BOUNDARIES by
      treating an Activity Stopped within its grace as an intra-app teardown
      rather than a close; `timezone_handling` can delete rows outright (see
      TimezoneNormalizationPolicyId, the one such key this ontology now names);
      `interaction_type_remap` rewrites the event vocabulary at ingest, BEFORE
      reconstruction sees it, while `interaction_types_to_remove` deletes output
      rows AFTER it — two knobs that read alike and sit on opposite sides of the
      reconstruction; `long_duration_threshold_hours`
      decides which episodes surface as End of Usage Missing;
      `minimum_usage_duration` blanks durations; `model_concurrent_usage` splits
      overlapping episodes.

      WHY THEY STAY UNTYPED, rather than each becoming an axis. Every named axis
      in this ontology is an enumerated PUBLISHED-METHOD vocabulary whose values
      are alternatives a study could have chosen and a paper can be cited for. A
      continuous grace in seconds, a float threshold, or a boolean has no such
      value set; minting one would mean inventing permissible values no source
      declares, which is the failure mode the EventRetentionSetId provenance
      warning already guards against. `proximity_interval_seconds` is the clearest
      case: the kernel implements exactly one proximity rule with a numeric grace,
      so there is no vocabulary to name, and calling it an axis would assert a
      choice between methods that does not exist. These keys are declared and
      described in the local contract instead, which is where a non-vocabulary
      parameter belongs.

      Two consequences a consumer must not overlook. A ParameterSet digest is
      identical whether a knob was set deliberately or left at its default, so
      the sidecar answers "what ran" and never "what was chosen". And two knob
      keys with equal consequence — one an axis, one not — are indistinguishable
      here, so a provenance graph must not be read as ranking them.
    slots: [knob_key, knob_value]

  # ---- Literature-derived executable method profiles ----
  StudyMethodProfile:
    description: >-
      A versioned, source-located account of one retained method from acquisition
      through release. A profile is not runnable while any applicable setting is
      unresolved; semantic coverage never implies executable support.
    broad_mappings: [prov:Plan]
    slots:
      - method_profile_id
      - source_work_id
      - source_method_variant_id
      - source_method_variant_label
      - source_method_cohort
      - source_method_platform
      - source_method_branch
      - method_configuration_structure
      - method_configuration_space
