[build-system]
requires = ["setuptools>=61.0", "setuptools-rust>=1.12.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-android-preprocessor"
version = "1.0.0"
description = "Chronicle Android raw data preprocessing and plotting library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Chronicle Android Preprocessing Team"}
]

dependencies = [
    "polars>=1.17.0",
    "pyarrow>=15.0.0",
    "pytz>=2025.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.10.0",
]
internal = [
    "chronicle-preprocessing-internal>=0.1.0",
]
dev = [
    "pytest>=9.0.1",
    "pyinstaller>=6.16.0",
]
all = [
    "chronicle-android-preprocessor[internal,gui,dev]",
]

[project.scripts]
chronicle-preprocess-gui = "chronicle_preprocessing_app.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "chronicle_preprocessing_app",
    "chronicle_preprocessing_app.core",
    "chronicle_preprocessing_app.core.preprocessing",
    "chronicle_preprocessing_app.core.preprocessing.algorithms",
    "chronicle_preprocessing_app.core.plotting",
    "chronicle_preprocessing_app.gui",
    "chronicle_preprocessing_app.gui.windows",
    "chronicle_preprocessing_app.gui.panels",
    "chronicle_preprocessing_app.gui.dialogs",
    "chronicle_preprocessing_app.gui.workers",
    "chronicle_preprocessing_app.gui.utils",
    "chronicle_preprocessing_app.cli",
    "chronicle_preprocessing_app.web",
    "chronicle_preprocessing_app.config",
    "chronicle_preprocessing_app.utils",
]

[tool.setuptools.package-data]
"*" = ["*.xlsx"]
"chronicle_preprocessing_app" = ["data/*.csv", "data/*.xlsx"]

[[tool.setuptools-rust.ext-modules]]
target = "chronicle_preprocessing_app._rust_app_usage_matcher"
path = "rust/chronicle_app_usage_matcher/Cargo.toml"
binding = "PyO3"
optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
