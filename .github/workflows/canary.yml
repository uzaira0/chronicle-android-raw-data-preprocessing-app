name: Canary

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install Playwright (chromium only)
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run smoke tests against deployed app
        run: npx --prefix web playwright test --grep "@smoke" --project=chromium
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "https://uzaira0.github.io/chronicle-android-raw-data-preprocessing-app/"

      - name: Upload report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: canary-report
          path: web/playwright-report/
          retention-days: 3
